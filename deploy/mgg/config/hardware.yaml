# Conservative onboard exploration defaults. Robot envelope and site bounds
# come from the adapter YAML; calibrate them for the deployment site.
# Sensor FOV is a gain-scoring model; mapping uses the actual sensor TF.
/**/mggplanner_node:
  ros__parameters:
    map:
      resolution: 0.15
      max_range: 20.0
    RobotParams:
      type: kGroundRobot
      size:
      - 0.2
      - 0.2
      - 0.15
      size_extension_min:
      - 0.0
      - 0.0
      - 0.0
      size_extension:
      - 0.05
      - 0.05
      - 0.05
      center_offset:
      - 0.0
      - 0.0
      - 0.0
      relax_ratio: 0.5
      bound_mode: kExtendedBound
      safety_extension:
      - 0.5
      - 0.75
      - 0.05
    SensorParams:
      sensor_list:
      - VLP16
      VLP16:
        type: kLidar
        max_range: 20.0
        center_offset:
        - 0.0
        - 0.0
        - 0.0
        rotations:
        - 0.0
        - 0.0
        - 0.0
        fov:
        - 6.283185307179586
        - 1.0471975511965976
        resolution:
        - 0.08726646259971647
        - 0.08726646259971647
        frontier_percentage_threshold: 0.05
    BoundedSpaceParams:
      Global:
        type: kCuboid
        min_val:
        - -18.0
        - -22.0
        - -0.2
        max_val:
        - 25.0
        - 8.0
        - 2.5
      Local:
        type: kCuboid
        min_val:
        - -8.0
        - -8.0
        - -0.5
        max_val:
        - 8.0
        - 8.0
        - 0.5
        min_extension:
        - 0.0
        - 0.0
        - 0.0
        max_extension:
        - 0.0
        - 0.0
        - 0.0
      LocalSearch:
        type: kCuboid
        min_val:
        - -60.0
        - -60.0
        - -3.0
        max_val:
        - 60.0
        - 60.0
        - 3.0
      LocalAdaptiveExp:
        type: kCuboid
        min_val:
        - -8.0
        - -8.0
        - -0.3
        max_val:
        - 8.0
        - 8.0
        - 0.3
      GridGraphLocal:
        type: kCuboid
        min_val:
        - -6.0
        - -6.0
        - -0.2
        max_val:
        - 6.0
        - 6.0
        - 0.3
        resolution:
        - 0.4
        - 0.4
        - 0.1
    RandomSamplerParams:
      SamplerForExploration:
        X:
          pdf_type: kUniform
          sample_mode: kLocal
        Y:
          pdf_type: kUniform
          sample_mode: kLocal
        Z:
          pdf_type: kUniform
          sample_mode: kLocal
        Heading:
          pdf_type: kUniform
          sample_mode: kManual
          min_val: -3.141592653589793
          max_val: 3.141592653589793
      SamplerForSearching:
        X:
          pdf_type: kUniform
          sample_mode: kLocal
        Y:
          pdf_type: kUniform
          sample_mode: kLocal
        Z:
          pdf_type: kUniform
          sample_mode: kLocal
        Heading:
          pdf_type: kUniform
          sample_mode: kManual
          min_val: -3.141592653589793
          max_val: 3.141592653589793
      SamplerForAdaptiveExp:
        X:
          pdf_type: kUniform
          sample_mode: kLocal
        Y:
          pdf_type: kUniform
          sample_mode: kLocal
        Z:
          pdf_type: kUniform
          sample_mode: kLocal
        Heading:
          pdf_type: kUniform
          sample_mode: kManual
          min_val: -3.141592653589793
          max_val: 3.141592653589793
    PlanningParams:
      robot_id: 1
      type: kAdaptiveExploration
      rr_mode: kGraph
      bound_mode: kExtremeBound
      exp_sensor_list:
      - VLP16
      edge_length_min: 0.05
      edge_length_max: 1.2
      edge_overshoot: 0.0
      num_vertices_max: 500
      num_edges_max: 10000
      num_loops_cutoff: 2000
      num_loops_max: 200000
      nearest_range: 0.6
      nearest_range_z: 0.15
      nearest_range_min: 0.05
      nearest_range_max: 1.0
      use_current_state: true
      augment_free_voxels_time: 1
      free_frustum_before_planning: false
      use_ray_model_for_volumetric_gain: true
      path_length_penalty: 0.07
      path_direction_penalty: 0.3
      hanging_vertex_penalty: 5.0
      exp_gain_voxel_size: 0.5
      occupied_voxel_gain: 0.0
      free_voxel_gain: 0.0
      unknown_voxel_gain: 60.0
      nonuniform_ray_cast: true
      ray_cast_step_size_multiplier: 1.0
      freespace_cloud_enable: false
      leafs_only_for_volumetric_gain: false
      cluster_vertices_for_gain: true
      clustering_radius: 0.2
      build_grid_local_graph: true
      max_ground_height: 0.3
      robot_height: 0.2
      max_inclination: 0.3490658503988659
      yaw_tangent_correction: true
      traverse_length_max: 10.0
      traverse_time_max: 40.0
      path_safety_enhance_enable: true
      path_interpolation_distance: 0.25
      auto_global_planner_enable: true
      relaxed_corridor_multiplier: 1.5
      homing_backward: false
      auto_homing_enable: true
      time_budget_limit: 3600
      global_frame_id: map
      global_path_inclination_check: true
      go_home_if_fully_explored: true
      geofence_checking_enable: false
    AdaptiveObbParams:
      type: kPca
      local_pointcloud_range: 40.0
      bounding_box_size_max: 60
    graph_publish_period_sec: 3.0
