# Optional ROS 2 onboard mapping participant. Start only after the robot's
# capture-time TF/odometry inputs and this image are validated on its platform.
# All peers need the same ordered names, mission UUID, and peer ROS domain.
# ROS_DOMAIN_ID remains the robot-local sensor/planning domain; optionally set
# SWARMDECK_PEER_DOMAIN_ID to the common cross-robot mapping domain.
services:
  peer_mapping:
    profiles: [peer_mapping]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cslam
    image: swarmdeck-cslam:planning
    network_mode: host
    ipc: host
    environment:
      PYTHONPATH: /app
      ROS_DOMAIN_ID: "${SWARMDECK_PEER_DOMAIN_ID:-${ROS_DOMAIN_ID:?Set the robot-local ROS domain}}"
      SWARMDECK_SENSOR_DOMAIN_ID: "${ROS_DOMAIN_ID:?Set the robot-local ROS domain}"
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_PEER_NAMES: "${SWARMDECK_PEER_NAMES:?Set the ordered JSON fleet robot names}"
      SWARMDECK_PEER_INDEX: "${SWARMDECK_PEER_INDEX:?Set this robot's zero-based index}"
      SWARMDECK_SENSOR_NAMESPACE: "${SWARMDECK_SENSOR_NAMESPACE:-}"
      SWARMDECK_CLOUD_TOPIC: "${SWARMDECK_CLOUD_TOPIC:?Set the sensor-frame cloud topic}"
      SWARMDECK_BASE_FRAME: "${SWARMDECK_BASE_FRAME:?Set the physical base frame}"
      SWARMDECK_ODOM_FRAME: "${SWARMDECK_ODOM_FRAME:?Set the continuous odometry frame}"
      SWARMDECK_SLAM_BACKEND: "${SWARMDECK_SLAM_BACKEND:-cslam}"
      SWARMDECK_TF_TOPIC: "${SWARMDECK_TF_TOPIC:-/tf}"
      SWARMDECK_TF_STATIC_TOPIC: "${SWARMDECK_TF_STATIC_TOPIC:-/tf_static}"
      SWARMDECK_COLOR_TOPIC: "${SWARMDECK_COLOR_TOPIC:-}"
      SWARMDECK_DEPTH_TOPIC: "${SWARMDECK_DEPTH_TOPIC:-}"
      SWARMDECK_COLOR_INFO_TOPIC: "${SWARMDECK_COLOR_INFO_TOPIC:-}"
      SWARMDECK_COLOR_FRAME: "${SWARMDECK_COLOR_FRAME:-}"
      SWARMDECK_COLOR_FRAME_CONVENTION: "${SWARMDECK_COLOR_FRAME_CONVENTION:-optical}"
      SWARMDECK_USE_SIM_TIME: "false"
      SWARMDECK_SERVER_URL: "${SWARMDECK_SERVER_URL:-}"
      SWARMDECK_MISSION_GC_KEEP_RECENT: "${SWARMDECK_MISSION_GC_KEEP_RECENT:-3}"
      SWARMDECK_MISSION_GC_DRY_RUN: "${SWARMDECK_MISSION_GC_DRY_RUN:-false}"
    volumes:
      - ../../autonomy:/app/autonomy:ro
      - ../../swarmdeck_ros/src/swarmdeck_peer:/cslam_ws/src/swarmdeck_peer:ro
      - onboard_peer_maps:/maps
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /cslam_ws/install/setup.bash && exec ros2 launch swarmdeck_peer peer.launch.py"]
    restart: "no"

  # Server-independent MOLA serialization of the peer's coherent snapshots.
  # This process does not join ROS or publish TF.
  peer_mola_mapping:
    profiles: [peer_mapping]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mapping
    image: swarmdeck-mapping:mola-native
    environment:
      SWARMDECK_MAPS_ROOT: /maps
      # The sidecar is mission pinned. Its volume is robot-local, while the
      # worker still uses the same snapshot discovery contract as the fleet
      # overlay.
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_MOLA_IMPORTER: /mapping_ws/install/swarmdeck_mapping/bin/swarmdeck-mola-import
      SWARMDECK_MOLA_MODE: persistent
      SWARMDECK_MOLA_PLANNER_MAPS: "${SWARMDECK_MOLA_PLANNER_MAPS:-false}"
      SWARMDECK_MOLA_TIMEOUT_S: "${SWARMDECK_MOLA_TIMEOUT_S:-30}"
      SWARMDECK_MOLA_POLL_S: "${SWARMDECK_MOLA_POLL_S:-1}"
      SWARMDECK_MOLA_RETRY_S: "${SWARMDECK_MOLA_RETRY_S:-5}"
      SWARMDECK_MOLA_MAX_OUTPUT_BYTES: "${SWARMDECK_MOLA_MAX_OUTPUT_BYTES:-268435456}"
      SWARMDECK_MOLA_KEEP_GENERATIONS: "${SWARMDECK_MOLA_KEEP_GENERATIONS:-2}"
      # A hardware peer builds only its own product, so one build at a time
      # (and one native runtime) is enough on the robot.
      SWARMDECK_MOLA_PARALLEL_PEERS: "${SWARMDECK_MOLA_PARALLEL_PEERS:-1}"
    volumes:
      - onboard_peer_maps:/maps
    command:
      - swarmdeck-mola-worker
      - --mode
      - persistent
      - --maps-root
      - /maps
      - --timeout
      - "${SWARMDECK_MOLA_TIMEOUT_S:-30}"
      - --poll
      - "${SWARMDECK_MOLA_POLL_S:-1}"
      - --retry
      - "${SWARMDECK_MOLA_RETRY_S:-5}"
      - --max-output-bytes
      - "${SWARMDECK_MOLA_MAX_OUTPUT_BYTES:-268435456}"
      - --keep-generations
      - "${SWARMDECK_MOLA_KEEP_GENERATIONS:-2}"
      - --parallel-peers
      - "${SWARMDECK_MOLA_PARALLEL_PEERS:-1}"
    restart: "no"


volumes:
  onboard_peer_maps:
