# Add to the normal ARGoS compose command. MGG remains idle until Explore.
services:
  sim:
    environment:
      SWARMDECK_MGG_ENABLED: "1"
  mgg:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mgg
    image: swarmdeck-mgg:local
    network_mode: service:sim
    environment:
      ROS_DOMAIN_ID: "42"
      # Avoid stale Fast DDS shared-memory ports when this sidecar restarts.
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
      SWARMDECK_ROBOT_COUNT: "${SWARMDECK_ROBOT_COUNT:-}"
    volumes:
      - ../../configs:/app/configs:ro
      - ../mgg:/app/deploy/mgg:ro
    depends_on:
      sim:
        condition: service_started
