# Isolated ARGoS test overlay. Add base, gpu, mgg, then this file; use -p planning.
services:
  server:
    ports: !override ["${SWARMDECK_TEST_SERVER_PORT:-18080}:8080"]
    environment:
      SWARMDECK_REPLICA_DIR: /app/sessions/replicas
      # Every simulation reset mints a new mission; the replicas of earlier
      # ones are discarded when the server starts. Name missions to preserve,
      # such as real maps sharing this store, in SWARMDECK_REPLICA_KEEP_SESSIONS.
      SWARMDECK_REPLICA_DISCARD_HISTORY: "true"
      SWARMDECK_REPLICA_KEEP_SESSIONS: ${SWARMDECK_REPLICA_KEEP_SESSIONS:-}
    volumes:
      - ../../server/swarmdeck_server:/app/server/swarmdeck_server:ro
      - ../../autonomy:/app/autonomy:ro
  ui:
    image: swarmdeck-ui:planning
    volumes:
      - ../../ui/dist:/usr/share/nginx/html:ro
    ports: !override ["${SWARMDECK_TEST_UI_PORT:-15173}:80"]
  mediamtx:
    environment:
      # The production MediaMTX owns ICE :8189. The WHEP HTTP exchange is
      # proxied by the test UI, but browser media still needs a host candidate
      # whose port reaches this isolated container.
      MTX_WEBRTCADDITIONALHOSTS: "${MEDIAMTX_TEST_WEBRTC_HOST:-${MEDIAMTX_WEBRTC_HOST:-192.168.1.161}}"
      MTX_WEBRTCLOCALUDPADDRESS: ":${SWARMDECK_TEST_MEDIA_PORT:-8190}"
      MTX_WEBRTCLOCALTCPADDRESS: ":${SWARMDECK_TEST_MEDIA_PORT:-8190}"
    ports: !override
      - "${SWARMDECK_TEST_MEDIA_PORT:-8190}:${SWARMDECK_TEST_MEDIA_PORT:-8190}/udp"
      - "${SWARMDECK_TEST_MEDIA_PORT:-8190}:${SWARMDECK_TEST_MEDIA_PORT:-8190}/tcp"
  sim:
    image: swarmdeck-sim:planning
    entrypoint: ["bash", "/app/deploy/docker/sim-entrypoint.sh"]
    volumes:
      - ../../autonomy:/app/autonomy:ro
      - ../../argos:/app/argos:ro
      - ../docker/sim-entrypoint.sh:/app/deploy/docker/sim-entrypoint.sh:ro
    environment:
      ROS_DOMAIN_ID: "${SWARMDECK_TEST_DOMAIN:-173}"
      EXPLORE_SECONDS: "0"
      # The scenario and the odometry model come from the deployment's env
      # file, so a reset can switch worlds (Bistro, SubT Finals) without
      # editing this overlay; the defaults are the Bistro trials' settings.
      SWARMDECK_ODOMETRY: "${SWARMDECK_ODOMETRY:-drift}"
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot_bistro.yaml}"
  argos:
    image: swarmdeck-argos:planning
    devices: !reset []
  fast_livo2:
    # This overlay uses synthetic odometry; `--profile argos up` must not
    # require the optional estimator image.
    profiles: !override ["fast-livo2"]
  mgg:
    image: swarmdeck-mgg:planning
    environment:
      ROS_DOMAIN_ID: "${SWARMDECK_TEST_DOMAIN:-173}"
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot_bistro.yaml}"
