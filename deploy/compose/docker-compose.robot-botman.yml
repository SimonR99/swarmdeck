# Botman bring-up owned entirely by SwarmDeck. The MIST workspace is mounted
# read-only and invoked through its installed rover_launch package; this file
# never edits, rebuilds, or overlays anything in /ssd/mist_ws.
#
# ROS_DOMAIN_ID: the MIST image's own entrypoint (/tmp/setup.sh inside
# bunker_super_odom:dev) exports `ROS_DOMAIN_ID=17` unconditionally, so every
# service built on that image lands on domain 17 no matter what Compose sets.
# SwarmDeck's own images set no domain and therefore default to 0. When the two
# halves disagree, discovery does not fail loudly: each side sees a healthy ROS
# graph containing only its own nodes, `ros2 topic list` still shows the
# subscribed names, and the robot simply reports pose (0, 0, 0) with no map and
# no camera. Keep this pinned to whatever that entrypoint exports.
x-ros-domain: &ros_domain "${BOTMAN_ROS_DOMAIN_ID:-17}"

services:
  # Base only. Lidar and SuperOdometry are separate services, same split as
  # Aslan, so mapping can come up without opening the CAN driver. Default
  # `docker compose up -d` starts lidar + slam + oak_camera + media +
  # duck_detector + nav2 + adapter. Pass `--profile base` when a person is at
  # the e-stop and can0 is up. Nav2 writes only cmd_vel_nav; it does not
  # command the base until a goal is active.
  robot_stack:
    image: bunker_super_odom:dev
    profiles: ["base"]
    container_name: swarmdeck-botman-stack
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    volumes:
      - /dev:/dev
      - ${BOTMAN_WORKSPACE:-/ssd/mist_ws}:/workspace:ro
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    environment:
      ROS_DOMAIN_ID: *ros_domain
    command:
      - bash
      - -c
      - >-
        export LD_LIBRARY_PATH=/usr/local/lib:$${LD_LIBRARY_PATH:-} &&
        . /workspace/install/setup.bash 2>/dev/null || true &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/botman_bunker.launch.py
        start_base:=true
        start_lidar:=false
        start_slam:=false
        can_interface:=${BOTMAN_CAN_INTERFACE:-can0}
    restart: unless-stopped

  # Ouster OS0-64 driver and SuperOdometry SLAM.
  #
  # The sensor is an OS-0-64-U13 running lidar_mode 512x10 with the
  # RNG19_RFL8_SIG16_NIR16 profile, read from its HTTP API on 2026-08-27. That
  # is 512 x 64 x 48 B = 1.5 MB per PointCloud2 at 10 Hz. This file previously
  # said OS1-128; the count matters because 1.5 MB is 7.4x net.core.rmem_max on
  # a stock kernel, which is why /ouster/points arrives at 8.7 Hz rather than 10
  # and /laser_odometry at 0.6 Hz. See docs/operations/known-issues.md.
  #
  # These are the robot's own nodes, started here for the same reason
  # `oak_camera` is: on 2026-08-07 `bunker_gnm.launch.py` in the read-only MIST
  # workspace was reduced to `declare_args + [bunker_launch]`, with the lidar,
  # SLAM, VectorNav, usb_cam and foxglove entries commented out on the line
  # above. `robot_stack` therefore starts the Bunker base and nothing else, and
  # SwarmDeck loses the two topics it depends on for pose and map —
  # /laser_odometry and /registered_scan have no publisher at all.
  #
  # Both services invoke the launch files already installed in /ssd/mist_ws with
  # that workspace's own configs, byte for byte the arguments the commented-out
  # block passed. Nothing here overrides MIST's tuning or calibration.
  #
  # If MIST restores that launch line, DELETE these two services rather than
  # leaving them: a second ouster driver cannot bind the same sensor, and two
  # SuperOdometry instances would publish conflicting /laser_odometry.
  lidar:
    image: bunker_super_odom:dev
    container_name: swarmdeck-botman-lidar
    network_mode: host
    ipc: host
    privileged: true
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
      # Raises the FastDDS shared-memory segment from its 512 KiB default to
      # 16 MB. A 1.57 MB /ouster/points sample does not fit the default, which
      # held the cloud to 2-5 Hz against a configured 10 Hz and starved
      # SuperOdometry with it. See deploy/dds/fastdds_large_data.xml.
      FASTRTPS_DEFAULT_PROFILES_FILE: /app/swarmdeck/deploy/dds/fastdds_large_data.xml
    volumes:
      - /dev:/dev
      - ${BOTMAN_WORKSPACE:-/ssd/mist_ws}:/workspace:ro
      # For the DDS profile above and the params file below, both of which have
      # to live in this repo rather than the read-only MIST workspace.
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    command:
      - bash
      - -c
      - >-
        export LD_LIBRARY_PATH=/usr/local/lib:$${LD_LIBRARY_PATH:-} &&
        . /workspace/install/setup.bash 2>/dev/null || true &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/botman_bunker.launch.py
        start_base:=false
        start_lidar:=true
        start_slam:=false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          . /opt/ros/humble/setup.sh &&
          . /workspace/install/setup.sh 2>/dev/null || true &&
          timeout 5 ros2 topic list 2>/dev/null | grep -qx '/ouster/points'
      interval: 20s
      timeout: 12s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # VectorNav VN-100. Started here for the same reason the lidar, SLAM and OAK
  # entries above are: bunker_gnm.launch.py in the read-only MIST workspace
  # defines vectornav_node and vectornav_sensor_msgs_node but never adds them
  # to its LaunchDescription (line 204 there is the commented-out list). The
  # IMU was the one entry this file had not picked up, which left
  # /vectornav/imu published only when someone had started the node by hand.
  #
  # SuperOdometry reads this as its imu_topic. Without it, it does not fail: it
  # logs "no IMU data, running LiDAR Odometry only" and quietly degrades to
  # lidar-only odometry.
  vectornav:
    image: bunker_super_odom:dev
    container_name: swarmdeck-botman-vectornav
    network_mode: host
    ipc: host
    privileged: true
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    volumes:
      # /dev/vectornav is a udev symlink to ttyUSB0; the whole of /dev is bound
      # so the link resolves inside the container.
      - /dev:/dev
      - ${BOTMAN_WORKSPACE:-/ssd/mist_ws}:/workspace:ro
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    command:
      - ros2
      - launch
      - /app/swarmdeck/adapters/adapter_ros2/launch/botman_vectornav.launch.py
    restart: unless-stopped

  slam:
    image: bunker_super_odom:dev
    container_name: swarmdeck-botman-slam
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
      # Raises the FastDDS shared-memory segment from its 512 KiB default to
      # 16 MB. A 1.57 MB /ouster/points sample does not fit the default, which
      # held the cloud to 2-5 Hz against a configured 10 Hz and starved
      # SuperOdometry with it. See deploy/dds/fastdds_large_data.xml.
      FASTRTPS_DEFAULT_PROFILES_FILE: /app/swarmdeck/deploy/dds/fastdds_large_data.xml
    depends_on:
      lidar:
        condition: service_healthy
      vectornav:
        condition: service_started
    volumes:
      - /dev:/dev
      - ${BOTMAN_WORKSPACE:-/ssd/mist_ws}:/workspace:ro
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    command:
      - bash
      - -c
      - >-
        export LD_LIBRARY_PATH=/usr/local/lib:$${LD_LIBRARY_PATH:-} &&
        . /workspace/install/setup.bash 2>/dev/null || true &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/botman_bunker.launch.py
        start_base:=false
        start_lidar:=false
        start_slam:=true
        start_imu:=true
        start_vectornav:=false
        imu_topic:=/vectornav/imu
        config_file:=/app/swarmdeck/adapters/adapter_ros2/config/${BOTMAN_SUPERODOM_CONFIG:-botman_superodom.yaml}
        calibration_file:=/app/swarmdeck/adapters/adapter_ros2/config/${BOTMAN_SUPERODOM_CALIB:-botman_superodom_calibration.yaml}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          . /opt/ros/humble/setup.sh &&
          . /workspace/install/setup.sh 2>/dev/null || true &&
          timeout 5 ros2 topic list 2>/dev/null | grep -qx '/laser_odometry'
      interval: 20s
      timeout: 12s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Botman's physical camera is an OAK-D Pro, which is a DepthAI USB device
  # (03e7:2485) rather than a V4L2 /dev/video* webcam.  The upstream
  # bunker_gnm launch only starts usb_cam and leaves its OAK block commented,
  # so own the missing launch here without changing /ssd/mist_ws.  Its driver
  # and firmware come from the same existing image/workspace as robot_stack;
  # the only writable/configuration source is this SwarmDeck checkout.
  oak_camera:
    image: bunker_super_odom:dev
    container_name: swarmdeck-botman-oak
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
      - ${BOTMAN_WORKSPACE:-/ssd/mist_ws}:/workspace:ro
      # RGBD by default, which is what lets duck detections become map
      # markers; see botman_oak_rgbd.yaml for the USB/CPU bandwidth it costs
      # and what remains unverified about it. `BOTMAN_OAK_PARAMS=botman_oak_rgb.yaml`
      # reverts to RGB-only if that cost is not worth paying.
      - ../../adapters/media/config/${BOTMAN_OAK_PARAMS:-botman_oak_rgbd.yaml}:/app/swarmdeck/botman_oak.yaml:ro
    command:
      - ros2
      - launch
      - depthai_ros_driver
      - camera.launch.py
      - name:=oak
      - params_file:=/app/swarmdeck/botman_oak.yaml
      - rectify_rgb:=false
      - use_rviz:=false
    restart: unless-stopped

  # Where the OAK-D Pro is bolted, relative to the frame Botman's pose is
  # reported in. Depth gives a detection a range; only this gives it a place.
  #
  # Starts by default alongside the rest of the stack now, but the numbers
  # still MUST come from a tape measure on the actual robot: the live TF tree
  # contains no calibrated edge onto the camera, and this project has already
  # paid for one hand-guessed extrinsic (0.47 m of pose error nobody noticed
  # for weeks). Left unset, the node refuses to parse its arguments and says so
  # in its log, rather than silently claiming the camera is the lidar — that
  # fail-loud default is deliberately NOT overridden with a guess here.
  #
  #   BOTMAN_OAK_X=<measured> BOTMAN_OAK_Y=<measured> BOTMAN_OAK_Z=<measured> \
  #   BOTMAN_OAK_ROLL=<measured> BOTMAN_OAK_PITCH=<measured> BOTMAN_OAK_YAW=<measured> \
  #   docker compose -f deploy/compose/docker-compose.robot-botman.yml up -d
  #
  # x forward / y left / z up from `os_lidar` to the DepthAI driver's own base
  # frame; the driver publishes the rest of the chain to the optical frames its
  # images are stamped with. Verify the child frame name against
  # `ros2 run tf2_tools view_frames` — it is the driver's, not ours.
  oak_mount_tf:
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-botman-oak-tf
    depends_on:
      oak_camera:
        condition: service_started
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - tf2_ros
      - static_transform_publisher
      - --x
      - "${BOTMAN_OAK_X:-unset-measure-the-oak-mount}"
      - --y
      - "${BOTMAN_OAK_Y:-unset-measure-the-oak-mount}"
      - --z
      - "${BOTMAN_OAK_Z:-unset-measure-the-oak-mount}"
      - --roll
      - "${BOTMAN_OAK_ROLL:-unset-measure-the-oak-mount}"
      - --pitch
      - "${BOTMAN_OAK_PITCH:-unset-measure-the-oak-mount}"
      - --yaw
      - "${BOTMAN_OAK_YAW:-unset-measure-the-oak-mount}"
      - --frame-id
      - botman_base_link
      - --child-frame-id
      - oak-d-base-frame
    restart: unless-stopped

  # The Ouster driver publishes os_sensor -> os_lidar and os_sensor -> os_imu,
  # but nothing anchored os_sensor to the chassis, so tf2 reported "two or more
  # unconnected trees" and no consumer could relate a lidar-framed point to
  # botman_base_link. Mast height measured 2026-08-31: os_lidar sits 0.28 m
  # above base_link and 0.16 m forward, and the factory os_sensor -> os_lidar
  # is +0.036 m with a 180 deg yaw, so os_sensor is at 0.244 m. os_sensor is
  # forward-aligned with the chassis; only os_lidar carries that pi.
  ouster_mount_tf:
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-botman-ouster-tf
    depends_on:
      lidar:
        condition: service_started
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - tf2_ros
      - static_transform_publisher
      - --x
      - "${BOTMAN_OUSTER_X:-0.16}"
      - --y
      - "${BOTMAN_OUSTER_Y:-0.0}"
      - --z
      - "${BOTMAN_OUSTER_Z:-0.244}"
      - --qx
      - "0"
      - --qy
      - "0"
      - --qz
      - "0"
      - --qw
      - "1"
      - --frame-id
      - botman_base_link
      - --child-frame-id
      - os_sensor
    restart: unless-stopped

  # The VN-100 stamps its messages "vectornav" but nothing published a TF for
  # that frame, so the IMU could not be related to anything.
  #
  # Rotation and X/Y from calibrate_imu_to_imu.py on 2026-08-31: the gyro pair
  # gives the rotation, the accelerometer pair gives the offset (measured over a
  # 0.6 rad/s spin, then composed with the Ouster factory os_lidar -> os_imu).
  # Cross-check: chained through the mast transform above, this yields
  # botman_base_link -> vectornav with 87.483 deg of yaw against the 87.48 deg
  # fastlivo_odom_to_base derived independently.
  #
  # Z IS NOT MEASURED. A spin about a vertical axis cannot see the vertical
  # offset: both rigid-body terms vanish along the rotation axis, so the solver
  # reports observability 0.000 for it however long you record. The value below
  # is the tape measurement ("the VectorNav is at the same height as the
  # camera", i.e. BOTMAN_OAK_Z below os_lidar), NOT a calibration result. To
  # measure it, rotate the sensor head about a horizontal axis and re-run.
  vectornav_mount_tf:
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-botman-vectornav-tf
    depends_on:
      vectornav:
        condition: service_started
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - tf2_ros
      - static_transform_publisher
      - --x
      - "${BOTMAN_VECTORNAV_X:-0.0010}"
      - --y
      - "${BOTMAN_VECTORNAV_Y:-0.0608}"
      - --z
      - "${BOTMAN_VECTORNAV_Z:--0.284}"
      - --qx
      - "${BOTMAN_VECTORNAV_QX:--0.008202}"
      - --qy
      - "${BOTMAN_VECTORNAV_QY:-0.002840}"
      - --qz
      - "${BOTMAN_VECTORNAV_QZ:--0.722461}"
      - --qw
      - "${BOTMAN_VECTORNAV_QW:-0.691357}"
      - --frame-id
      - os_lidar
      - --child-frame-id
      - vectornav
    restart: unless-stopped

  adapter:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-ros2
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-botman-adapter
    depends_on:
      lidar:
        condition: service_started
      slam:
        condition: service_started
      # `service_started`, NOT `service_healthy`, for both of these.
      #
      # Gating on health meant a subsystem that could degrade on its own instead
      # took the whole robot off the dashboard: no telemetry, no map, no camera,
      # and — the part that matters — no teleop. A detector that cannot reach
      # Ultralytics to fetch its weights on a site with no internet never
      # reports healthy, and a bt_navigator that will not reach `active` never
      # does either. "Nav2 won't come up, drive it manually" is exactly the
      # fallback that gate foreclosed.
      #
      # Nothing is lost by starting anyway. `capabilities()` is derived from what
      # actually resolves at runtime, so navigation is still not advertised until
      # the action server exists; and `ObjectDetector.detect_bgr` is fail-closed,
      # returning an empty batch and recording `last_error`. Both already degrade
      # correctly — the dependency was the only thing making them fatal.
      nav2:
        condition: service_started
      oak_camera:
        condition: service_started
      duck_detector:
        condition: service_started
    network_mode: host
    ipc: host
    volumes:
      # Adapter source comes off the mount, not out of the image. The image is
      # still what supplies the DEPENDENCIES (rclpy, cv2, websockets); this only
      # replaces our own Python, which is the same arrangement aslan and spot
      # already use. Without it a one-line adapter change needs a multi-minute
      # `up -d --build` on the robot, so botman -- the machine on the worst link
      # and therefore the one most often needing a fix -- was always the slowest
      # to update. The deployment helper rsyncs the source and recreates the
      # mounted services after the image build.
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
      - ${BOTMAN_WORKSPACE:-/ssd/mist_ws}:/workspace:ro
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
      SWARMDECK_DETECTOR_URL: http://127.0.0.1:8091
      SWARMDECK_ODOMETRY_BACKEND: ${BOTMAN_ODOMETRY_BACKEND:-superodometry}
      LD_LIBRARY_PATH: "/workspace/install/bunker_msgs/lib:/workspace/install/super_odometry_msgs/lib:${LD_LIBRARY_PATH:-}"
      PYTHONPATH: "/workspace/install/bunker_msgs/local/lib/python3.10/dist-packages:/workspace/install/super_odometry_msgs/local/lib/python3.10/dist-packages:/app/swarmdeck/adapters/protocol:/app/swarmdeck:/app/adapters/protocol:/app"
      AMENT_PREFIX_PATH: "/workspace/install/bunker_msgs:/workspace/install/super_odometry_msgs:/opt/ros/humble"
    command:
      - python3
      - /app/swarmdeck/adapters/adapter_ros2/adapter_ros2.py
      - --robot-id
      - botman_0
      - --config
      - /app/swarmdeck/adapters/adapter_ros2/config/bunker.yaml
      - --host
      - "${BACKEND_HOST:?set BACKEND_HOST to the SwarmDeck operator host}"
      - --port
      - "${BACKEND_PORT:-8080}"
    restart: unless-stopped

  duck_detector:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: ultralytics/ultralytics:8.4.14-jetson-jetpack6
    image: swarmdeck-duck-detector:jetpack6
    container_name: swarmdeck-botman-duck-detector
    network_mode: host
    ipc: host
    runtime: nvidia
    volumes:
      - duck_detector_models:/models
    # Detection is best-effort: a late duck costs nothing, a late scan costs
    # odometry. Uncapped it takes a full core, and on this 12-core Jetson that
    # contends with the DDS reader threads. Losing one fragment of a ~1 MB
    # PointCloud2 discards the whole scan, so /ouster/points collapses from its
    # configured 10 Hz while the single-datagram IMU stays at a clean 100 Hz --
    # measured 6.1 Hz against 100.01 Hz at load 16.5, with SuperOdometry
    # following its input down to 4.9 Hz.
    cpus: 1.5
    restart: unless-stopped

  # Production low-latency video path. This process converts the device-encoded
  # OAK JPEGs to 640x480 baseline H.264 and pushes only RTSP/TCP to central
  # MediaMTX, where the browser consumes it over WHEP/WebRTC.
  media:
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-botman-media
    depends_on:
      oak_camera:
        condition: service_started
    network_mode: host
    ipc: host
    volumes:
      # Same reasoning as the adapter above: our source off the mount, the
      # image's job is the dependencies (ffmpeg, cv_bridge).
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - python3
      - /app/swarmdeck/adapters/media/ros2_rtsp.py
      - --robot-id
      - botman_0
      - --topic
      - /oak/rgb/image_raw/compressed
      - --rtsp-url
      - "rtsp://${BACKEND_HOST}:${MEDIA_RTSP_PORT:-8554}/botman_0"
      - --bitrate-kbps
      - "${VIDEO_BITRATE_KBPS:-700}"
      - --fps
      - "${VIDEO_FPS:-10}"
      - --width
      - "${VIDEO_WIDTH:-640}"
      - --height
      - "${VIDEO_HEIGHT:-480}"
    restart: unless-stopped

  # The Ouster driver publishes os_sensor -> os_lidar and os_sensor -> os_imu,
  # but nothing anchored os_sensor to the chassis, so tf2 reported "two or more
  # unconnected trees" and no consumer could relate a lidar-framed point to
  # botman_base_link. Mast height measured 2026-08-31: os_lidar sits 0.28 m
  # above base_link and 0.16 m forward, and the factory os_sensor -> os_lidar
  # is +0.036 m with a 180 deg yaw, so os_sensor is at 0.244 m. os_sensor is
  # forward-aligned with the chassis; only os_lidar carries that pi.
  ouster_mount_tf:
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-botman-ouster-tf
    depends_on:
      lidar:
        condition: service_started
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - tf2_ros
      - static_transform_publisher
      - --x
      - "${BOTMAN_OUSTER_X:-0.16}"
      - --y
      - "${BOTMAN_OUSTER_Y:-0.0}"
      - --z
      - "${BOTMAN_OUSTER_Z:-0.244}"
      - --qx
      - "0"
      - --qy
      - "0"
      - --qz
      - "0"
      - --qw
      - "1"
      - --frame-id
      - botman_base_link
      - --child-frame-id
      - os_sensor
    restart: unless-stopped

  # The VN-100 stamps its messages "vectornav" but nothing published a TF for
  # that frame, so the IMU could not be related to anything.
  #
  # Rotation and X/Y from calibrate_imu_to_imu.py on 2026-08-31: the gyro pair
  # gives the rotation, the accelerometer pair gives the offset (measured over a
  # 0.6 rad/s spin, then composed with the Ouster factory os_lidar -> os_imu).
  # Cross-check: chained through the mast transform above, this yields
  # botman_base_link -> vectornav with 87.483 deg of yaw against the 87.48 deg
  # fastlivo_odom_to_base derived independently.
  #
  # Z IS NOT MEASURED. A spin about a vertical axis cannot see the vertical
  # offset: both rigid-body terms vanish along the rotation axis, so the solver
  # reports observability 0.000 for it however long you record. The value below
  # is the tape measurement ("the VectorNav is at the same height as the
  # camera", i.e. BOTMAN_OAK_Z below os_lidar), NOT a calibration result. To
  # measure it, rotate the sensor head about a horizontal axis and re-run.
  vectornav_mount_tf:
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-botman-vectornav-tf
    depends_on:
      vectornav:
        condition: service_started
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - tf2_ros
      - static_transform_publisher
      - --x
      - "${BOTMAN_VECTORNAV_X:-0.0010}"
      - --y
      - "${BOTMAN_VECTORNAV_Y:-0.0608}"
      - --z
      - "${BOTMAN_VECTORNAV_Z:--0.284}"
      - --qx
      - "${BOTMAN_VECTORNAV_QX:--0.008202}"
      - --qy
      - "${BOTMAN_VECTORNAV_QY:-0.002840}"
      - --qz
      - "${BOTMAN_VECTORNAV_QZ:--0.722461}"
      - --qw
      - "${BOTMAN_VECTORNAV_QW:-0.691357}"
      - --frame-id
      - os_lidar
      - --child-frame-id
      - vectornav
    restart: unless-stopped

  # SuperOdometry publishes /laser_odometry but not map -> base TF. Despite
  # naming os_lidar as the message child, its pose is the physical-forward
  # frame; botman.launch.py adds the measured pi-yaw edge to raw os_lidar.
  # Keep one bridge independent of Nav2 so costmaps still get a pose if Nav2
  # restarts. botman.launch.py disables its embedded copy in this deployment;
  # two broadcasters for the same dynamic edge corrupt the TF cache.
  odom_tf:
    image: swarmdeck-robot-nav2:local
    container_name: swarmdeck-botman-odom-tf
    depends_on:
      - slam
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - swarmdeck_nav
      - odom_to_tf
      - --ros-args
      - -r
      - __node:=botman_odom_to_tf_host
      - -p
      - odom_topic:=/laser_odometry
      - -p
      - parent_frame:=map
      - -p
      - child_frame:=botman_base_link
      - -p
      - planar:=true
      - -p
      - use_receive_time:=true
    restart: unless-stopped

  # Reuses swarmdeck_ros/src/swarmdeck_nav, with Botman-specific frames,
  # odometry and Ouster scan configuration. Nav2 writes only cmd_vel_nav;
  # the adapter remains the sole publisher to the real Bunker /cmd_vel and
  # relays autonomy only while its NavigateToPose goal is active.
  nav2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-nav2
    image: swarmdeck-robot-nav2:local
    container_name: swarmdeck-botman-nav2
    depends_on:
      # Nav2's pose comes from SLAM's /laser_odometry and its costmaps from the
      # lidar's /ouster/scan; robot_stack alone supplies neither.
      robot_stack:
        condition: service_started
      lidar:
        condition: service_healthy
      slam:
        condition: service_healthy
    network_mode: host
    ipc: host
    volumes:
      # Only for the DDS profile below. This image is otherwise self-contained.
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
      # footprint_cloud_to_scan reads the 1.57 MB /ouster/points RELIABLE, so it
      # needs the same enlarged segment as the writer. See the lidar service.
      FASTRTPS_DEFAULT_PROFILES_FILE: /app/swarmdeck/deploy/dds/fastdds_large_data.xml
    command:
      - ros2
      - launch
      - swarmdeck_nav
      - botman.launch.py
      - publish_odom_tf:=false
    # Every ros2 CLI call is wrapped in `timeout`, and the interval is well
    # clear of it. Without that this healthcheck LEAKS: `ros2 action list` and
    # `ros2 lifecycle get` hang indefinitely against a busy ROS graph instead
    # of exiting -- one was observed alive for 14m16s -- and each hung call
    # holds an open DDS participant. Measured on aslan_0 on 2026-08-26: ~5
    # leaked ros2/grep pairs per minute, load climbing 7.9 -> 24.3 in 17
    # minutes, and /ouster/points collapsing from its configured 10 Hz to
    # 2.96 Hz with gaps up to 2.9 s. SuperOdometry dead-reckons between scans
    # and snaps when a late one lands, so the visible symptom was odometry
    # jitter that worsened with uptime; the robot eventually stopped answering
    # SSH entirely and needed a physical power cycle.
    #
    # The hang is not specific to these two subcommands -- a plain `ros2 param
    # get` was seen hanging the same way -- so bounding the call is the fix,
    # not choosing a different query. `interval: 5s` against `timeout: 4s` also
    # left almost no margin, so a slow probe overlapped the next one.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          . /opt/ros/humble/setup.sh &&
          . /nav_ws/install/setup.sh &&
          timeout 5 ros2 action list | grep -qx '/botman_0/navigate_to_pose' &&
          timeout 5 ros2 lifecycle get /botman_0/bt_navigator | grep -q '^active'
      interval: 20s
      timeout: 12s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  duck_detector_models:
