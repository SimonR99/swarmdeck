# Aslan bring-up owned by SwarmDeck. MIST's ROS 2 workspace is mounted
# read-only; generated ROS artifacts live under /ssd/swarmdeck/.aslan_ros.
#
# ROS_DOMAIN_ID: bunker:dev's entrypoint (/tmp/setup.sh) exports
# `ROS_DOMAIN_ID=49` and `OUSTER_HOST_NAME=192.168.2.118` unconditionally.
# SwarmDeck's own images set no domain and therefore default to 0. Pin every
# service to 49 so lidar, SuperOdometry and the adapter share one graph.
x-ros-domain: &ros_domain "${ASLAN_ROS_DOMAIN_ID:-49}"

x-aslan-stack: &aslan-stack
  image: ${ASLAN_ROS_IMAGE:-bunker:dev}
  network_mode: host
  ipc: host
  privileged: true
  volumes:
    - /dev:/dev
    - ${ASLAN_MIST_WS:-/ssd/mist_ws_ros2}:/workspace:ro
    - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    - ${ASLAN_OVERLAY:-/ssd/swarmdeck/.aslan_ros}/install:/aslan_overlay:ro
  environment:
    ROS_DOMAIN_ID: *ros_domain
    LD_LIBRARY_PATH: "/usr/local/lib:${LD_LIBRARY_PATH:-}"
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    # Raises the FastDDS shared-memory segment from its 512 KiB default to
    # 16 MB. A 1.57 MB /ouster/points sample does not fit the default, which
    # held the cloud to 2-5 Hz against a configured 10 Hz and starved
    # SuperOdometry with it. See deploy/dds/fastdds_large_data.xml.
    FASTRTPS_DEFAULT_PROFILES_FILE: /app/swarmdeck/deploy/dds/fastdds_large_data.xml
  restart: unless-stopped

services:
  # Planner and PCI stay onboard; only operator commands cross the fleet link.
  mgg:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mgg
    image: swarmdeck-mgg:local
    container_name: swarmdeck-aslan-mgg
    network_mode: host
    environment:
      ROS_DOMAIN_ID: *ros_domain
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      SWARMDECK_ROBOT_ID: aslan_0
      SWARMDECK_ROBOT_CONFIG: /app/swarmdeck/adapters/adapter_ros2/config/aslan_bunker.yaml
    volumes:
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/jazzy/setup.bash &&
        source /opt/mgg/ros2/install/setup.bash &&
        ros2 launch /app/swarmdeck/deploy/mgg/hardware.launch.py
    restart: unless-stopped

  # Base only. Lidar and SuperOdometry are separate services, same split as
  # Botman. Default `docker compose up -d` starts the Bunker CAN driver
  # (robot_stack) alongside lidar, slam, oak_camera, media, duck_detector,
  # nav2, and adapter. Nav2 writes only cmd_vel_nav; it does not command the
  # base until a goal is active.
  robot_stack:
    <<: *aslan-stack
    container_name: swarmdeck-aslan-stack
    runtime: nvidia
    command:
      - bash
      - -c
      - >-
        export LD_LIBRARY_PATH=/usr/local/lib:$${LD_LIBRARY_PATH:-} &&
        . /aslan_overlay/setup.bash &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/aslan_bunker.launch.py
        start_base:=true
        start_lidar:=false
        start_slam:=false
        can_interface:=${ASLAN_CAN_INTERFACE:-can2}

  lidar:
    <<: *aslan-stack
    container_name: swarmdeck-aslan-lidar
    command:
      - bash
      - -c
      - >-
        export LD_LIBRARY_PATH=/usr/local/lib:$${LD_LIBRARY_PATH:-} &&
        . /aslan_overlay/setup.bash &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/aslan_bunker.launch.py
        start_base:=false
        start_lidar:=true
        start_slam:=false
    # setup.sh, NOT setup.bash. Docker runs CMD-SHELL under /bin/sh, and
    # sourcing a bash script there aborts the whole shell on the first bash-ism,
    # which `2>/dev/null || true` cannot rescue -- the probe then exits 2 having
    # printed nothing and the container never leaves `health: starting`. Colcon
    # generates setup.sh beside setup.bash for exactly this case. This went
    # unnoticed because the running containers predated the healthcheck.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export FASTRTPS_DEFAULT_PROFILES_FILE=/app/swarmdeck/deploy/dds/fastdds_udp_only.xml &&
          . /opt/ros/humble/setup.sh &&
          . /aslan_overlay/setup.sh 2>/dev/null || true &&
          timeout --signal=SIGINT --kill-after=1s 4s ros2 topic list 2>/dev/null | grep -qx '/ouster/points'
      interval: 20s
      timeout: 12s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  slam:
    <<: *aslan-stack
    container_name: swarmdeck-aslan-slam
    runtime: nvidia
    depends_on:
      lidar:
        condition: service_healthy
    command:
      - bash
      - -c
      - >-
        export LD_LIBRARY_PATH=/usr/local/lib:$${LD_LIBRARY_PATH:-} &&
        . /workspace/install/setup.bash &&
        . /aslan_overlay/setup.bash &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/aslan_bunker.launch.py
        start_base:=false
        start_lidar:=false
        start_slam:=true
        start_imu:=true
        start_vectornav:=${ASLAN_START_VECTORNAV:-true}
        imu_topic:=${ASLAN_IMU_TOPIC:-/vectornav/imu}
        config_file:=/app/swarmdeck/adapters/adapter_ros2/config/${ASLAN_SUPERODOM_CONFIG:-aslan_superodom.yaml}
        calibration_file:=/app/swarmdeck/adapters/adapter_ros2/config/${ASLAN_SUPERODOM_CALIB:-aslan_superodom_calibration.yaml}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export FASTRTPS_DEFAULT_PROFILES_FILE=/app/swarmdeck/deploy/dds/fastdds_udp_only.xml &&
          . /opt/ros/humble/setup.sh &&
          . /workspace/install/setup.sh 2>/dev/null || true &&
          . /aslan_overlay/setup.sh 2>/dev/null || true &&
          pgrep -f '^/aslan_overlay/lib/super_odometry/imu_preintegration_node( |$)' >/dev/null &&
          timeout --signal=SIGINT --kill-after=1s 4s ros2 topic list 2>/dev/null | grep -qx '/laser_odometry'
      interval: 20s
      timeout: 12s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # SuperOdometry publishes /laser_odometry but not continuous odometry -> base TF. Despite
  # naming os_lidar as the message child, its pose is the physical-forward
  # frame; aslan.launch.py adds the measured pi-yaw edge to raw os_lidar.
  # Same host-side bridge Aslan already runs as swarmdeck-aslan-odom-tf.
  odom_tf:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-nav2
    image: swarmdeck-robot-nav2:local
    container_name: swarmdeck-aslan-odom-tf
    depends_on:
      - slam
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - swarmdeck_nav
      - odom_to_tf
      - --ros-args
      - -r
      - __node:=aslan_odom_to_tf_host
      - -p
      - odom_topic:=/laser_odometry
      - -p
      - parent_frame:=map
      - -p
      - child_frame:=aslan_base_link
      - -p
      - planar:=true
      - -p
      - use_receive_time:=true
    restart: unless-stopped


  nav2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-nav2
    image: swarmdeck-robot-nav2:local
    container_name: swarmdeck-aslan-nav2
    depends_on:
      lidar:
        condition: service_healthy
      slam:
        condition: service_healthy
    network_mode: host
    ipc: host
    volumes:
      # Only for the DDS profile below. This image is otherwise self-contained.
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
      # footprint_cloud_to_scan reads the 1.57 MB /ouster/points RELIABLE, so it
      # needs the same enlarged segment as the writer. See the lidar service.
      FASTRTPS_DEFAULT_PROFILES_FILE: /app/swarmdeck/deploy/dds/fastdds_large_data.xml
    # publish_odom_tf:=false because the odom_tf service above already
    # broadcasts continuous navigation -> os_lidar. Same split as Botman: keep one bridge
    # independent of Nav2 so costmaps still get a pose if Nav2 restarts,
    # and keep Nav2 from starting a second broadcaster for that same edge.
    command:
      - ros2
      - launch
      - swarmdeck_nav
      - aslan.launch.py
      - publish_odom_tf:=false
    # Disposable health probes use UDP and have a forced-kill deadline.
    # See Botman's healthcheck for the zero-byte SHM port / leaked CLI incident.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export FASTRTPS_DEFAULT_PROFILES_FILE=/app/swarmdeck/deploy/dds/fastdds_udp_only.xml &&
          . /opt/ros/humble/setup.sh &&
          . /nav_ws/install/setup.sh &&
          timeout --signal=SIGINT --kill-after=1s 4s ros2 action list | grep -qx '/aslan_0/follow_path' &&
          timeout --signal=SIGINT --kill-after=1s 4s ros2 lifecycle get /aslan_0/controller_server | grep -q '^active'
      interval: 20s
      timeout: 12s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # bunker:dev already has rclpy. websockets is a one-time --user install into
  # /ssd/swarmdeck/.aslan_pip (the Jetson pip index does not carry it):
  #   docker run --rm --entrypoint pip3 \
  #     -v /ssd/swarmdeck/.aslan_pip:/root/.local bunker:dev \
  #     install --user --index-url https://pypi.org/simple websockets==10.4
  adapter:
    image: bunker:dev
    container_name: swarmdeck-aslan-adapter
    depends_on:
      lidar:
        condition: service_started
      slam:
        condition: service_started
      nav2:
        condition: service_started
      duck_detector:
        condition: service_started
      oak_camera:
        condition: service_started
      oak_mount_tf:
        condition: service_started
    network_mode: host
    ipc: host
    volumes:
      - ${ASLAN_MIST_WS:-/ssd/mist_ws_ros2}:/workspace:ro
      # `/app/swarmdeck`, matching every other robot and the `aslan-stack`
      # anchor above. This service used to mount the repo at `/app` instead,
      # which is why aslan alone needed different paths in its command.
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
      - ${ROBOT_REPO:-/ssd/swarmdeck}/.aslan_pip:/root/.local:ro
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
      SWARMDECK_DETECTOR_URL: http://127.0.0.1:8091
      SWARMDECK_ODOMETRY_BACKEND: ${ASLAN_ODOMETRY_BACKEND:-superodometry}
    command:
      - python3
      - /app/swarmdeck/adapters/adapter_ros2/adapter_ros2.py
      - --robot-id
      - aslan_0
      - --config
      - /app/swarmdeck/adapters/adapter_ros2/config/aslan_bunker.yaml
      - --host
      - "${BACKEND_HOST:?set BACKEND_HOST to the SwarmDeck operator host}"
      - --port
      - "${BACKEND_PORT:-8080}"
    restart: unless-stopped

  # Same OAK-D RGB-D profile as Botman. depthai_ros_driver must be in the
  # mounted workspace; this service does not install it. RGB-D is the default
  # because map projection needs the aligned stereo stream.
  oak_camera:
    <<: *aslan-stack
    container_name: swarmdeck-aslan-oak
    command:
      - bash
      - -c
      - >-
        . /opt/ros/humble/setup.bash &&
        . /workspace/install/setup.bash &&
        ros2 launch depthai_ros_driver camera.launch.py
        name:=oak
        params_file:=/app/swarmdeck/adapters/media/config/${ASLAN_OAK_PARAMS:-botman_oak_rgbd.yaml}
        rectify_rgb:=false
        use_rviz:=false

  # Camera mount relative to the SLAM pose frame. Aslan's approximate z value
  # is -0.04 m relative to os_lidar; replace it with a measured transform when
  # available. Without this edge, depth has no map coordinate.
  oak_mount_tf:
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-aslan-oak-tf
    depends_on:
      oak_camera:
        condition: service_started
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - tf2_ros
      - static_transform_publisher
      - --x
      - "${ASLAN_OAK_X:-0.03}"
      - --y
      - "${ASLAN_OAK_Y:-0.00}"
      - --z
      - "${ASLAN_OAK_Z:--0.04}"
      - --roll
      - "${ASLAN_OAK_ROLL:-0}"
      - --pitch
      - "${ASLAN_OAK_PITCH:-0}"
      - --yaw
      - "${ASLAN_OAK_YAW:-0}"
      - --frame-id
      - aslan_base_link
      - --child-frame-id
      - oak-d-base-frame
    restart: unless-stopped

  # Production low-latency video. This process encodes 640x480 H.264 and pushes
  # only RTSP/TCP to MediaMTX.
  media:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-ros2
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-aslan-media
    depends_on:
      oak_camera:
        condition: service_started
    network_mode: host
    ipc: host
    volumes:
      # Our source off the mount, dependencies out of the image — see the
      # adapter service. Without this an `ros2_rtsp.py` fix needs a rebuild.
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - python3
      - /app/swarmdeck/adapters/media/ros2_rtsp.py
      - --robot-id
      - aslan_0
      - --topic
      - /oak/rgb/image_raw/compressed
      - --rtsp-url
      - "rtsp://${BACKEND_HOST}:${MEDIA_RTSP_PORT:-8554}/aslan_0"
      - --bitrate-kbps
      - "${VIDEO_BITRATE_KBPS:-700}"
      - --fps
      - "${VIDEO_FPS:-10}"
      - --width
      - "${VIDEO_WIDTH:-640}"
      - --height
      - "${VIDEO_HEIGHT:-480}"
    restart: unless-stopped

  duck_detector:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: ultralytics/ultralytics:8.4.14-jetson-jetpack6
    image: swarmdeck-duck-detector:jetpack6
    container_name: swarmdeck-aslan-duck-detector
    network_mode: host
    ipc: host
    runtime: nvidia
    volumes:
      - duck_detector_models:/models
    # Detection is best-effort: a late duck costs nothing, a late scan costs
    # odometry. Uncapped it takes a full core, and on this 12-core Jetson that
    # contends with the DDS reader threads.
    cpus: 1.5
    restart: unless-stopped

volumes:
  duck_detector_models:
