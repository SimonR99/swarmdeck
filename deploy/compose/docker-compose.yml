# SwarmDeck Docker stack
#
# Full sim (ARGoS):    docker compose --profile argos up --build -d
# Legacy sim (Gazebo): docker compose --profile gazebo up --build -d
# Mock fleet only:     docker compose --profile mock up --build -d
#
# UI: http://localhost:5173   API: http://localhost:8080
#
# The ARGoS profile is three services around one volume:
#
#   argos        physics, Filament rendering and sensors. No ROS at all.
#   sim          the ROS 2 Jazzy side: bridge, SLAM Toolbox, Nav2, adapter_sim.
#   ultrafusion  the odometry front-end, on ROS 2 Humble, in its own DDS domain.
#
# They talk over Unix sockets on `swarmdeck_runtime`, mounted at /run/swarmdeck
# in all three, which also carries the generated world and experiment. Sockets
# rather than DDS because Humble and Jazzy do not have to interoperate this
# way: Ultra-Fusion's estimate returns through ARGoS as an ordinary odometry
# sensor reading, and its own ROS traffic never leaves its container.

# Keep the project identity stable when this file is invoked from the repository
# root, from deploy/compose, or through the Makefile. Without this, Compose
# derives the name from the compose-file directory and can leave two stacks
# (for example, `swarmdeck-*` and `compose-*`) competing for the same ports.
name: swarmdeck

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    image: swarmdeck-server:local
    command:
      - python
      - -m
      - swarmdeck_server
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --config
      # The SAME config the fleet runs. Hardcoding this meant the backend could
      # silently use different map resolution, extent, start poses and
      # merge_mode from the simulation it was serving — `merge_mode: cslam` in a
      # scenario file simply never took effect, because the server was still
      # reading 4robot.yaml.
      - "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
    environment:
      SWARMDECK_SLAM_URL: http://slam:8090
    ports:
      - "8080:8080"
    volumes:
      - ../../sessions:/app/sessions
      - ../../configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/config"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    restart: unless-stopped

  slam:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.slam
    image: swarmdeck-slam:local
    command:
      - python
      - -m
      - swarmdeck_slam
      - --host
      - "0.0.0.0"
      - --port
      - "8090"
      - --server-url
      - "http://server:8080"
    environment:
      SWARMDECK_SERVER_URL: http://server:8080
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
      # Set to a path under /app/sessions to record every accepted keyframe for
      # offline replay (slam/tools/replay.py). Empty disables capture, which is
      # the normal state: a long run writes one file per keyframe.
      SWARMDECK_SLAM_CAPTURE_DIR: "${SWARMDECK_SLAM_CAPTURE_DIR:-}"
      # Hardware validation on the 2026-08-31 Botman/Aslan session showed that
      # the odometry-free reconstructor split 85 keyframes into 27 fragments
      # and published a non-planar Aslan frame.  The graph solver kept all 85
      # keyframes in one component while moving either onboard trajectory by
      # at most 2.1 cm.  Preserve the robot SLAM trajectories and optimize only
      # their verified closure residuals by default.
      SWARMDECK_SLAM_REGISTRATION_MODE: "${SWARMDECK_SLAM_REGISTRATION_MODE:-graph}"
      SWARMDECK_SLAM_ANCHOR_ROBOT: "${SWARMDECK_SLAM_ANCHOR_ROBOT:-}"
      # Opt-in replay for production captures.  A deployment can point both
      # variables at one durable session directory and restart without losing
      # the in-memory graph.  Empty capture remains the normal simulation
      # default, so old datasets are never replayed accidentally.
      SWARMDECK_SLAM_RESTORE_CAPTURE: "${SWARMDECK_SLAM_RESTORE_CAPTURE:-false}"
      SWARMDECK_SLAM_QUEUE_CAP: "${SWARMDECK_SLAM_QUEUE_CAP:-2048}"
    volumes:
      # Datasets land beside the session recordings, on the host, so a capture
      # survives the container it was made in.
      - ../../sessions:/app/sessions
      - ../../configs:/app/configs:ro
    ports:
      - "8090:8090"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ui
    image: swarmdeck-ui:local
    depends_on:
      server:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "5173:80"
    restart: unless-stopped

  # Robots publish one H.264 RTSP stream each; MediaMTX fans those streams out
  # to browser WHEP/WebRTC clients. Port 8891 is the host-side WHEP diagnostic
  # API; on real robots the streams publish direct to :8554.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    environment:
      # WebRTC's HTTP handshake is not the media path. Browsers also need a
      # reachable ICE host and the fixed 8189 port; without these Docker's
      # private 172.x address is advertised and every WHEP session times out.
      MTX_WEBRTCADDITIONALHOSTS: "${MEDIAMTX_WEBRTC_HOST:-192.168.1.161}"
      # Keep a TCP ICE fallback for networks that block UDP.
      MTX_WEBRTCLOCALTCPADDRESS: ":8189"
    ports:
      - "8554:8554"   # RTSP ingest from robots
      - "8000:8000/udp" # RTSP RTP UDP stream
      - "8001:8001/udp" # RTSP RTCP UDP control
      - "8889:8889"   # WHEP WebRTC egress to browser
      - "8891:8889"   # diagnostic WHEP port for browser direct-test
      - "8189:8189/udp" # WebRTC ICE media
      - "8189:8189/tcp" # WebRTC ICE fallback
    restart: unless-stopped

  # --- ARGoS profile ------------------------------------------------------

  # The simulator. Everything photorealistic happens here.
  argos:
    profiles: ["argos"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.argos
      args:
        # Pinned: a moving simulator is not a baseline. Bump deliberately, and
        # only together with whatever in swarmdeck_sim needs the new commit.
        ARGOS_REF: "${ARGOS_REF:-da70805238285772405b4a4315e65970b69857ce}"
    image: swarmdeck-argos:local
    depends_on:
      # `sim` only, deliberately. Both of ARGoS's sockets are bound by other
      # containers and it dials them, but the entrypoint does the real waiting:
      # first for the generated experiment, then for the estimator socket ONLY
      # when that experiment declares an <external_estimator>.
      #
      # Naming ultrafusion here as well would drag it into every `up`, and the
      # development path (`make up-argos-dev`, odometry:=drift) has no
      # estimator to wait for and no reason to pay for one.
      sim:
        condition: service_started
    environment:
      RUNTIME_DIR: /run/swarmdeck
      # The portable default. `make up-argos-gpu` turns it off and hands the
      # container a real device; measured at 0.93x real time on lavapipe with
      # four robots, a 17-ring lidar and 320x240 RGB-D cameras.
      SWARMDECK_SOFTWARE_RENDER: "${SWARMDECK_SOFTWARE_RENDER:-true}"
    volumes:
      - swarmdeck_runtime:/run/swarmdeck
    # A blown-out render or a diverged estimator is not fixed by restarting
    # into the same state, and a restart loop hides the log that says why.
    restart: "no"

  # ROS 2 Jazzy: the bridge ARGoS dials, per-robot SLAM and Nav2, adapter_sim.
  sim:
    profiles: ["argos"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sim
    image: swarmdeck-sim:local
    depends_on:
      server:
        condition: service_healthy
      slam:
        condition: service_healthy
      mediamtx:
        condition: service_started
      duck_detector:
        condition: service_healthy
    environment:
      BACKEND_HOST: server
      BACKEND_PORT: "8080"
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
      SWARMDECK_ROBOT_COUNT: "${SWARMDECK_ROBOT_COUNT:-}"
      SWARMDECK_SIM_BACKEND: argos
      RUNTIME_DIR: /run/swarmdeck
      ADAPTER_DELAY: "${ADAPTER_DELAY:-60}"
      SLAM_BACKEND: "${SLAM_BACKEND:-toolbox}"
      GRID_3D: "${GRID_3D:-false}"
      # Detection targets scattered through the world, classes assigned round
      # robin from adapters/perception/catalog.py.
      SWARMDECK_TARGETS: "${SWARMDECK_TARGETS:-10}"
      # external = Ultra-Fusion. drift = ARGoS's synthetic model, roughly 4x
      # faster because it leaves the lockstep exchange, and correspondingly
      # less faithful. `make up-argos-dev` sets drift; nothing else should.
      SWARMDECK_ODOMETRY: "${SWARMDECK_ODOMETRY:-external}"
      # Diagnostic: log each robot's wheel encoder readings, which are the
      # only view of what the controller actually commanded. Separates a
      # controller fault from a physics one when a robot will not turn.
      SWARMDECK_DEBUG_ENCODERS: "${SWARMDECK_DEBUG_ENCODERS:-}"
      # Bootstrap the maps by exploring, then stop and hand the fleet to the
      # operator. Without this nothing drives, and goals issued against an empty
      # map jam robots into walls where wheel slip destroys their odometry.
      EXPLORE_SECONDS: "${EXPLORE_SECONDS:-600}"
      SWARMDECK_KEYFRAME_VOXEL_M: "${SWARMDECK_KEYFRAME_VOXEL_M:-0.05}"
      SWARMDECK_KEYFRAME_MAX_YAW_RATE_DEG: "${SWARMDECK_KEYFRAME_MAX_YAW_RATE_DEG:-8.0}"
      ROS_DOMAIN_ID: "42"
      SWARMDECK_DETECTOR_URL: http://duck_detector:8091
    volumes:
      - ../../sessions:/app/sessions
      - ../../configs:/app/configs:ro
      - swarmdeck_runtime:/run/swarmdeck
    shm_size: "2gb"
    restart: unless-stopped

  # Ultra-Fusion: lidar-wheel-inertial odometry, on ROS 2 Humble.
  #
  # This is what makes the simulated fleet's drift real rather than modelled.
  # ARGoS's own <odometry implementation="drift"> perturbs ground-truth motion
  # with Gaussian noise: it cannot slip a wheel against an obstacle, lose a
  # scan to geometric degeneracy, or fail to converge. Ultra-Fusion can, because
  # it is really estimating from the simulated sensors, which is the problem
  # swarmdeck-slam exists to solve.
  ultrafusion:
    profiles: ["argos"]
    build:
      context: ./../docker/ultrafusion
      dockerfile: Dockerfile
    image: swarmdeck-ultrafusion:local
    environment:
      # lwio = LiDAR-Wheel-Inertial Odometry, which is what the generated
      # experiment's `channels="imu,lidar,wheels"` streams. Changing one
      # without the other withholds a channel the mode fuses.
      MODE: "${UF_MODE:-lwio}"
      RUNTIME_DIR: /run/swarmdeck
      SOCK: /run/swarmdeck/uf.sock
      RESULTS: /results
      FASTRTPS_DEFAULT_PROFILES_FILE: /tools/fastdds_large.xml
      # Its own domain. The estimator's ROS traffic is internal to this
      # container and must not land in the Jazzy graph on domain 42.
      ROS_DOMAIN_ID: "43"
    # NO sysctls here, and that is not an oversight. net.core.rmem_max is a
    # global kernel setting, not a per-network-namespace one: a container
    # inherits the host's value, cannot raise it, and Docker refuses to create
    # the container at all if you ask it to ("open sysctl
    # net.core.rmem_default file: permission denied"). The buffer this service
    # actually needs is therefore a HOST requirement, checked and reported at
    # startup by run_uf.sh:
    #
    #     sudo sysctl -w net.core.rmem_max=8388608
    #
    # It matters because one VLP-16 revolution is ~630 KB, larger than the
    # stock 208 KB socket buffer, so the fragments overflow and the message is
    # never reassembled. The publisher reports success and nothing logs an
    # error; the only symptom is the estimator appearing to diverge.
    volumes:
      - ../../deploy/docker/ultrafusion:/tools:ro
      - ../../sessions/ultrafusion:/results
      - swarmdeck_runtime:/run/swarmdeck
    command: ["bash", "-c", "exec bash /tools/run_uf.sh"]
    restart: "no"

  # --- legacy Gazebo profile ----------------------------------------------
  #
  # Kept runnable as an A/B control against the ARGoS stack, and only for
  # that: it renders with `gpu_lidar` raytracing on the CPU at roughly 0.58x
  # real time, and its odometry is an EKF over simulated wheels and gyro
  # rather than a real front-end. `configs/4robot.yaml` now selects a 17-ring
  # lidar for the ARGoS estimator, which is expensive here; use
  # SWARMDECK_CONFIG=/app/configs/baseline_legacy.yaml for the cheap one.
  gazebo:
    profiles: ["gazebo"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gazebo
    image: swarmdeck-sim:local
    depends_on:
      server:
        condition: service_healthy
      slam:
        condition: service_healthy
      mediamtx:
        condition: service_started
      duck_detector:
        condition: service_healthy
    environment:
      BACKEND_HOST: server
      BACKEND_PORT: "8080"
      # SWARMDECK_CONFIG=/app/configs/baseline_legacy.yaml reproduces the sensor
      # the project shipped before the lidar profiles, as an A/B control.
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
      SWARMDECK_ROBOT_COUNT: "${SWARMDECK_ROBOT_COUNT:-}"
      HEADLESS: "true"
      ADAPTER_DELAY: "${ADAPTER_DELAY:-60}"
      SLAM_BACKEND: "${SLAM_BACKEND:-toolbox}"
      # Keep RTAB-Map's occupancy in 3D, so `cloud_map` carries real structure
      # and the GUI's 3D view shows a building rather than a flat tracing of the
      # 2D map. Off by default because it halves the real-time factor
      # (0.54 -> 0.25 measured) and the 2D map is unaffected either way — but it
      # belongs here rather than only in the entrypoint, because "why is the 3D
      # view flat" is otherwise a question with no discoverable answer.
      #   GRID_3D=true SLAM_BACKEND=rtabmap make docker-up-gpu
      GRID_3D: "${GRID_3D:-false}"
      FUSE_IMU: "${FUSE_IMU:-true}"
      # Bootstrap the maps by exploring, then stop and hand the fleet to the
      # operator. Without this nothing drives, and goals issued against an empty
      # map jam robots into walls where wheel slip destroys their odometry.
      EXPLORE_SECONDS: "${EXPLORE_SECONDS:-600}"
      # Coordinated performs one bounded common-observation leg, then allocates
      # non-overlapping frontier goals jointly. `reactive` is the legacy A/B.
      EXPLORE_STRATEGY: "${EXPLORE_STRATEGY:-coordinated}"
      # Evaluation-only truth recorder. When omitted during a keyframe capture,
      # the entrypoint writes ground_truth.csv beside those keyframes. Nothing
      # in the adapter, planner, or SLAM service receives this path or topic.
      SWARMDECK_SLAM_CAPTURE_DIR: "${SWARMDECK_SLAM_CAPTURE_DIR:-}"
      SWARMDECK_GROUND_TRUTH_PATH: "${SWARMDECK_GROUND_TRUTH_PATH:-}"
      # Keyframe production budget, per robot. Voxel matches the 0.05 m grid so
      # the render is not coarser than the cells it fills; the yaw gate drops
      # captures taken mid-turn, whose clouds are motion-skewed. Both are
      # exposed here because the right values differ per platform and per link
      # -- an OS1-128 at 0.05 m is a much larger cloud than the sim's 33 rings.
      # Set the yaw gate to 0 to disable it (used when capturing a dataset that
      # should stay ablatable offline).
      SWARMDECK_KEYFRAME_VOXEL_M: "${SWARMDECK_KEYFRAME_VOXEL_M:-0.05}"
      SWARMDECK_KEYFRAME_MAX_YAW_RATE_DEG: "${SWARMDECK_KEYFRAME_MAX_YAW_RATE_DEG:-8.0}"
      ROS_DOMAIN_ID: "42"
      LIBGL_ALWAYS_SOFTWARE: "1"
      SWARMDECK_DETECTOR_URL: http://duck_detector:8091
      VIDEO_BITRATE_KBPS: "${VIDEO_BITRATE_KBPS:-700}"
      VIDEO_FPS: "${VIDEO_FPS:-10}"
      VIDEO_WIDTH: "${VIDEO_WIDTH:-640}"
      VIDEO_HEIGHT: "${VIDEO_HEIGHT:-480}"
    volumes:
      - ../../sessions:/app/sessions
      - ../../configs:/app/configs:ro
    shm_size: "2gb"
    restart: unless-stopped

  # Shared AI perception for every simulated robot. The adapter still owns
  # camera transport and protocol publication; this sidecar only maps pixels
  # to YOLOE boxes. Hardware compose files use the matching JetPack image.
  duck_detector:
    profiles: ["argos", "gazebo"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: "${ULTRALYTICS_IMAGE:-ultralytics/ultralytics:8.4.14-cpu}"
    image: swarmdeck-duck-detector:cpu
    # Bounded, because nothing in torch bounds it. Measured unrestricted on a
    # 20-core host: 727% CPU for a best-effort perception sidecar, which
    # starved the estimator and the simulator sharing the machine and dropped
    # the simulation's real-time factor by 2.4x. The detector runs at 5 Hz on
    # 320x240 frames; it does not need seven cores to do that.
    cpus: "3.0"
    environment:
      SWARMDECK_YOLO_DEVICE: cpu
      # torch and OpenCV each default to one thread per core and multiply.
      # `cpus` alone would cap the total but leave them thrashing over it.
      OMP_NUM_THREADS: "${SWARMDECK_DETECTOR_THREADS:-3}"
      MKL_NUM_THREADS: "${SWARMDECK_DETECTOR_THREADS:-3}"
      OPENBLAS_NUM_THREADS: "${SWARMDECK_DETECTOR_THREADS:-3}"
      NUMEXPR_NUM_THREADS: "${SWARMDECK_DETECTOR_THREADS:-3}"
    volumes:
      - duck_detector_models:/models
    restart: unless-stopped

  # Synthetic fleet (no Gazebo / ROS)
  mock:
    profiles: ["mock"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    image: swarmdeck-server:local
    depends_on:
      server:
        condition: service_healthy
    command:
      - python
      - adapters/adapter_mock/mock_adapter.py
      - --host
      - server
      - --port
      - "8080"
      - --robots
      - "${MOCK_ROBOTS:-4}"
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  duck_detector_models:
  # Two Unix sockets, the generated world glTF and the generated
  # experiment, shared by argos, sim and ultrafusion. A named volume
  # rather than a bind mount because the path has to be identical and
  # SHORT in all three: a Unix socket path over 107 bytes fails to bind.
  swarmdeck_runtime:
