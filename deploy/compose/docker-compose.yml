# SwarmDeck Docker stack
#
# Default (full sim):  docker compose --profile gazebo up --build -d
#
# Mock fleet only:     docker compose --profile mock up --build -d
#
# UI: http://localhost:5173   API: http://localhost:8080

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    image: swarmdeck-server:local
    command:
      - python
      - -m
      - swarmdeck_server
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --config
      # The SAME config the fleet runs. Hardcoding this meant the backend could
      # silently use different map resolution, extent, start poses and
      # merge_mode from the simulation it was serving — `merge_mode: cslam` in a
      # scenario file simply never took effect, because the server was still
      # reading 4robot.yaml.
      - "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
    ports:
      - "8080:8080"
    volumes:
      - ../../sessions:/app/sessions
      - ../../configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/config"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    restart: unless-stopped

  ui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ui
    image: swarmdeck-ui:local
    depends_on:
      server:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "5173:80"
    restart: unless-stopped

  # Robots publish one H.264 RTSP stream each; MediaMTX fans those streams out
  # to browser WHEP/WebRTC clients. Port 8891 is the host-side WHEP diagnostic
  # API; on real robots the streams publish direct to :8554.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    ports:
      - "8554:8554"   # RTSP ingest from robots
      - "8889:8889"   # WHEP WebRTC egress to browser
      - "8891:8889"   # diagnostic WHEP port for browser direct-test
    restart: unless-stopped

  # Full simulated fleet + 2D SLAM + Nav2 + simulation adapter.
  gazebo:
    profiles: ["gazebo"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gazebo
    image: swarmdeck-sim:local
    depends_on:
      server:
        condition: service_healthy
      mediamtx:
        condition: service_started
      duck_detector:
        condition: service_healthy
    environment:
      BACKEND_HOST: server
      BACKEND_PORT: "8080"
      # SWARMDECK_CONFIG=/app/configs/baseline_legacy.yaml reproduces the sensor
      # the project shipped before the lidar profiles, as an A/B control.
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
      HEADLESS: "true"
      ADAPTER_DELAY: "${ADAPTER_DELAY:-60}"
      SLAM_BACKEND: "${SLAM_BACKEND:-toolbox}"
      # Keep RTAB-Map's occupancy in 3D, so `cloud_map` carries real structure
      # and the GUI's 3D view shows a building rather than a flat tracing of the
      # 2D map. Off by default because it halves the real-time factor
      # (0.54 -> 0.25 measured) and the 2D map is unaffected either way — but it
      # belongs here rather than only in the entrypoint, because "why is the 3D
      # view flat" is otherwise a question with no discoverable answer.
      #   GRID_3D=true SLAM_BACKEND=rtabmap make docker-up-gpu
      GRID_3D: "${GRID_3D:-false}"
      FUSE_IMU: "${FUSE_IMU:-true}"
      # Bootstrap the maps by exploring, then stop and hand the fleet to the
      # operator. Without this nothing drives, and goals issued against an empty
      # map jam robots into walls where wheel slip destroys their odometry.
      EXPLORE_SECONDS: "${EXPLORE_SECONDS:-600}"
      ROS_DOMAIN_ID: "42"
      LIBGL_ALWAYS_SOFTWARE: "1"
      SWARMDECK_DETECTOR_URL: http://duck_detector:8091
    volumes:
      - ../../sessions:/app/sessions
      - ../../configs:/app/configs:ro
    shm_size: "2gb"
    restart: unless-stopped

  # Shared AI perception for every simulated robot. The adapter still owns
  # camera transport and protocol publication; this sidecar only maps pixels
  # to YOLOE boxes. Hardware compose files use the matching JetPack image.
  duck_detector:
    profiles: ["gazebo"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: "${ULTRALYTICS_IMAGE:-ultralytics/ultralytics:8.4.14-cpu}"
    image: swarmdeck-duck-detector:cpu
    environment:
      SWARMDECK_YOLO_DEVICE: cpu
    volumes:
      - duck_detector_models:/models
    restart: unless-stopped

  # Synthetic fleet (no Gazebo / ROS)
  mock:
    profiles: ["mock"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    image: swarmdeck-server:local
    depends_on:
      server:
        condition: service_healthy
    command:
      - python
      - adapters/adapter_mock/mock_adapter.py
      - --host
      - server
      - --port
      - "8080"
      - --robots
      - "${MOCK_ROBOTS:-4}"
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  duck_detector_models:
