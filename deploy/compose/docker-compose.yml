# SwarmDeck Docker stack
#
#
# UI: http://localhost:5173   API: http://localhost:8080
#
# The ARGoS profile is three services around one volume:
#
#   argos        physics, Filament rendering and sensors. No ROS at all.
#   sim          the ROS 2 Jazzy bridge, odometry, controller and adapter.
#   fast_livo2   the odometry front-end (Fast-LIVO2), in its own DDS domain.
#
# They talk over Unix sockets on `swarmdeck_runtime`, mounted at /run/swarmdeck
# in all three, which also carries the generated world and experiment. Sockets
# rather than DDS because Humble/Jazzy graphs do not have to interoperate this
# way: Fast-LIVO2's estimate returns through ARGoS as an ordinary odometry
# sensor reading, and its own ROS traffic never leaves its container.

# Keep the project identity stable when this file is invoked from the repository
# root, from deploy/compose, or through the Makefile. Without this, Compose
# derives the name from the compose-file directory and can leave two stacks
# (for example, `swarmdeck-*` and `compose-*`) competing for the same ports.
name: swarmdeck

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    image: swarmdeck-server:local
    command:
      - python
      - -m
      - swarmdeck_server
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --config
      # The SAME config the fleet runs. Hardcoding this meant the backend could
      # silently use different map resolution, extent, start poses and
      # scenario file simply never took effect, because the server was still
      # reading 4robot.yaml.
      - "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
    environment:
      # Every replica upload, moving command and reset is fenced on the fleet
      # mission; the host reset supervisor shares this directory.
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_SIM_RESET_DIR: /app/sessions/simulation-reset
    ports:
      - "8080:8080"
    volumes:
      - ../../sessions:/app/sessions
      - ../../configs:/app/configs:ro
      - ../../scripts:/app/scripts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/config"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    restart: unless-stopped

  # Cortex, the AI fleet-intelligence sidecar. Behind its own profile because
  # it bind-mounts an operator's personal tooling (`agy`, a Gemini config and
  # optional SSH keys). On any machine where those paths are omitted, defaults
  # prevent Docker from creating unwanted root directories.
  #
  #   docker compose --profile agent up -d agent
  agent:
    profiles: ["agent"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    image: swarmdeck-agent:local
    ports:
      - "8085:8085"
    environment:
      SWARMDECK_SERVER_URL: http://server:8080
      SWARMDECK_RTSP_BASE_URL: rtsp://mediamtx:8554
      CORTEX_WORKSPACE: "${CORTEX_WORKSPACE:-/app}"
      CORTEX_PROVIDER: "${CORTEX_PROVIDER:-agy}"
      CORTEX_MODEL: "${CORTEX_MODEL:-}"
      CORTEX_REASONING_EFFORT: "${CORTEX_REASONING_EFFORT:-}"
      CORTEX_PROVIDER_COMMAND: "${CORTEX_PROVIDER_COMMAND:-}"
      # Phase 1 is a transparent pass-through: jobs/events are persisted while
      # AGY keeps the exact operator-facing behavior.
      CORTEX_SUPERVISOR_MODE: "${CORTEX_SUPERVISOR_MODE:-observe}"
      CORTEX_STATE_DB: /app/sessions/cortex/state.db
      # The local planner is opt-in shadow traffic and never executes tools.
      CORTEX_SHADOW_PLANNER: "${CORTEX_SHADOW_PLANNER:-false}"
      CORTEX_PLANNER_PROVIDER: "${CORTEX_PLANNER_PROVIDER:-}"
      CORTEX_PLANNER_MODEL: "${CORTEX_PLANNER_MODEL:-}"
      CORTEX_PLANNER_CONTEXT_LENGTH: "${CORTEX_PLANNER_CONTEXT_LENGTH:-8192}"
      CORTEX_PLANNER_MAX_TOKENS: "${CORTEX_PLANNER_MAX_TOKENS:-256}"
      CORTEX_OLLAMA_URL: "${CORTEX_OLLAMA_URL:-http://ollama:11434}"
      CORTEX_OPENCODE_COMMAND: "${CORTEX_OPENCODE_COMMAND:-opencode}"
      CORTEX_OPENCODE_URL: "${CORTEX_OPENCODE_URL:-}"
      CORTEX_OPENCODE_AGENT: "${CORTEX_OPENCODE_AGENT:-}"
      # Reported as a future code-only worker; observe mode never dispatches it.
      CORTEX_CODING_WORKER: "${CORTEX_CODING_WORKER:-agy}"
      SSH_AUTH_SOCK: /tmp/ssh-auth.sock
    volumes:
      - ../../sessions:/app/sessions
      - ../../agent:/app/agent
      - ../../scripts:/app/scripts
      - ../..:${CORTEX_WORKSPACE:-/app}
      - ${HOST_AGY_BIN:-~/.local/bin/agy}:/usr/local/bin/agy:ro
      - ${HOST_GEMINI_DIR:-~/.gemini}:/root/.gemini
      - ${HOST_SSH_DIR:-~/.ssh}:/root/.ssh_host:ro
      - ${SSH_AUTH_SOCK_REAL:-/dev/null}:/tmp/ssh-auth.sock
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Private local inference for opt-in Cortex shadow planning. No host port is
  # published: the unauthenticated Ollama API stays on the Compose network.
  ollama:
    profiles: ["local-ai"]
    image: "ollama/ollama:${OLLAMA_VERSION:-0.33.2}"
    environment:
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-32768}"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
      # Inference stays local. Registry pulls remain an explicit operator action
      # through `make local-ai-pull`; cloud-hosted model execution is disabled.
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped


  ui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ui
    image: swarmdeck-ui:local
    depends_on:
      server:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "5173:80"
    restart: unless-stopped

  # Robots publish one H.264 RTSP stream each; MediaMTX fans those streams out
  # to browser WHEP/WebRTC clients. Port 8891 is the host-side WHEP diagnostic
  # API; on real robots the streams publish direct to :8554.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    environment:
      # WebRTC's HTTP handshake is not the media path. Browsers also need a
      # reachable ICE host and the fixed 8189 port; without these Docker's
      # private 172.x address is advertised and every WHEP session times out.
      MTX_WEBRTCADDITIONALHOSTS: "${MEDIAMTX_WEBRTC_HOST:-192.168.1.161}"
      # Keep a TCP ICE fallback for networks that block UDP.
      MTX_WEBRTCLOCALTCPADDRESS: ":8189"
    ports:
      - "8554:8554"   # RTSP ingest from robots
      - "8000:8000/udp" # RTSP RTP UDP stream
      - "8001:8001/udp" # RTSP RTCP UDP control
      - "8889:8889"   # WHEP WebRTC egress to browser
      - "8891:8889"   # diagnostic WHEP port for browser direct-test
      - "8189:8189/udp" # WebRTC ICE media
      - "8189:8189/tcp" # WebRTC ICE fallback
    restart: unless-stopped

  # --- ARGoS profile ------------------------------------------------------

  # The simulator. Everything photorealistic happens here.
  argos:
    profiles: ["argos"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.argos
      args:
        # Pinned: a moving simulator is not a baseline. Bump deliberately, and
        # only together with whatever in swarmdeck_sim needs the new commit.
        ARGOS_REF: "${ARGOS_REF:-83ca4602}"
    image: swarmdeck-argos:local
    depends_on:
      # `sim` only, deliberately. Both of ARGoS's sockets are bound by other
      # containers and it dials them, but the entrypoint does the real waiting:
      # first for the generated experiment, then for the estimator socket ONLY
      # when that experiment declares an <external_estimator>.
      #
      # Naming fast_livo2 here as well would drag it into every `up`, and the
      # development path (`make up-argos-dev`, odometry:=drift) has no
      # estimator to wait for and no reason to pay for one.
      sim:
        condition: service_started
    environment:
      RUNTIME_DIR: /run/swarmdeck
      # The portable default. `make up-argos-gpu` turns it off and hands the
      # container a real device; measured at 0.93x real time on lavapipe with
      # four robots, a 17-ring lidar and 320x240 RGB-D cameras.
      SWARMDECK_SOFTWARE_RENDER: "${SWARMDECK_SOFTWARE_RENDER:-true}"
    volumes:
      # Bistro assets (2.6 GB) live in the sibling argos3-examples checkout,
      # which is a layout scenario/worlds.py already looks for. They
      # are far too large to vendor. Mounted at the same path in both the
      # generator and the renderer, because the generated .argos embeds the
      # resolved path and ARGoS must be able to open it too.
      - ${SWARMDECK_BISTRO_DIR:-../../../argos3-examples/experiments/bistro_exploration/assets}:/app/argos3-examples/experiments/bistro_exploration/assets:ro
      # SubT Finals assets (~60 MB of glTF) live in the sibling argos3 checkout,
      # regenerated there by photorealism/environments/import_fuel_world.py.
      # Same both-sides mount as Bistro, for the same reason.
      - ${SWARMDECK_SUBT_FINALS_DIR:-../../../argos3/src/plugins/simulator/photorealism/environments/finals_prize_round_world_01}:/app/argos3-environments/finals_prize_round_world_01:ro
      - swarmdeck_runtime:/run/swarmdeck
    # A blown-out render or a diverged estimator is not fixed by restarting
    # into the same state, and a restart loop hides the log that says why.
    restart: "no"

  sim:
    profiles: ["argos"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sim
    image: swarmdeck-sim:local
    depends_on:
      server:
        condition: service_healthy
      mediamtx:
        condition: service_started
      # Optional: `sim-up --detector` starts it and sets
      # SWARMDECK_DETECTOR_URL. When it runs, the sim waits for it as before.
      duck_detector:
        condition: service_healthy
        required: false
    environment:
      # Which sensor channels ARGoS streams to the external estimator.
      # Ultra-Fusion (lwio) never read the camera; FAST-LIVO2 needs it, and
      # without it emits no pose at all while logging nothing.
      # Render cost scales with this; 640,480 gives a photometric estimator
      # something to track where 320,240 of a sparse scene does not.
      SWARMDECK_CAMERA_RESOLUTION: "${SWARMDECK_CAMERA_RESOLUTION:-320,240}"
      SWARMDECK_ESTIMATOR_CHANNELS: "${SWARMDECK_ESTIMATOR_CHANNELS:-imu,lidar,wheels}"
      BACKEND_HOST: server
      BACKEND_PORT: "8080"
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
      SWARMDECK_ROBOT_COUNT: "${SWARMDECK_ROBOT_COUNT:-}"
      RUNTIME_DIR: /run/swarmdeck
      ADAPTER_DELAY: "${ADAPTER_DELAY:-60}"
      SWARMDECK_SLAM_BACKEND: "${SWARMDECK_SLAM_BACKEND:-cslam}"
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      # MGG is the only planner; the adapter dispatches its routes to the
      # Nav2 controller and plans in the continuous odometry frame.
      SWARMDECK_MGG_ENABLED: "1"
      SWARMDECK_PLANNING_BACKEND: mgg
      SWARMDECK_PLANNING_FRAME_TEMPLATE: "{robot}/odom"
      # Frontier reservations and peer keep-out discs are arbitrated in the
      # surveyed deployment frame (plan.md invariant 19).
      SWARMDECK_PEER_COORDINATION: "1"
      SWARMDECK_COORDINATION_FRAME: deployment
      # Detection targets scattered through the world, classes assigned round
      # robin from adapters/perception/catalog.py.
      SWARMDECK_TARGETS: "${SWARMDECK_TARGETS:-10}"
      # fast_livo2 = Fast-LIVO2. drift = ARGoS's synthetic model, roughly 4x
      # faster because it leaves the lockstep exchange, and correspondingly
      # less faithful. `make up-argos-dev` sets drift; nothing else should.
      SWARMDECK_ODOMETRY: "${SWARMDECK_ODOMETRY:-fast_livo2}"
      # Seconds of fleet exploration to bootstrap at startup; 0 leaves the
      # fleet parked until the operator starts Explore.
      EXPLORE_SECONDS: "${EXPLORE_SECONDS:-0}"
      SWARMDECK_KEYFRAME_VOXEL_M: "${SWARMDECK_KEYFRAME_VOXEL_M:-0.05}"
      SWARMDECK_KEYFRAME_MAX_YAW_RATE_DEG: "${SWARMDECK_KEYFRAME_MAX_YAW_RATE_DEG:-8.0}"
      ROS_DOMAIN_ID: "${SWARMDECK_TEST_DOMAIN:-173}"
      # Empty (the default) runs the adapters without a detector.
      SWARMDECK_DETECTOR_URL: "${SWARMDECK_DETECTOR_URL:-}"
      SWARMDECK_DETECTION_PERIOD_S: "${SWARMDECK_DETECTION_PERIOD_S:-1.0}"
      VIDEO_BITRATE_KBPS: "${VIDEO_BITRATE_KBPS:-500}"
      VIDEO_FPS: "${VIDEO_FPS:-5}"
      VIDEO_WIDTH: "${VIDEO_WIDTH:-320}"
      VIDEO_HEIGHT: "${VIDEO_HEIGHT:-240}"
    volumes:
      # Bistro assets (2.6 GB) live in the sibling argos3-examples checkout,
      # which is a layout scenario/worlds.py already looks for. They
      # are far too large to vendor. Mounted at the same path in both the
      # generator and the renderer, because the generated .argos embeds the
      # resolved path and ARGoS must be able to open it too.
      - ${SWARMDECK_BISTRO_DIR:-../../../argos3-examples/experiments/bistro_exploration/assets}:/app/argos3-examples/experiments/bistro_exploration/assets:ro
      - ${SWARMDECK_SUBT_FINALS_DIR:-../../../argos3/src/plugins/simulator/photorealism/environments/finals_prize_round_world_01}:/app/argos3-environments/finals_prize_round_world_01:ro
      - ../../sessions:/app/sessions
      - ../../configs:/app/configs:ro
      - ../../swarmdeck_ros/src:/app/swarmdeck_ros/src:ro
      - ../../adapters:/app/adapters:ro
      - swarmdeck_runtime:/run/swarmdeck
    shm_size: "2gb"
    restart: unless-stopped

  # Fast-LIVO2: Direct LiDAR-Inertial-Visual Odometry, on ROS 2 (multi-arch AMD64 & ARM64).
  fast_livo2:
    profiles: ["argos"]
    build:
      context: ./../docker/fast_livo2
      dockerfile: Dockerfile
    image: swarmdeck-fast-livo2:local
    environment:
      IMG_EN: "${IMG_EN:-0}"
      RUNTIME_DIR: /run/swarmdeck
      SOCK: /run/swarmdeck/uf.sock
      RESULTS: /results
      FASTRTPS_DEFAULT_PROFILES_FILE: /tools/fastdds_large.xml
      ROS_DOMAIN_ID: "43"
    volumes:
      - ../../deploy/docker/fast_livo2:/tools:ro
      - ../../sessions/fast_livo2:/results
      - swarmdeck_runtime:/run/swarmdeck
    command: ["bash", "-c", "exec bash /tools/run_fast_livo.sh"]
    restart: "no"

  # Shared AI perception for every simulated robot. The adapter still owns
  # camera transport and protocol publication; this sidecar only maps pixels
  # to YOLOE boxes. Hardware compose files use the matching JetPack image.
  # Off unless asked for (`sim-up --detector`, `make up-sim DETECTOR=1`): its
  # own profile keeps `--profile argos` from starting it.
  duck_detector:
    profiles: ["detector"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: "${ULTRALYTICS_IMAGE:-ultralytics/ultralytics:8.4.14-cpu}"
    image: swarmdeck-duck-detector:cpu
    # Bounded, because nothing in torch bounds it. Measured unrestricted on a
    # 20-core host: 727% CPU for a best-effort perception sidecar, which
    # starved the estimator and the simulator sharing the machine and dropped
    # the simulation's real-time factor by 2.4x. Throttled to 1 Hz per robot
    # on 320x240 frames and capped to 1 CPU core.
    cpus: "${SWARMDECK_DETECTOR_CPUS:-1.0}"
    environment:
      SWARMDECK_YOLO_DEVICE: cpu
      # torch and OpenCV each default to one thread per core and multiply.
      # `cpus` alone would cap the total but leave them thrashing over it.
      OMP_NUM_THREADS: "${SWARMDECK_DETECTOR_THREADS:-1}"
      MKL_NUM_THREADS: "${SWARMDECK_DETECTOR_THREADS:-1}"
      OPENBLAS_NUM_THREADS: "${SWARMDECK_DETECTOR_THREADS:-1}"
      NUMEXPR_NUM_THREADS: "${SWARMDECK_DETECTOR_THREADS:-1}"
    volumes:
      - duck_detector_models:/models
    restart: unless-stopped

  # Synthetic fleet without ROS.
  mock:
    profiles: ["mock"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    image: swarmdeck-server:local
    depends_on:
      server:
        condition: service_healthy
    command:
      - python
      - adapters/adapter_mock/mock_adapter.py
      - --host
      - server
      - --port
      - "8080"
      - --robots
      - "${MOCK_ROBOTS:-4}"
    healthcheck:
      disable: true
    restart: unless-stopped
  # MGG and the peer/MOLA pipeline are part of every ARGoS deployment.
  mgg:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mgg
    network_mode: service:sim
    environment:
      SWARMDECK_SLAM_BACKEND: "${SWARMDECK_SLAM_BACKEND:-cslam}"
      ROS_DOMAIN_ID: "${SWARMDECK_TEST_DOMAIN:-173}"
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      SWARMDECK_CONFIG: "${SWARMDECK_CONFIG:-/app/configs/4robot.yaml}"
      SWARMDECK_ROBOT_COUNT: "${SWARMDECK_ROBOT_COUNT:-}"
      SWARMDECK_PEER_NAMES: "${SWARMDECK_PEER_NAMES:-}"
      SWARMDECK_SIM_RESET_DIR: /run/swarmdeck-reset
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_PLANNING_FRAME_TEMPLATE: "{robot}/odom"
      SWARMDECK_MAPS_ROOT: /maps
    volumes:
      - ../../configs:/app/configs:ro
      - ../mgg:/app/deploy/mgg:ro
      - ../../sessions/simulation-reset:/run/swarmdeck-reset
      - peer_maps:/maps:ro
    command: ["bash", "-lc", "source /opt/ros/jazzy/setup.bash && source /opt/mgg/ros2/install/setup.bash && exec python3 /app/deploy/mgg/supervisor.py"]
    depends_on:
      sim:
        condition: service_started

  peer0: &peer0
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cslam
    image: swarmdeck-cslam:planning
    network_mode: service:sim
    environment: &peer-env
      PYTHONPATH: /app
      ROS_DOMAIN_ID: "${SWARMDECK_TEST_DOMAIN:-173}"
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_PEER_NAMES: '${SWARMDECK_PEER_NAMES:-["robot_0","robot_1","robot_2","robot_3"]}'
      SWARMDECK_PEER_INDEX: "0"
      SWARMDECK_USE_SIM_TIME: "true"
      SWARMDECK_CAPTURE_PROVIDER: "${SWARMDECK_CAPTURE_PROVIDER:-unknown}"
      SWARMDECK_COLOR_FRAME_CONVENTION: body
      SWARMDECK_SIM_RESET_DIR: /run/swarmdeck-reset
      SWARMDECK_PEER_BODY_MASK: "${SWARMDECK_PEER_BODY_MASK:-false}"
      SWARMDECK_PEER_PLATFORMS: "${SWARMDECK_PEER_PLATFORMS:-}"
      SWARMDECK_INTER_ROBOT_CLOSURES: "${SWARMDECK_INTER_ROBOT_CLOSURES:-false}"
      SWARMDECK_SLAM_BACKEND: "${SWARMDECK_SLAM_BACKEND:-cslam}"
      SWARMDECK_PLANNING_FRAME_TEMPLATE: "{robot}/odom"
      SWARMDECK_SERVER_URL: http://server:8080
    volumes:
      - ../../autonomy:/app/autonomy:ro
      - ../autonomy:/app/deploy/autonomy:ro
      - peer_maps:/maps
      - ../../sessions/simulation-reset:/run/swarmdeck-reset:ro
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /cslam_ws/install/setup.bash && exec ros2 launch /app/deploy/autonomy/peer.launch.py"]
    depends_on:
      sim:
        condition: service_started
    restart: unless-stopped
  peer1:
    <<: *peer0
    environment:
      <<: *peer-env
      SWARMDECK_PEER_INDEX: "1"
  peer2:
    <<: *peer0
    environment:
      <<: *peer-env
      SWARMDECK_PEER_INDEX: "2"
  peer3:
    <<: *peer0
    environment:
      <<: *peer-env
      SWARMDECK_PEER_INDEX: "3"

  mapping:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mapping
    image: swarmdeck-mapping:mola-native
    environment:
      SWARMDECK_MAPS_ROOT: /maps
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_MOLA_IMPORTER: /mapping_ws/install/swarmdeck_mapping/bin/swarmdeck-mola-import
      SWARMDECK_MOLA_MODE: persistent
      SWARMDECK_MOLA_PLANNER_MAPS: "${SWARMDECK_MOLA_PLANNER_MAPS:-true}"
      SWARMDECK_MOLA_TIMEOUT_S: "${SWARMDECK_MOLA_TIMEOUT_S:-30}"
      SWARMDECK_MOLA_POLL_S: "${SWARMDECK_MOLA_POLL_S:-1}"
      SWARMDECK_MOLA_RETRY_S: "${SWARMDECK_MOLA_RETRY_S:-5}"
      SWARMDECK_MOLA_MAX_OUTPUT_BYTES: "${SWARMDECK_MOLA_MAX_OUTPUT_BYTES:-268435456}"
      SWARMDECK_MOLA_KEEP_GENERATIONS: "${SWARMDECK_MOLA_KEEP_GENERATIONS:-2}"
      SWARMDECK_MOLA_PARALLEL_PEERS: "${SWARMDECK_MOLA_PARALLEL_PEERS:-4}"
    volumes:
      - peer_maps:/maps
    command:
      - swarmdeck-mola-worker
      - --mode
      - persistent
      - --maps-root
      - /maps
      - --timeout
      - "${SWARMDECK_MOLA_TIMEOUT_S:-30}"
      - --poll
      - "${SWARMDECK_MOLA_POLL_S:-1}"
      - --retry
      - "${SWARMDECK_MOLA_RETRY_S:-5}"
      - --max-output-bytes
      - "${SWARMDECK_MOLA_MAX_OUTPUT_BYTES:-268435456}"
      - --keep-generations
      - "${SWARMDECK_MOLA_KEEP_GENERATIONS:-2}"
      - --parallel-peers
      - "${SWARMDECK_MOLA_PARALLEL_PEERS:-4}"
    restart: unless-stopped

volumes:
  peer_maps:

  duck_detector_models:
  # Two Unix sockets, the generated world glTF and the generated
  # experiment, shared by argos, sim and fast_livo2. A named volume
  # rather than a bind mount because the path has to be identical and
  # SHORT in all three: a Unix socket path over 107 bytes fails to bind.
  swarmdeck_runtime:
  ollama_models:
