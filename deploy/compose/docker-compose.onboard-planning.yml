# Onboard planning overlay used with peers.yml and mapping.yml. Select the
# legacy cloud stack explicitly when native MOLA products are unavailable.
services:
  server:
    environment:
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_SIM_RESET_DIR: /app/sessions/simulation-reset
  sim:
    environment:
      # The simulation adapter, MGG, peers and indexed query service are one ROS
      # graph. This domain is advanced on every reset to exclude delayed DDS
      # traffic from the previous mission.
      ROS_DOMAIN_ID: "${SWARMDECK_TEST_DOMAIN:-173}"
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_MAPPING_AUTHORITY: onboard
      SWARMDECK_PEER_COORDINATION: "1"
      SWARMDECK_PLANNING_BACKEND: mgg
      SWARMDECK_PLANNING_FRAME_TEMPLATE: "{robot}/odom"
  mgg:
    environment:
      ROS_DOMAIN_ID: "${SWARMDECK_TEST_DOMAIN:-173}"
      SWARMDECK_PLANNING_FRAME_TEMPLATE: "{robot}/odom"
      SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
      SWARMDECK_MGG_MAP_BACKEND: "${SWARMDECK_MGG_MAP_BACKEND:-mola_snapshot}"
      SWARMDECK_PLANNER_MAP_PROVIDER: "${SWARMDECK_PLANNER_MAP_PROVIDER:-mola}"
      SWARMDECK_MAPS_ROOT: /maps
      # Legacy cloud mode only; mola_snapshot always uses exact terrain queries.
      SWARMDECK_INDEXED_MAP_QUERY: "${SWARMDECK_INDEXED_MAP_QUERY:-0}"
    volumes:
      - peer_maps:/maps:ro
