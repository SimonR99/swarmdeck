# Onboard Swarm-SLAM participants feeding the native MOLA mapping products.
# Server replication is optional. DDS discovery and graph exchange are direct;
# omit this overlay only for the explicit legacy central-cloud simulation path.
x-peer: &peer
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile.cslam
  image: swarmdeck-cslam:planning
  network_mode: service:sim
  environment: &peer-env
    PYTHONPATH: /app
    ROS_DOMAIN_ID: "${SWARMDECK_TEST_DOMAIN:-173}"
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    SWARMDECK_MISSION_ID: "${SWARMDECK_MISSION_ID:?Set a fresh fleet mission UUID}"
    SWARMDECK_PEER_NAMES: '${SWARMDECK_PEER_NAMES:-["robot_0","robot_1","robot_2","robot_3"]}'
    SWARMDECK_USE_SIM_TIME: "true"
    SWARMDECK_CAPTURE_PROVIDER: "${SWARMDECK_CAPTURE_PROVIDER:-unknown}"
    SWARMDECK_COLOR_FRAME_CONVENTION: body
    # Simulation only. The ARGoS bridge publishes every robot's pose in the
    # shared `world` frame, so a capture can drop the returns that landed on a
    # neighbour's chassis. Hardware has no such shared-frame peer pose and
    # leaves this unset. Both values come from deploy/simulation_launch.py,
    # which is the only component that knows the scenario's fleet.robot_types;
    # a compose bring-up by hand therefore runs with the mask off rather than
    # failing on an unknown platform.
    SWARMDECK_PEER_BODY_MASK: "${SWARMDECK_PEER_BODY_MASK:-false}"
    SWARMDECK_PEER_PLATFORMS: "${SWARMDECK_PEER_PLATFORMS:-}"
    SWARMDECK_SERVER_URL: http://server:8080
  volumes:
    - ../../autonomy:/app/autonomy:ro
    - ../autonomy:/app/deploy/autonomy:ro
    - peer_maps:/maps
  command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && source /cslam_ws/install/setup.bash && exec ros2 launch /app/deploy/autonomy/peer.launch.py"]
  depends_on:
    sim:
      condition: service_started
  restart: "no"
services:
  peer0:
    <<: *peer
    environment:
      <<: *peer-env
      SWARMDECK_PEER_INDEX: "0"
  peer1:
    <<: *peer
    environment:
      <<: *peer-env
      SWARMDECK_PEER_INDEX: "1"
  peer2:
    <<: *peer
    environment:
      <<: *peer-env
      SWARMDECK_PEER_INDEX: "2"
  peer3:
    <<: *peer
    environment:
      <<: *peer-env
      SWARMDECK_PEER_INDEX: "3"
volumes:
  peer_maps:
