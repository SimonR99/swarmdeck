# Run this overlay on a ROS 1 robot. The robot's existing drivers and roscore
# stay on the host; host networking lets these containers join that ROS graph.
services:
  adapter:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-ros1
    image: swarmdeck-robot-ros1:local
    container_name: swarmdeck-adapter
    depends_on:
      # `service_started`, not `service_healthy` — see the long note on the same
      # dependency in docker-compose.robot-botman.yml. A detector that cannot
      # fetch its weights must not take telemetry, video and teleop down with it.
      duck_detector:
        condition: service_started
    network_mode: host
    volumes:
      # Adapter source off the mount, dependencies out of the image — the same
      # arrangement as aslan/spot/botman, so `scripts/deploy` is one procedure
      # for every robot instead of four. Without it a one-line change here needs
      # an image rebuild on the Jetson.
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_IP: "${ROBOT_IP:?set ROBOT_IP to this robot's LAN address}"
      SWARMDECK_DETECTOR_URL: http://127.0.0.1:8091
    command:
      - python3
      - /app/swarmdeck/adapters/adapter_ros1/adapter_ros1.py
      - --robot-id
      - "${ROBOT_ID:?set ROBOT_ID}"
      - --config
      - "/app/swarmdeck/${ROBOT_CONFIG:-adapters/adapter_ros1/config/generic.yaml}"
      - --host
      - "${BACKEND_HOST:?set BACKEND_HOST}"
      - --port
      - "${BACKEND_PORT:-8080}"
    restart: unless-stopped

  media:
    image: swarmdeck-robot-ros1:local
    container_name: swarmdeck-media
    depends_on:
      - adapter
    network_mode: host
    volumes:
      - ${ROBOT_REPO:-/ssd/swarmdeck}:/app/swarmdeck:ro
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_IP: "${ROBOT_IP:?set ROBOT_IP to this robot's LAN address}"
    command:
      - python3
      - /app/swarmdeck/adapters/media/ros1_rtsp.py
      - --robot-id
      - "${ROBOT_ID:?set ROBOT_ID}"
      - --topic
      - "${CAMERA_TOPIC:?set CAMERA_TOPIC to a sensor_msgs/CompressedImage topic}"
      - --rtsp-url
      - "rtsp://${BACKEND_HOST}:${MEDIA_RTSP_PORT:-8554}/${ROBOT_ID}"
      - --bitrate-kbps
      - "${VIDEO_BITRATE_KBPS:-700}"
      - --fps
      - "${VIDEO_FPS:-10}"
      - --width
      - "${VIDEO_WIDTH:-640}"
      - --height
      - "${VIDEO_HEIGHT:-480}"
    restart: unless-stopped

  duck_detector:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: "${ULTRALYTICS_IMAGE:-ultralytics/ultralytics:8.4.14-jetson-jetpack5}"
    image: swarmdeck-duck-detector:jetpack5
    container_name: swarmdeck-duck-detector
    network_mode: host
    ipc: host
    runtime: nvidia
    volumes:
      - duck_detector_models:/models
    restart: unless-stopped

volumes:
  duck_detector_models:
