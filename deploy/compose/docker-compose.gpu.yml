# GPU overlay for the simulator services.
#
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.gpu.yml \
#                  --profile argos up --build -d
#   make up-argos-gpu
#
# Why this is a separate file rather than the default: a `devices` reservation
# with `driver: nvidia` makes `docker compose up` fail outright on a machine
# with no NVIDIA runtime, so the base compose file has to stay portable. CI and
# GPU-less workstations use the base command, which falls back to the lavapipe
# software rasterizer.
#
# What it buys. The photorealism medium renders every camera frame and every
# lidar ray through Vulkan. On the software rasterizer, four robots with a
# 17-ring lidar and 320x240 RGB-D cameras run at 0.93x real time, which is
# usable but leaves no headroom: camera resolution is the main cost dial, and
# every increase comes out of that budget. A real device moves the GPU-wait
# half of the frame cost off the CPU entirely.
#
# Intel and AMD need no NVIDIA runtime, only the render node; that overlay is
# docker-compose.dri.yml.

services:
  argos:
    environment:
      SWARMDECK_SOFTWARE_RENDER: "false"
      NVIDIA_VISIBLE_DEVICES: all
      # `graphics` is the one that matters: it injects the Vulkan ICD the
      # photorealism medium needs. `compute` and `utility` come along for
      # CUDA-based perception and for nvidia-smi being usable inside.
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The legacy backend's own GPU settings, unchanged.
  gazebo:
    environment:
      # Explicit "0" rather than an empty value: mesa parses this variable as a
      # boolean and an empty string falls through to its default, which is the
      # sort of thing that silently un-fixes itself later.
      LIBGL_ALWAYS_SOFTWARE: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
