# Asimov (Unitree G1) bring-up owned by SwarmDeck.
#
# Connects Unitree G1 humanoid (192.168.1.37) running ROS 2 Humble containers
# and the host-side Foxy/Unitree locomotion bridge into SwarmDeck.

x-ros-domain: &ros_domain "${ASIMOV_ROS_DOMAIN_ID:-0}"

services:
  camera:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-ros2
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-asimov-camera
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
    environment:
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - realsense2_camera
      - realsense2_camera_node
      - --ros-args
      - -r
      - __node:=camera
      - -r
      - __ns:=/d435
      - -p
      - enable_color:=true
      - -p
      - enable_depth:=true
      - -p
      - enable_accel:=false
      - -p
      - enable_gyro:=false
      - -p
      - pointcloud.enable:=false
      - -p
      - align_depth.enable:=true
    restart: unless-stopped

  media:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-ros2
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-asimov-media
    depends_on:
      camera:
        condition: service_started
    network_mode: host
    ipc: host
    volumes:
      - ${ROBOT_REPO:-/home/unitree/swarmdeck}:/app/swarmdeck:ro
    environment:
      ROS_DOMAIN_ID: *ros_domain
    command:
      - python3
      - /app/swarmdeck/adapters/media/ros2_rtsp.py
      - --robot-id
      - asimov_0
      - --topic
      - /d435/camera/color/image_raw/compressed
      - --raw-topic
      - /d435/camera/color/image_raw
      - --rtsp-url
      - "rtsp://${BACKEND_HOST}:${MEDIA_RTSP_PORT:-8554}/asimov_0"
      - --bitrate-kbps
      - "${VIDEO_BITRATE_KBPS:-700}"
      - --fps
      - "${VIDEO_FPS:-10}"
      - --width
      - "${VIDEO_WIDTH:-640}"
      - --height
      - "${VIDEO_HEIGHT:-480}"
    restart: unless-stopped

  duck_detector:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: ultralytics/ultralytics:8.4.14-jetson-jetpack6
    image: swarmdeck-duck-detector:jetpack6
    container_name: swarmdeck-asimov-detector
    profiles: ["detector"]
    network_mode: host
    ipc: host
    runtime: nvidia
    volumes:
      - duck_detector_models:/models
      - ${ROBOT_REPO:-/home/unitree/swarmdeck}/adapters:/app/adapters:ro
    restart: unless-stopped

  # Reuses swarmdeck_ros/src/swarmdeck_nav, with Asimov-specific frames and a
  # Mid-360 obstacle scan projection. Nav2 writes only cmd_vel_nav; the
  # adapter remains the sole publisher to the real /cmd_vel and relays
  # autonomy only while its NavigateToPose goal is active. No standalone
  # odom_tf service is needed here (unlike Botman/Aslan): Asimov's
  # world -> base_link TF comes from the onboard Unitree/Livox localization,
  # independent of whether this container is up.
  nav2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-nav2
    image: swarmdeck-robot-nav2:local
    container_name: swarmdeck-asimov-nav2
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - launch
      - swarmdeck_nav
      - asimov.launch.py
    # Every ros2 CLI call is wrapped in `timeout`. See
    # docker-compose.robot-botman.yml's healthcheck comment for the incident
    # (leaked DDS participants, eventual power cycle) an unbounded call caused.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          . /opt/ros/humble/setup.sh &&
          . /nav_ws/install/setup.sh &&
          timeout 5 ros2 action list | grep -qx '/asimov_0/navigate_to_pose' &&
          timeout 5 ros2 lifecycle get /asimov_0/bt_navigator | grep -q '^active'
      interval: 20s
      timeout: 12s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  adapter:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-ros2
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-asimov-adapter
    depends_on:
      camera:
        condition: service_started
      # `service_started`, NOT `service_healthy`: a bt_navigator that never
      # reaches `active` should not take telemetry/teleop off the dashboard.
      # capabilities() already only advertises `navigate` once the action
      # server actually resolves at runtime -- see docker-compose.robot-botman.yml.
      nav2:
        condition: service_started
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
      - ${ASIMOV_WORKSPACE:-/home/unitree/workspaces}:/workspace:ro
      - ${ROBOT_REPO:-/home/unitree/swarmdeck}:/app/swarmdeck:ro
    environment:
      ROS_DOMAIN_ID: *ros_domain
      SWARMDECK_DETECTOR_URL: http://127.0.0.1:8091
      SWARMDECK_ODOMETRY_BACKEND: ${ASIMOV_ODOMETRY_BACKEND:-native}
    command:
      - /ros_entrypoint.sh
      - python3
      - /app/swarmdeck/adapters/adapter_ros2/adapter_ros2.py
      - --robot-id
      - asimov_0
      - --config
      - /app/swarmdeck/adapters/adapter_ros2/config/unitree_g1.yaml
      - --host
      - ${BACKEND_HOST:?set BACKEND_HOST to the SwarmDeck operator host}
      - --port
      - "${BACKEND_PORT:-8080}"
    restart: unless-stopped

volumes:
  duck_detector_models:
