# Spot bring-up owned by SwarmDeck. The MIST workspace is mounted read-only
# and invoked through packages already installed in spot:dev.
#
# Confirmed on orin.local (192.168.1.192) 2026-08-12:
#   image      spot:dev  (entrypoint /tmp/setup.sh forces zenoh — we replace it)
#   workspace  /home/indro/mist_ws_ros2
#   SLAM       LIO-SAM (SuperOdom is COLCON_IGNORE'd)
#   ouster     192.168.50.165
#   IMU        /dev/vectornav -> ttyUSB0
#
# Lidar + slam + adapter + spot_driver. auto_claim / auto_stand stay false
# in MIST's spot.yaml; Claim / Stand are GUI buttons. start_estop is
# overridden to true in spot.launch.py so claim works without a tablet.
# Claim also drops a leftover tablet keepalive that holds motors off.
x-ros-domain: &ros_domain "${SPOT_ROS_DOMAIN_ID:-0}"

# Replace spot:dev's /tmp/setup.sh so it cannot pin rmw_zenoh_cpp over the
# Fast-RTPS graph the adapter uses.
x-spot-stack: &spot-stack
  image: ${SPOT_IMAGE:-spot:dev}
  entrypoint: ["/bin/bash", "-c"]
  network_mode: host
  ipc: host
  privileged: true
  volumes:
    - /dev:/dev
    - ${SPOT_WORKSPACE:-/home/indro/mist_ws_ros2}:/workspace:ro
    - ${ROBOT_REPO:-/home/indro/swarmdeck}:/app/swarmdeck:ro
  environment:
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    ROS_DOMAIN_ID: *ros_domain
  restart: unless-stopped

services:
  robot_stack:
    <<: *spot-stack
    container_name: swarmdeck-spot-stack
    command:
      - export RMW_IMPLEMENTATION=rmw_fastrtps_cpp && . /opt/ros/humble/setup.bash && . /workspace/install/setup.bash && ros2 launch /app/swarmdeck/adapters/adapter_ros2/launch/spot.launch.py start_driver:=true start_lidar:=false start_slam:=false start_camera:=false

  camera:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-ros2
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-spot-camera
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - ros2
      - run
      - realsense2_camera
      - realsense2_camera_node
      - --ros-args
      - -p
      - camera_name:=d435
      - -p
      - pointcloud.enable:=false
      - -p
      - align_depth.enable:=true
      - -p
      - enable_depth:=true
      - -p
      - enable_color:=true
      - -p
      - rgb_camera.profile:=640x480x15
      - -p
      - depth_module.profile:=640x480x15
    restart: unless-stopped

  lidar:
    <<: *spot-stack
    container_name: swarmdeck-spot-lidar
    command:
      - export RMW_IMPLEMENTATION=rmw_fastrtps_cpp && . /opt/ros/humble/setup.bash && . /workspace/install/setup.bash && ros2 launch /app/swarmdeck/adapters/adapter_ros2/launch/spot.launch.py start_driver:=false start_lidar:=true start_slam:=false

  slam:
    <<: *spot-stack
    # LIO-SAM was built against the Debian GTSAM in this image. spot:dev
    # ships a different /usr/local GTSAM 4.3 and imuPreintegration dies on
    # an undefined ISAM2::update symbol.
    image: ${SPOT_SLAM_IMAGE:-spot_lio_sam:dev}
    container_name: swarmdeck-spot-slam
    depends_on:
      lidar:
        condition: service_started
    command:
      - export RMW_IMPLEMENTATION=rmw_fastrtps_cpp && . /opt/ros/humble/setup.bash && . /workspace/install/setup.bash && ros2 launch /app/swarmdeck/adapters/adapter_ros2/launch/spot.launch.py start_driver:=false start_lidar:=false start_slam:=true

  adapter:
    <<: *spot-stack
    container_name: swarmdeck-spot-adapter
    depends_on:
      lidar:
        condition: service_started
      slam:
        condition: service_started
      duck_detector:
        condition: service_started
    volumes:
      - /dev:/dev
      - ${SPOT_WORKSPACE:-/home/indro/mist_ws_ros2}:/workspace:ro
      - ${ROBOT_REPO:-/home/indro/swarmdeck}:/app/swarmdeck:ro
      - ${ROBOT_REPO:-/home/indro/swarmdeck}/.spot_pip:/root/.local
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
      PYTHONPATH: /root/.local/lib/python3.10/site-packages
      SWARMDECK_DETECTOR_URL: http://127.0.0.1:8091
    command:
      - export RMW_IMPLEMENTATION=rmw_fastrtps_cpp && . /opt/ros/humble/setup.bash && . /workspace/install/setup.bash && python3 /app/swarmdeck/adapters/adapter_ros2/adapter_ros2.py --robot-id spot_0 --config /app/swarmdeck/adapters/adapter_ros2/config/spot.yaml --host ${BACKEND_HOST:?set BACKEND_HOST to the SwarmDeck operator host} --port ${BACKEND_PORT:-8080}

  # Production low-latency video. usb_cam may only publish raw rgb8, so
  # --raw-topic JPEG-encodes /d435/color/image_raw when compressed is absent;
  # the only outbound stream is then scaled to 640x480 H.264 over RTSP/TCP.
  media:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.robot-ros2
    image: swarmdeck-robot-ros2:local
    container_name: swarmdeck-spot-media
    depends_on:
      camera:
        condition: service_started
    network_mode: host
    ipc: host
    volumes:
      # Our source off the mount, dependencies out of the image — see the
      # adapter service. Without this an `ros2_rtsp.py` fix needs a rebuild.
      - ${ROBOT_REPO:-/home/indro/swarmdeck}:/app/swarmdeck:ro
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command:
      - python3
      - /app/swarmdeck/adapters/media/ros2_rtsp.py
      - --robot-id
      - spot_0
      - --topic
      - /camera/camera/color/image_raw/compressed
      - --raw-topic
      - /camera/camera/color/image_raw
      - --rtsp-url
      - "rtsp://${BACKEND_HOST}:${MEDIA_RTSP_PORT:-8554}/spot_0"
      - --bitrate-kbps
      - "${VIDEO_BITRATE_KBPS:-700}"
      - --fps
      - "${VIDEO_FPS:-10}"
      - --width
      - "${VIDEO_WIDTH:-640}"
      - --height
      - "${VIDEO_HEIGHT:-480}"
    restart: unless-stopped

  # Same YOLOE sidecar as Botman/Tars. The compose service is still called
  # duck_detector; the catalog is rubber_duck, wooden_block, disc_cone,
  # filament_spool, pool_noodle (adapters/perception/catalog.py).
  duck_detector:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: ultralytics/ultralytics:8.4.14-jetson-jetpack6
    image: swarmdeck-duck-detector:jetpack6
    container_name: swarmdeck-spot-detector
    network_mode: host
    ipc: host
    runtime: nvidia
    volumes:
      - duck_detector_models:/models
      - ${ROBOT_REPO:-/home/indro/swarmdeck}/adapters:/app/adapters:ro
    restart: unless-stopped

volumes:
  duck_detector_models:
