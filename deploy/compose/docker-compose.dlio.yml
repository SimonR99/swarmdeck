# DLIO overlay: replaces RTAB-Map's icp_odometry with Direct LiDAR-Inertial
# Odometry, for evaluation.
#
#   SWARMDECK_CONFIG=/app/configs/4robot_3d.yaml SLAM_BACKEND=rtabmap \
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.gpu.yml \
#                  -f deploy/compose/docker-compose.dlio.yml \
#                  --profile gazebo up --build -d
#
# Same IPC/network sharing as the cslam overlay, and for the same reason: Fast
# DDS discovers over UDP but moves data over /dev/shm, so a separate IPC
# namespace gives full topic discovery and zero messages.
services:
  gazebo:
    ipc: shareable

  dlio:
    profiles: ["gazebo"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dlio
    image: swarmdeck-dlio:local
    depends_on:
      - gazebo
    network_mode: "service:gazebo"
    ipc: "service:gazebo"
    environment:
      ROS_DOMAIN_ID: "42"
      DLIO_ROBOTS: "${DLIO_ROBOTS:-4}"
      DLIO_DELAY: "${DLIO_DELAY:-90}"
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/jazzy/setup.bash &&
        source /dlio_ws/install/setup.bash &&
        echo "[dlio] waiting $${DLIO_DELAY}s for the fleet" &&
        sleep "$${DLIO_DELAY}" &&
        for i in $$(seq 0 $$(( $${DLIO_ROBOTS} - 1 ))); do
          ros2 launch swarmdeck_dlio dlio_robot.launch.py namespace:=robot_$$i use_sim_time:=true & done;
        wait
    restart: unless-stopped
