server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-checked every 10s.
    #
    # Without this nginx resolves each upstream name ONCE at startup and caches
    # the address forever. Compose hands a container a new IP whenever it is
    # recreated, so `docker compose up -d server` -- which is also what any
    # `up` touching a dependency does -- leaves this proxy dialling an address
    # nothing answers on. The page still loads, because the static files are
    # local, and every /api and /ws call returns 502: a dashboard that looks
    # alive and holds no data. It cost two separate debugging sessions before
    # being named, and recurred once more in the same afternoon.
    #
    # A variable in proxy_pass is what defers resolution to request time; a
    # literal name is resolved at config load no matter what resolver is set.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/agent/ {
        set $agent_backend http://agent:8085;
        proxy_pass $agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50m;
    }

    location /api/ {
        # No URI part on a variable proxy_pass: nginx then forwards the original
        # request URI unchanged, which is already /api/... -- the same upstream
        # path the literal form produced by prefix substitution.
        set $api_backend http://server:8080;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location /ws {
        set $ws_backend http://server:8080;
        proxy_pass $ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # UI route /whep/<robot> -> MediaMTX route /<robot>/whep.
    location ~ ^/whep/([^/]+)$ {
        set $mtx_backend http://mediamtx:8889;
        rewrite ^/whep/([^/]+)$ /$1/whep break;
        proxy_pass $mtx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
