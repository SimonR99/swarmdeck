# Docker ships with After=time-set.target, which only means the clock has been
# SET (from the RTC or fake-hwclock), not SYNCHRONIZED. Sensor drivers started
# under that ordering stamp with a pre-correction clock. Order after the bounded
# wait instead. Ordering only, never Requires: the robot must still boot when
# there is no NTP server in reach.
[Unit]
After=swarmdeck-timesync-wait.service time-sync.target
