name: Lint (Black)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  black:
    name: Check code formatting with Black
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Run Black check
        run: |
          black --check --diff .
