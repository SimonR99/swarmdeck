# EXPERIMENTAL: merge driven by the collaborative pose graph.
#
# DO NOT use this expecting a better map than `4robot_3d.yaml`. Measured against
# Gazebo ground truth it is much WORSE — 11-16 m of error on every robot cslam
# merged, against 0.03-0.20 m for grid registration.
#
# The reason is architectural, not a tuning problem. The occupancy grids come
# from RTAB-Map, and the transforms here come from cslam. Those are two
# INDEPENDENT SLAM systems with separately optimised trajectories, and they
# disagree: measured on a live run, cslam and RTAB-Map placed the same robot
# 8.1 m apart in what is nominally that robot's own map frame, and 6.8-19.5 m
# apart for robots expressed in the shared cluster frame. Robot_2 — the one
# cslam had NOT merged, so its cslam frame was still its own — agreed with
# RTAB-Map to 0.02 m, which is what shows the gap is the frame relationship
# rather than the arithmetic.
#
# Making this correct means unifying the two, not adjusting a constant: either
# feed cslam's optimised poses back into RTAB-Map as pose priors, or build the
# merged grid from cslam's own keyframe clouds instead of RTAB-Map's grids.
# Until one of those exists, `merge_mode: auto` is the accurate path and cslam
# earns its keep as the loop-closure and monitoring layer.
#
# The plumbing below is correct and unit-tested; what is missing is upstream of
# it. Kept so the next person starts from a working harness.
#
# Four robots, 3D lidar, RTAB-Map per robot, and Swarm-SLAM across the fleet.
#
# `merge_mode: cslam` is the difference from 4robot_3d.yaml. The merge transform
# comes from the collaborative pose graph's inter-robot loop closures instead of
# being re-estimated by grid correlation after the fact — which is the entire
# reason for running a joint back end. Grid registration is demoted to an
# independent cross-check and reported, never applied.
#
# Requires the cslam overlay:
#   make docker-up-cslam
#
#   SLAM_BACKEND=rtabmap SWARMDECK_CONFIG=/app/study/4robot_3d.yaml make docker-up-gpu
#
# Identical to 4robot.yaml except the lidar profile. `generic_32` publishes a
# real point cloud on <ns>/scan/points, which is what icp_odometry registers
# against and what RTAB-Map segments into ground and obstacles — neither of which
# a single horizontal ring can support.
#
# This is the configuration that matches the target hardware (3D lidar + IMU), so
# it is the one to tune against once the actual sensor is chosen: swap
# `profile` for `vlp16`, `os1_32`, or a new entry in spawn_fleet.py.
#
# Rendering 33 rings x 1800 samples is 60x the raytracing of the old sensor. Run
# it on the GPU; software rendering will not hold real time.
name: 4robot_3d
seed: 20260801

fleet:
  robot_count: 4
  robot_prefix: robot_
  lidar:
    profile: generic_32

map:
  merge_mode: cslam
  size_m: 30.0
  resolution: 0.05
  start_poses:
    robot_0: {x: -9.0, y: 0.0, yaw: 0.0}
    robot_1: {x: -3.0, y: 0.0, yaw: 0.0}
    robot_2: {x: 3.0, y: 0.0, yaw: 3.1416}
    robot_3: {x: 9.0, y: 0.0, yaw: 3.1416}

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
