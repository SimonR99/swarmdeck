# SwarmDeck session config: DARPA SubT Finals Prize Round World 01
#
# The Finals staging hangar and the tunnel circuit behind it, imported from
# Gazebo Fuel by the argos3 fork (src/plugins/simulator/photorealism/
# environments/finals_prize_round_world_01, see its README for regeneration).
# Underground: only the staging area and a few tiles carry lamps; the rest of
# the map is dark, as in the competition.
name: 4robot_subt_finals
seed: 20260801
world: subt_finals

fleet:
  # Fleet-wide Explore releases the robots one at a time, head of the group
  # first: the next leaves once the previous one is clearance_m from where it
  # stood, or after timeout_s. The gate to the tunnel is 3.3 m wide.
  departure: {clearance_m: 5.0, timeout_s: 30.0}
  robot_count: 4
  robot_prefix: robot_
  # Mirroring the reference deployment: two Bunkers, one Scout Mini, one Spot.
  robot_type: bunker
  robot_types:
    robot_2: scout_mini
    robot_3: spot
  # Forward-facing floodlight mounted at camera height for underground navigation
  floodlight: true
  odometry: fast_livo2
  # Wider vertical coverage observes downhill terrain from the level landing.
  lidar:
    profile: os1_32

map:
  # Two columns in the staging hangar (floor z = -0.01, walls at y = +-5.5,
  # back wall at x = -20), lined up with the 3.3 m gate at (-10.5, 0) and
  # facing the tunnel, which runs along +x. robot_0 is at the head of the
  # group. Measured through the collision mesh with Jolt ray casts.
  start_poses:
    robot_0: {x: -14.5, y: 1.0, z: 0.15, yaw: 0.0}
    robot_1: {x: -14.5, y: -1.0, z: 0.15, yaw: 0.0}
    robot_2: {x: -16.5, y: 1.0, z: 0.15, yaw: 0.0}
    robot_3: {x: -16.5, y: -1.0, z: 0.15, yaw: 0.0}

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
