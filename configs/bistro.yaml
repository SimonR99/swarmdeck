# SwarmDeck session config: Amazon Lumberyard Bistro (alias for 4robot_bistro)
name: bistro
seed: 20260801
world: bistro

fleet:
  # Fleet-wide Explore releases the robots one at a time, head of the group
  # first: the next leaves once the previous one is clearance_m from where it
  # stood, or after timeout_s. Parked neighbours are in nobody's map.
  departure: {clearance_m: 5.0, timeout_s: 30.0}
  robot_count: 4
  robot_prefix: robot_
  robot_type: bunker
  robot_types:
    robot_2: scout_mini
    robot_3: spot
  lidar:
    profile: vlp16

map:
  merge_mode: graph
  size_m: 120.0
  resolution: 0.05
  # Shared street deployment on the crown of the road. The street is cambered
  # into a gutter along the west kerb (x near -14.9): at x = -14 the Scout slid
  # 0.4 m west after every spawn and came to rest against the kerb, where its
  # own footprint fails the terrain check and it never gets a path (measured
  # 2026-09-17). Both columns now stand 1.2 m or more from a kerb, 2 m apart.
  start_poses:
    robot_0: {x: -11.2, y: 4.0, z: 0.15, yaw: -1.5707963268}
    robot_1: {x: -11.2, y: 6.0, z: 0.15, yaw: -1.5707963268}
    robot_2: {x: -13.2, y: 4.0, z: 0.15, yaw: -1.5707963268}
    robot_3: {x: -13.2, y: 6.0, z: 0.15, yaw: -1.5707963268}

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
