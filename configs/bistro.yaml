# SwarmDeck session config: Amazon Lumberyard Bistro (alias for 4robot_bistro)
name: bistro
seed: 20260801
world: bistro

fleet:
  robot_count: 4
  robot_prefix: robot_
  robot_type: bunker
  robot_types:
    robot_2: scout_mini
    robot_3: spot
  lidar:
    profile: vlp16

map:
  merge_mode: graph
  size_m: 120.0
  resolution: 0.05
  # Shared street deployment; 2 m spacing leaves clearance for every platform.
  start_poses:
    robot_0: {x: -12.0, y: 4.0, z: 0.15, yaw: -1.5707963268}
    robot_1: {x: -12.0, y: 6.0, z: 0.15, yaw: -1.5707963268}
    robot_2: {x: -14.0, y: 4.0, z: 0.15, yaw: -1.5707963268}
    robot_3: {x: -14.0, y: 6.0, z: 0.15, yaw: -1.5707963268}

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
