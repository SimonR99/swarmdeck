# Single-robot server session for Aslan. Robot drivers and SuperOdometry are
# started by deploy/compose/docker-compose.robot-aslan.yml; this config is backend-only.
name: hardware_aslan
seed: 20260806

fleet:
  robot_count: 0
  robot_prefix: robot_
  lidar:
    profile: generic_32

map:
  start_poses: {}

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
