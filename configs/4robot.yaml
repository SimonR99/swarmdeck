# SwarmDeck session config
name: 4robot
seed: 20260801

fleet:
  robot_count: 4
  robot_prefix: robot_
  # Platform. `robot_type` is the fleet default; `robot_types` can override
  # per id (see spawn_fleet.py ROBOT_PROFILES). Simulation uses four identical
  # Bunkers so teleop and nav behave the same. Mixed Scout/Spot chassis stay on
  # the hardware configs.
  robot_type: bunker

  # Odometry system. `odometry` is the fleet default (fast_livo2 by default in ARGoS).
  # `odometry_types` can override per robot id for heterogenous benchmarking:
  #   fast_livo2      LiDAR-inertial-visual front-end via uf socket
  #   drift           ARGoS synthetic Gaussian noise model (fast dev)
  #   ekf             robot_localization EKF fusing wheel encoders and IMU
  #   superodometry   IMU-first LiDAR-inertial odometry
  #   native          Manufacturer native odometry
  odometry: fast_livo2
  # odometry_types:
  #   robot_0: fast_livo2
  #   robot_1: drift
  # Mapping lidar. `profile` names an entry in spawn_fleet.py's LIDAR_PROFILES;
  # any individual field may be overridden beneath it.
  #
  #   legacy_360  360 samples/rev, 1 ring, 16 m — what SwarmDeck shipped, kept
  #               as the A/B control. 1.003 deg per ray, which is why distant
  #               walls used to come out dotted.
  #   generic_2d  1800 samples/rev (0.2 deg), 1 ring, 30 m — same 2D pipeline,
  #               continuous walls.
  #   generic_32  as above plus 33 rings over +/-22.5 deg, so <ns>/scan/points
  #               carries real 3D structure. Needs slam_backend:=rtabmap.
  #   vlp16       1800 samples/rev (0.2 deg) and 17 rings over +/-15 deg, a
  #               Velodyne VLP-16 plus a ring at elevation 0. The DEFAULT,
  #               because the ARGoS backend's odometry comes from Ultra-Fusion,
  #               which is lidar-inertial: it registers on the cloud's vertical
  #               structure, and a planar scan has none. The extra ring is what
  #               keeps the 2D slice honest at range (see below).
  #
  # Rings must be 1 or an odd value: an even count leaves no ring at elevation 0,
  # and the sliced 2D scan then truncates at short range (docs/operations/known-issues.md).
  #
  # `generic_2d` still runs on the legacy Gazebo backend and is what this file
  # used to carry; it is refused by the ARGoS backend, which says so and names
  # the fix rather than starting a fleet whose estimator can never converge.
  lidar:
    profile: vlp16
    h_samples: 900  # 0.4 deg resolution (15,300 pts/robot vs 30,600) for real-time simulation

map:
  merge_mode: graph         # pose-graph occupancy; no grid registration
  size_m: 30.0              # merged grid extent, metres
  resolution: 0.05
  start_poses:              # spawn poses; graph mode does not treat these as merges
    robot_0: {x: -9.0, y: 0.0, yaw: 0.0}
    robot_1: {x: -3.0, y: 0.0, yaw: 0.0}
    robot_2: {x: 3.0, y: 0.0, yaw: 3.1416}
    robot_3: {x: 9.0, y: 0.0, yaw: 3.1416}
alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
