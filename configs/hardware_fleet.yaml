# Whole physical fleet on one backend: tars_0, botman_0, aslan_0, spot_0.
#
# The per-robot hardware_*.yaml files each bring up a single-robot session. This
# one is for running the real fleet together, which is what the operator actually
# does -- and using a SIMULATION config for that (configs/4robot.yaml) is a
# specific, silent failure worth naming: it declares robots robot_0..robot_3 and
# elects robot_0 as the merge reference. No such robot ever registers, so every
# real robot is permanently a NON-reference robot, and in merge_mode: auto that
# means every single map/cloud ingest re-runs grid registration -- measured at
# 2.44 s per call (adapters/adapter_ros2/config/bunker.yaml:107).
#
# robot_count: 0 because nothing here is simulated; robots register themselves
# through their adapters.
name: hardware_fleet
seed: 20260824

fleet:
  robot_count: 0
  robot_prefix: robot_
  lidar:
    profile: generic_32

map:
  # static, with no start_poses, is the deliberate choice while per-robot local
  # maps are the goal. It performs NO registration, so ingest never blocks and
  # every robot's own map keeps flowing. The merged view is then just each map
  # at its own origin -- honest, since with no start poses the backend genuinely
  # does not know how the robots relate. Populate start_poses (or move to the
  # pose-graph back-end in slam/) when merging is the goal; do not switch this
  # back to `auto` to get merging "for free", which is what regressed before.
  merge_mode: static
  size_m: 40.0
  resolution: 0.05
  start_poses: {}

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
