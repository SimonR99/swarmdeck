# Whole physical fleet on one backend: tars_0, botman_0, aslan_0, spot_0, chris_0.
#
# The per-robot hardware_*.yaml files each bring up a single-robot session. This
# one is for running the real fleet together, which is what the operator actually
# does -- and using a SIMULATION config for that (configs/4robot.yaml) is a
# specific, silent failure worth naming: it declares robots robot_0..robot_3 and
# elects robot_0 as the merge reference. No such robot ever registers, so every
# real robot is permanently a NON-reference robot, and in merge_mode: auto that
# means every single map/cloud ingest re-runs grid registration -- measured at
# 2.44 s per call (adapters/adapter_ros2/config/bunker.yaml:107).
#
# robot_count: 0 because nothing here is simulated; robots register themselves
# through their adapters.
name: hardware_fleet
seed: 20260824

fleet:
  robot_count: 0
  robot_prefix: robot_
  lidar:
    profile: generic_32

map:
  # `graph`: local maps keep flowing with no registration; the merged view is
  # occupancy rendered from the pose-graph back-end in slam/. Do not switch
  # this to `auto` to get merging "for free" -- that is the 2.44 s/ingest
  # regression that stalled adapters. Until two robots close a verified loop,
  # the merged map stays empty and each robot's own map is the truth.
  merge_mode: graph
  size_m: 40.0
  resolution: 0.05
  start_poses: {}

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
