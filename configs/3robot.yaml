# SwarmDeck development session: three robots, one of each platform.
#
# The fleet config to reach for while working on the stack. `4robot.yaml` is the
# reference configuration and stays that; this one trades a robot for speed.
#
# Almost all of the simulation's cost is PER ROBOT: each one gets a SLAM
# Toolbox instance, a Nav2 stack, an odometry estimator and a set of rendered
# sensors. Dropping from four to three is a straight reduction in all four.
#
# It keeps all three platforms, which is the part that must not be traded away.
# The three differ in footprint (0.42 m to 0.64 m circumscribed radius) and in
# mapping-lidar height (0.4525 m to 0.970 m above the floor), so the merged map
# is built from robots that see the building at different heights. A fleet of
# identical robots hides every problem that causes, and dropping robot_3 from
# `4robot.yaml` would drop the Spot and leave two Bunkers and a Scout Mini.
#
# Pair it with `odometry:=drift` for development (see `make up-argos-dev`): the
# synthetic drift model removes Ultra-Fusion from the lockstep exchange, which
# is worth about 4x on top of the robot count. Read the trade in
# docs/architecture/simulation.md before drawing conclusions about mapping from
# a run made this way.
name: 3robot
seed: 20260801

fleet:
  robot_count: 3
  robot_prefix: robot_
  robot_type: bunker
  robot_types:
    robot_1: scout_mini
    robot_2: spot
  # vlp16 even here. The ARGoS backend refuses a planar lidar outright, and
  # keeping the sensor identical to `4robot.yaml` is what makes a development
  # run comparable with a reference one.
  lidar:
    profile: vlp16

map:
  merge_mode: graph
  size_m: 30.0
  resolution: 0.05
  # Spread along the corridor, as in 4robot.yaml, so the robots start apart and
  # have to meet before any inter-robot loop closure is possible.
  start_poses:
    robot_0: {x: -9.0, y: 0.0, yaw: 0.0}
    robot_1: {x: -3.0, y: 0.0, yaw: 0.0}
    robot_2: {x: 3.0, y: 0.0, yaw: 3.1416}

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
