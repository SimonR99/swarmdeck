# SwarmDeck session config for tars alone, over adapter_ros1 — NOT a simulated
# fleet, so `fleet`/`video` below are unused defaults kept only because the
# config loader expects the keys to exist.
#
# `merge_mode: static` rather than `auto`: with exactly one real robot
# connected, there is nothing to register against, and `auto` mode's
# reference defaults to whichever of `start_poses` gets configured first —
# which, in the shared 4robot.yaml, is a mock `robot_0` that never uploads a
# grid. `static` just accepts tars_0's own frame as the map, which is exactly
# correct with one robot: there is no other frame to disagree with it.
name: hardware_tars
seed: 20260801

fleet:
  robot_count: 0
  robot_prefix: robot_
  lidar:
    profile: generic_2d

map:
  merge_mode: static
  size_m: 40.0               # matches adapter_ros1's map_cloud scan-grid window (MAP_CLOUD default 40 m)
  resolution: 0.05
  start_poses: {}             # none needed: static mode defaults an unconfigured robot to identity

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
