# SwarmDeck session config for the mixed real-hardware fleet (tars over ROS 1,
# botman over ROS 2) — NOT a simulated fleet, so `fleet`/`video` below are unused
# defaults kept only because the config loader expects the keys to exist.
#
# Both SLAM systems choose independent origins, so an implicit identity transform
# is never valid once both robots are connected.  Auto mode correlates their
# server-built grids and uses the registered XYZ scans as an independently
# validated proposal when the floor projection is ambiguous.
name: hardware_tars
seed: 20260801

fleet:
  robot_count: 0
  robot_prefix: robot_
  lidar:
    profile: generic_2d

map:
  merge_mode: auto
  size_m: 40.0               # matches adapter_ros1's map_cloud scan-grid window (MAP_CLOUD default 40 m)
  resolution: 0.05
  start_poses: {}             # starts are unknown; registration must earn the shared frame

alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
