# SwarmDeck session config
name: 1robot
seed: 20260801

fleet:
  robot_count: 1
  robot_prefix: robot_
  lidar_rings: 1            # odd values > 1 also publish a 3D cloud; see 4robot.yaml

map:
  merge_mode: auto          # static | auto
  size_m: 30.0              # merged grid extent, metres
  resolution: 0.05
  start_poses:              # used by merge_mode: static
    robot_0: {x: -9.0, y: 0.0, yaw: 0.0}
alerts:
  unattended_threshold_s: 45
  nav_failure: true
  adapter_disconnect: true

video:
  width: 640
  height: 480
  fps: 15

recording:
  enabled: true
  output_dir: sessions
