    robot_0: {x:  0.0, y:  0.0, yaw: 0.0}
    robot_1: {x:  4.0, y:  0.0, yaw: 1.5708}
    robot_2: {x:  0.0, y:  4.0, yaw: 3.1416}
    robot_3: {x:  4.0, y:  4.0, yaw: -1.5708}

alerts:
  unattended_threshold_s: 45
