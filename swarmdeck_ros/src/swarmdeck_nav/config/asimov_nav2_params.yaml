# Asimov hardware trajectory controller and local live-sensor costmap.
# The native continuous navigation frame is `world`.
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 3.2
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      publish_local_plan: true
      min_vel_x: -0.15
      max_vel_x: 0.25
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      max_speed_theta: 0.3
      acc_lim_x: 0.5
      acc_lim_theta: 0.6
      decel_lim_x: -0.5
      decel_lim_theta: -0.6
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist, PreferForward]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      PreferForward.scale: 1.0
      PreferForward.penalty: 1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: world
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.30
      footprint: "[]"
      transform_tolerance: 0.5
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: <obstacle_scan_topic>
          sensor_frame: <obstacle_sensor_frame>
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.0
          obstacle_max_range: 11.5
          raytrace_min_range: 0.0
          raytrace_max_range: 12.0
          inf_is_valid: true
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    velocity_timeout: 0.5
    max_velocity: [0.25, 0.0, 0.3]
    min_velocity: [-0.15, 0.0, -0.3]
    max_accel: [0.5, 0.0, 0.6]
    max_decel: [-0.5, 0.0, -0.6]
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: /odom
    odom_duration: 0.1
