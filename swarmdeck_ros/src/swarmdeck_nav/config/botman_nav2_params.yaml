# Botman hardware navigation, reusing the same Nav2 nodes as nav2_params.yaml.
#
# SuperOdometry supplies map-frame /laser_odometry and the Ouster driver supplies
# a 360-degree /ouster/scan, but Botman has no OccupancyGrid. Both costmaps are
# therefore rolling obstacle maps built from the live scan. This is genuine
# obstacle-aware pose-goal navigation, but goals must remain inside the 40 m
# global rolling window and the stack does not retain walls outside lidar view.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: os_lidar
    odom_topic: /laser_odometry
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    # Humble 1.1.x loads the BT nodes explicitly (newer Nav2 releases use the
    # `navigators` plugin interface found in the simulation configuration).
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    # Scout's local planner runs at a higher control rate and is noticeably
    # more responsive. Keep the Nav2 equivalent at 20 Hz.
    controller_frequency: 20.0
    odom_topic: /laser_odometry
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      # SwarmDeck sends point goals, not pose goals. NavigateToPose still
      # requires an orientation, so the adapter fills in yaw=0; accepting the
      # full planar heading range makes Nav2 finish as soon as XY is reached
      # instead of rotating the Bunker back to that synthetic heading.
      yaw_goal_tolerance: 3.2
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Keep forward motion preferred by its larger cap, but allow a slow
      # reverse trajectory when a point is behind the chassis or the forward
      # corridor is blocked. The velocity smoother below enforces the same
      # -0.2 m/s reverse limit.
      min_vel_x: -0.2
      # Scout's pathFollower is capped at 0.4 m/s. This is the matching
      # physical speed cap for the Bunker's Nav2 controller.
      max_vel_x: 0.4
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      max_speed_theta: 0.6
      acc_lim_x: 1.0
      acc_lim_theta: 1.2
      decel_lim_x: -1.0
      decel_lim_theta: -1.2
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
         "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      # Prefer driving nose-first, but leave reverse trajectories available
      # when turning would be less safe or the forward corridor is blocked.
      PreferForward.scale: 1.0
      PreferForward.penalty: 1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: os_lidar
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.77
      # Required for nav.launch.py to inject the real Bunker polygon. Without
      # this key RewrittenYaml silently leaves Nav2 on the circular fallback.
      footprint: "[]"
      transform_tolerance: 0.5
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /ouster/scan
          sensor_frame: os_lidar
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.2
          obstacle_max_range: 14.0
          raytrace_min_range: 0.2
          raytrace_max_range: 16.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Keep the Bunker's real footprint below; reduce only the extra
        # clearance around obstacles to the requested Scout-like 0.5 m.
        inflation_radius: 0.50

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: os_lidar
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.1
      robot_radius: 0.77
      # Required for nav.launch.py to inject the real Bunker polygon. Without
      # this key RewrittenYaml silently leaves Nav2 on the circular fallback.
      footprint: "[]"
      track_unknown_space: false
      transform_tolerance: 0.5
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /ouster/scan
          sensor_frame: os_lidar
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.2
          obstacle_max_range: 18.0
          raytrace_min_range: 0.2
          raytrace_max_range: 20.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.50

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_frame: map
    global_frame: map
    robot_base_frame: os_lidar
    transform_tolerance: 0.5
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    scale_velocities: false
    velocity_timeout: 0.5
    max_velocity: [0.4, 0.0, 0.6]
    min_velocity: [-0.2, 0.0, -0.6]
    max_accel: [1.0, 0.0, 1.2]
    max_decel: [-1.0, 0.0, -1.2]
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: /laser_odometry
    odom_duration: 0.1
