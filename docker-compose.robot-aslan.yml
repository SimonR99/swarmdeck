# Aslan bring-up owned by SwarmDeck. MIST's ROS 2 workspace is mounted
# read-only; generated ROS artifacts live under /ssd/swarmdeck/.aslan_ros.
#
# ROS_DOMAIN_ID: bunker:dev's entrypoint (/tmp/setup.sh) exports
# `ROS_DOMAIN_ID=49` and `OUSTER_HOST_NAME=192.168.2.118` unconditionally.
# SwarmDeck's own images set no domain and therefore default to 0. Pin every
# service to 49 so lidar, SuperOdometry and the adapter share one graph.
x-ros-domain: &ros_domain "${ASLAN_ROS_DOMAIN_ID:-49}"

x-aslan-stack: &aslan-stack
  image: bunker:dev
  network_mode: host
  ipc: host
  privileged: true
  volumes:
    - /dev:/dev
    - /ssd/mist_ws_ros2:/workspace:ro
    - /ssd/swarmdeck:/app/swarmdeck:ro
    - /ssd/swarmdeck/.aslan_ros/install:/aslan_overlay:ro
  environment:
    ROS_DOMAIN_ID: *ros_domain
  restart: unless-stopped

services:
  # Base only. Lidar and SuperOdometry are separate services, same split as
  # Botman, so mapping can come up without opening the CAN driver. Default
  # `docker compose up -d` therefore starts lidar + slam + adapter; pass
  # `--profile base` when a person is at the e-stop and can2 is up.
  robot_stack:
    <<: *aslan-stack
    profiles: ["base"]
    container_name: swarmdeck-aslan-stack
    runtime: nvidia
    command:
      - bash
      - -c
      - >-
        . /aslan_overlay/setup.bash &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/aslan_bunker.launch.py
        start_base:=true
        start_lidar:=false
        start_slam:=false
        can_interface:=${ASLAN_CAN_INTERFACE:-can2}

  lidar:
    <<: *aslan-stack
    container_name: swarmdeck-aslan-lidar
    command:
      - bash
      - -c
      - >-
        . /aslan_overlay/setup.bash &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/aslan_bunker.launch.py
        start_base:=false
        start_lidar:=true
        start_slam:=false

  slam:
    <<: *aslan-stack
    container_name: swarmdeck-aslan-slam
    runtime: nvidia
    depends_on:
      lidar:
        condition: service_started
    command:
      - bash
      - -c
      - >-
        . /aslan_overlay/setup.bash &&
        ros2 launch
        /app/swarmdeck/adapters/adapter_ros2/launch/aslan_bunker.launch.py
        start_base:=false
        start_lidar:=false
        start_slam:=true

  nav2:
    profiles: ["nav"]
    build:
      context: .
      dockerfile: docker/Dockerfile.robot-nav2
    image: swarmdeck-robot-nav2:local
    container_name: swarmdeck-aslan-nav2
    depends_on:
      - lidar
      - slam
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
    command: ["ros2", "launch", "swarmdeck_nav", "aslan.launch.py"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          . /opt/ros/humble/setup.sh &&
          . /nav_ws/install/setup.sh &&
          ros2 action list | grep -qx '/aslan_0/navigate_to_pose' &&
          ros2 lifecycle get /aslan_0/bt_navigator | grep -q '^active'
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # bunker:dev already has rclpy. websockets is a one-time --user install into
  # /ssd/swarmdeck/.aslan_pip (the Jetson pip index does not carry it):
  #   docker run --rm --entrypoint pip3 \
  #     -v /ssd/swarmdeck/.aslan_pip:/root/.local bunker:dev \
  #     install --user --index-url https://pypi.org/simple websockets==10.4
  adapter:
    image: bunker:dev
    container_name: swarmdeck-aslan-adapter
    depends_on:
      lidar:
        condition: service_started
      slam:
        condition: service_started
    network_mode: host
    ipc: host
    volumes:
      - /ssd/mist_ws_ros2:/workspace:ro
      - /ssd/swarmdeck:/app:ro
      - /ssd/swarmdeck/.aslan_pip:/root/.local:ro
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DOMAIN_ID: *ros_domain
      SWARMDECK_DETECTOR_URL: http://127.0.0.1:8091
    command:
      - python3
      - /app/adapters/adapter_ros2/adapter_ros2.py
      - --robot-id
      - aslan_0
      - --config
      - /app/adapters/adapter_ros2/config/aslan_bunker.yaml
      - --host
      - "${BACKEND_HOST:?set BACKEND_HOST to the SwarmDeck operator host}"
      - --port
      - "${BACKEND_PORT:-8080}"
    restart: unless-stopped

  duck_detector:
    profiles: ["detect"]
    build:
      context: .
      dockerfile: docker/Dockerfile.duck-detector
      args:
        ULTRALYTICS_IMAGE: ultralytics/ultralytics:8.4.14-jetson-jetpack6
    image: swarmdeck-duck-detector:jetpack6
    container_name: swarmdeck-aslan-duck-detector
    network_mode: host
    ipc: host
    runtime: nvidia
    volumes:
      - duck_detector_models:/models
    restart: unless-stopped

volumes:
  duck_detector_models:
