# Unitree G1 Humanoid Robot (SSH alias `asimov` → `192.168.1.37`, user `unitree`).
# SwarmDeck's ROS 2 Humble adapter shares the graph with the host-side
# `g1_ros2_bridge` (Foxy + Unitree SDK). The latter is started by scripts/asimov-up.
robot_type: unitree_g1
ros_distro: humble
network_iface: wlan0

# Humanoid torso/pelvis bounding footprint.
footprint_radius: 0.30
footprint:
  - [0.18, 0.22]
  - [0.18, -0.22]
  - [-0.18, -0.22]
  - [-0.18, 0.22]

map_frame: world
base_frame: base_link

topics:
  odom: /odom
  map: ""
  map_cloud: /utlidar/cloud_livox_mid360
  plan: ""
  cmd_vel: /cmd_vel
  battery: ""
  camera: /d435/camera/color/image_raw
  camera_compressed: /d435/camera/color/image_raw/compressed
  # The camera publishes colour at 1280x720 and depth at 848x480. Use the
  # aligned stream so detection pixels and depth pixels share one CameraInfo.
  camera_depth: /d435/camera/aligned_depth_to_color/image_raw
  camera_info: /d435/camera/aligned_depth_to_color/camera_info
  camera_color_info: ""
  camera_depth_points: ""

actions:
  # No Nav2/action server is installed on Asimov; teleop is deliberately the
  # only motion path until a planner is deployed and verified.
  navigate_to_pose: ""

services:
  # g1_ros2_bridge exposes std_srvs/Trigger services under this node. Start
  # maps to FSM 500, which is the state required before /cmd_vel is accepted.
  claim: /g1_loco_bridge/start
  release: /g1_loco_bridge/damp
  sit: /g1_loco_bridge/sit
  stand: /g1_loco_bridge/start
  stop: /g1_loco_bridge/stop_move
  damping: /g1_loco_bridge/damp
  lie_to_stand: /g1_loco_bridge/lie_to_stand
  lock_stand: ""
  walk_mode: /g1_loco_bridge/start
  run_mode: ""
  wave: ""

perception:
  depth_max_age_s: 1.0

rates:
  state_hz: 5.0
  map_period_s: 2.0
  camera_period_s: 0.2
  cloud_period_s: 4.0

drive_timeout_s: 0.45
