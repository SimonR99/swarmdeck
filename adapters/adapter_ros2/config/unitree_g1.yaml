# Unitree G1 Humanoid Robot (SSH alias `chris` → `192.168.1.37`, user `unitree`).
# Runs ROS 2 (Humble / CycloneDDS) and g1pilot / unitree_ros2 / DinoNav.
robot_type: unitree_g1
ros_distro: humble
network_iface: auto

# Humanoid torso/pelvis bounding footprint.
footprint_radius: 0.30
footprint:
  - [0.18, 0.22]
  - [0.18, -0.22]
  - [-0.18, -0.22]
  - [-0.18, 0.22]

map_frame: map
base_frame: robot_center

topics:
  odom: /dog_odom
  map: /map
  map_cloud: /utlidar/cloud_livox_mid360
  plan: /g1pilot/path
  cmd_vel: /cmd_vel
  battery: /g1pilot/battery
  camera: /d435/camera/color/image_raw
  camera_compressed: /d435/camera/color/image_raw/compressed
  camera_depth: /d435/camera/depth/image_rect_raw
  camera_info: /d435/camera/depth/camera_info
  camera_color_info: /d435/camera/color/camera_info
  camera_depth_points: ""

actions:
  navigate_to_pose: /navigate_to_pose

services:
  claim: /g1pilot/start
  release: /g1pilot/emergency_stop
  sit: /g1pilot/sit
  stand: /g1pilot/balance
  stop: /g1pilot/emergency_stop
  damping: /g1pilot/damping
  lie_to_stand: /g1pilot/lie_to_stand
  lock_stand: /g1pilot/lock_stand
  walk_mode: /g1pilot/walk_mode
  run_mode: /g1pilot/run_mode
  wave: /g1pilot/wave

perception:
  depth_max_age_s: 1.0

rates:
  state_hz: 5.0
  map_period_s: 2.0
  camera_period_s: 0.2
  cloud_period_s: 4.0

drive_timeout_s: 0.45
