# Unitree G1 Humanoid Robot (SSH alias `asimov` → `192.168.1.37`, user `unitree`).
# SwarmDeck's ROS 2 Humble adapter shares the graph with the host-side
# `g1_ros2_bridge` (Foxy + Unitree SDK). The latter is started by scripts/asimov-up.
robot_type: unitree_g1
ros_distro: humble
network_iface: wlan0

# Humanoid torso/pelvis bounding footprint.
footprint_radius: 0.30
footprint:
  - [0.18, 0.22]
  - [0.18, -0.22]
  - [-0.18, -0.22]
  - [-0.18, 0.22]

navigation_frame: world
base_frame: base_link
lidar_height_m: 1.17

# The Mid-360 sweep is published in livox_frame, not world.  The ROS 2 adapter
# transforms it through the timestamped world <- livox_frame TF before making
# scans/keyframes.  The live transform places the lidar about 1.17 m above the
# floor (0.46 m above base_link).
retain_free_space: true

topics:
  odom: /odom
  # MGG route in the robot navigation frame.
  plan: /asimov_0/plan
  # DWB's selected local trajectory, preferred for the dashboard route.
  local_plan: /asimov_0/local_plan
  # Nav2 costmaps are visualization-only snapshots; the adapter never
  # republishes them to the planner or merges them into SwarmDeck's occupancy
  # map.
  local_costmap: /asimov_0/local_costmap/costmap
  cmd_vel: /cmd_vel
  # Nav2 writes only cmd_vel_nav; the adapter relays it to the real /cmd_vel
  # only while a goal is active (see AdapterLinkMixin._on_nav_cmd_vel).
  nav_cmd_vel: /asimov_0/cmd_vel_nav
  body_cmd: /cmd_body
  battery: /battery_state
  camera: /d435/camera/color/image_raw
  camera_compressed: /d435/camera/color/image_raw/compressed
  # The camera publishes colour at 1280x720 and depth at 848x480. Use the
  # aligned stream so detection pixels and depth pixels share one CameraInfo.
  camera_depth: /d435/camera/aligned_depth_to_color/image_raw
  camera_info: /d435/camera/aligned_depth_to_color/camera_info
  camera_color_info: ""
  camera_depth_points: ""

actions:
  # Nav2 controller_server (asimov.launch.py): MGG routes are executed here
  # against the onboard localization's live world -> base_link TF.
  follow_path: /asimov_0/follow_path

services:
  # Body actions are dispatched directly via /cmd_body to Asimov's native bridge
  claim: ""
  release: ""
  sit: ""
  stand: ""
  stop: ""
  damping: ""
  lie_to_stand: ""
  lock_stand: ""
  walk_mode: ""
  run_mode: ""
  wave: ""

perception:
  depth_max_age_s: 1.0

rates:
  state_hz: 5.0
  camera_period_s: 0.2

upload_timeout_s: 0.5
drive_timeout_s: 1.5

# Onboard MGG selects goals; the existing navigation backend executes them.
# Nominal body envelope and local site bounds: adjust before a new deployment.
exploration:
  enabled: true
  planner:
    cloud_topic: /utlidar/cloud_livox_mid360
    body_height_m: 1.32
    bounds_min: [-60.0, -60.0, -3.0]
    bounds_max: [60.0, 60.0, 3.0]
