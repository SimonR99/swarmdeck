# Boston Dynamics Spot + Orin payload (SSH alias `spot` → `orin.local`,
# user `indro`, 192.168.1.192). Confirmed live 2026-08-12 after the payload
# came back on the lab LAN.
#
#   src/control/rover_launch/launch/full_stack/spot_lio_sam.launch.py
#   src/control/rover_launch/launch/auxilary/lio_sam.launch.py
#   src/control/rover_launch/config/lio_sam/lio_sam.yaml
#   src/control/rover_launch/config/drivers/driver_ouster.yaml
#   src/control/rover_launch/config/spot.yaml
#
# SuperOdom is in the tree but COLCON_IGNORE'd. The built, launched stack is
# LIO-SAM on the payload Ouster (192.168.50.165) plus VectorNav
# (/dev/vectornav → ttyUSB0). Body control is Clearpath spot_driver to
# 192.168.50.3 — do not start that without a person at the e-stop.
robot_type: boston_dynamics_spot
ros_distro: humble
network_iface: auto

# Body 1100 x 500 mm. Circumscribed radius is 0.604 m; round up so the UI
# never draws a footprint smaller than the chassis. The registered-cloud map
# path also reuses this to reject lidar returns from the body/legs.
footprint_radius: 0.61
# Body rectangle in `base_frame` (body), x forward / y left.
footprint:
  - [0.550, 0.250]
  - [0.550, -0.250]
  - [-0.550, -0.250]
  - [-0.550, 0.250]

# LIO-SAM publishes map -> odom_link -> lidar_link. lidar_link is yawed 90°
# from the chassis (static TF in spot.launch.py, copied from MIST). The GUI
# triangle and footprint must follow body, not the lidar, or Spot looks a
# quarter-turn off the map. /lio_sam/mapping/odometry is odom_link ->
# odom_mapping; the adapter pose is the TF lookup, not that message.
map_frame: map
base_frame: body
lidar_height_m: 0.500

# LIO-SAM starts the map at the first lidar pose. The payload lidar is near
# 0.500 m above the floor, which is the current
# map-frame floor reference; calibrate floor_z if the live SLAM origin differs.
map_cloud_height_band:
  floor_z: -0.500
  min_z: 0.150
  max_z: 1.800
retain_free_space: true

topics:
  odom: /lio_sam/mapping/odometry
  map: ""                 # LIO-SAM publishes no OccupancyGrid
  map_cloud: /lio_sam/mapping/cloud_registered
  # LIO-SAM's path is an odometry/history trail, not Spot's Trajectory route.
  # Clearpath's Trajectory action does not expose a planned-path topic.
  plan: ""
  # Point nav uses /trajectory (not Nav2). Joystick uses /cmd_vel. Both need
  # the driver, a claimed lease, and a standing robot.
  cmd_vel: /cmd_vel
  body_pose: /body_pose
  # Spot's driver publishes one charge record per pack in this custom array.
  # The adapter collapses it to the lowest valid pack percentage for the UI.
  battery: /status/battery_states
  camera: /d435/camera/color/image_raw
  camera_compressed: /d435/camera/color/image_raw/compressed
  camera_depth: /d435/camera/aligned_depth_to_color/image_raw
  camera_info: /d435/camera/aligned_depth_to_color/camera_info
  camera_color_info: ""
  camera_depth_points: ""
  nav_cmd_vel: ""
  # Spot uses its trajectory stack rather than Nav2; no costmap topics.
  global_costmap: ""
  local_costmap: ""

# Click-to-pose is Clearpath /trajectory, the same action
# spot_high_level_controller uses. Goals are TF'd map -> body.
actions:
  navigate_to_pose: ""
  trajectory: /trajectory

# A point goal has no requested final yaw. Differential mode decomposes it into
# rotate, straight-drive, and (when requested) final-rotate actions. Every drive
# target sent by the adapter has body y=0. Spot's SDK still needs a small,
# non-zero lateral mobility allowance for its gait/obstacle planner; an exactly
# zero y velocity limit makes even a straight trajectory report BLOCKED on the
# current robot software. The duration is each phase's timeout, not its speed.
trajectory:
  frame: body
  # Between diff-drive phases the adapter re-checks remaining map-frame error
  # to decide whether another rotate/drive step is needed (see
  # _continue_diff_trajectory). `frame` above is fixed at "body" (Spot's
  # driver rejects any other frame_id on the outgoing command), but body only
  # updates at LIO-SAM mapOptimization's keyframe rate (~5 Hz). If that
  # re-check reads a stale, pre-phase position, the adapter concludes the
  # robot hasn't arrived yet and issues another phase, which looks like the
  # robot failing to stop. progress_frame is read-only, purely for computing
  # those numbers faster (~200 Hz, spot.launch.py's tf_imubody_bodyfast) --
  # it never reaches Spot's driver. Do not point base_frame or anything
  # feeding the collaborative pose graph at body_fast: its Z drifts
  # continuously (unlike X/Y, which track body closely) since it rides IMU
  # dead-reckoning between corrections.
  progress_frame: body_fast
  duration_s: 30.0
  precise_positioning: true
  disable_obstacle_avoidance: false
  control_mode: differential
  position_tolerance_m: 0.15
  heading_tolerance_rad: 0.08
  minimum_progress_m: 0.03
  minimum_progress_rad: 0.02
  max_diff_drive_steps: 8
  velocity_limit:
    linear_x: 0.25
    linear_y: 0.05
    angular_z: 0.5

# Clearpath spot_driver services. MIST's spot.yaml leaves `spot_name` empty, so
# these are un-namespaced. The body controls are Triggers; max_velocity uses
# spot_msgs/SetVelocity. Advertising `body` shows Claim/Release and Sit/Stand;
# they no-op until --profile driver.
services:
  claim: /claim
  release: /release
  sit: /sit
  stand: /stand
  set_stand_height: /set_stand_height
  power_on: /power_on
  stop: /stop
  # Software e-stop allow, plus drop a leftover tablet keepalive that holds
  # motors off after Claim already took the lease.
  estop_release: /estop/release
  clear_keepalive: /clear_keepalive
  max_velocity: /max_velocity

perception:
  depth_max_age_s: 1.0

rates:
  state_hz: 5.0
  map_period_s: 4.0
  cloud_period_s: 4.0
  camera_period_s: 0.2
  keyframe_period_s: 2.0

drive_timeout_s: 0.45
