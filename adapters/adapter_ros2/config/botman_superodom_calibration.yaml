%YAML:1.0

# os_lidar -> vectornav for Botman. MEASURED 2026-08-27.
#
# Recorded with scripts/calibration/calibrate_imu_to_imu.py: the VN-100's gyro
# compared against the Ouster's internal gyro while the chassis was rocked by
# hand, then composed with the Ouster's factory os_lidar -> os_imu transform
# (a 180 deg yaw, from lidar_to_sensor_transform in the sensor's metadata).
#
#   R (/vectornav/imu <- /ouster/imu) : roll 0.88, pitch 0.45, yaw 87.48 deg
#   R (os_lidar -> /vectornav/imu)    : roll -0.88, pitch -0.45, yaw -92.52 deg
#
#   excitation: singular values [16.75, 10.58, 0.77], second-axis ratio 0.632
#   residual RMS 0.0177 rad/s over 2407 samples, stamp offset -0.005 s
#
# THE YAW IS THE WHOLE POINT, AND IT IS NOT A ROUND NUMBER.
#   The VN-100 is mounted about 90 deg to the chassis, not aligned with it:
#   base_link -> vectornav works out at +87.5 deg. Identity would have been
#   ~92 deg wrong. So would the 180 deg that os_lidar's own mounting suggests.
#   An in-place yaw spin cannot see this at all, which is why it took a rock
#   about a second axis to measure.
#
# CROSS-CHECK: the angle between the vectornav and os_lidar z axes comes out at
#   0.99 deg here, against 1.46 deg from the completely independent in-place
#   spin in calibrate_imu_motion.py. Two methods, 0.47 deg apart.
#
# TRANSLATION IS ZERO ON PURPOSE, AND STAYS ZERO. Do NOT copy the Ouster's
#   internal lever arm here; see aslan_superodom_calibration.yaml.
#
#   The original reason was that two gyros cannot determine it -- angular
#   velocity is the same everywhere on a rigid body. That reason expired: the
#   accelerometer-pair solve added to calibrate_imu_to_imu.py measured it on
#   2026-08-31, and in this file's imu^T_laser convention it is
#   [-0.05620900, 0.00573200, 0.28488800]. Note that is NOT the vector the TF
#   publishes; the TF carries laser^T_imu, and imu^T_laser = -imu^R_laser
#   . laser^T_imu, which for a ~90 deg mount is a very different vector.
#
#   It is still zero because filling it in was measured and did not help.
#   imuPreintegration.cpp:514 applies the lever arm as
#     acc += ((gyr - gyr_pre) * 200).cross(-T) + gyr.cross(gyr.cross(-T))
#   with the 200 hard-coded, so at our 100 Hz the tangential half is 2x too
#   large. Static 120 s windows, |yaw| deg/min and position m/min:
#
#     100 Hz, T=0    n=6   0.0113   0.0022   <- what we run
#     200 Hz, T=0    n=4   0.0612   0.0072
#     200 Hz, T set  n=6   0.0147   0.0030
#
#   Correcting the rate to make the hard-coded 200 true, then enabling T,
#   lands within noise of where zero already was. The term is worth
#   sub-millimetre per 100 ms scan interval and the lidar re-anchors before it
#   accumulates, which is why it does not show up. Enabling it is only worth
#   revisiting if line 514 is fixed upstream to use the real sample interval.

# Rotation from laser frame to imu frame, imu^R_laser
extrinsicRotation_imu_laser: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [-0.04391730,  0.99891056,  0.01577839,
         -0.99900375, -0.04403570,  0.00723641,
          0.00792334, -0.01544486,  0.99984933]

# Translation from laser frame to imu frame, imu^T_laser
extrinsicTranslation_imu_laser: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [0.0, 0.0, 0.0]

imu_laser_rotation_offset: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [0.0, 0.0, 0.0]

yaw_ratio: 0.0
