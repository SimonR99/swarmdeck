# AgileX Bunker "aslan" (SSH alias `aslan`) running ROS 2 Humble from the
# `bunker:dev` image with `/ssd/mist_ws_ros2` mounted at `/workspace`.
#
# The live sensor/SLAM interfaces are supplied by SuperOdometry and match the
# other Bunker in the fleet. Aslan's Ouster is an OS-0-64 at 192.168.2.118 on
# VLAN 2 (udp dest 192.168.2.2); bunker:dev pins ROS_DOMAIN_ID=49. SwarmDeck
# keeps a distinct robot ID and Nav2 namespace so both machines can share the
# same backend safely.
robot_type: agilex_bunker
ros_distro: humble
network_iface: auto

# Bunker is 1.023 x 0.778 m. Keep the conservative circumscribed radius used
# for the other physical Bunker until a calibrated lidar/base transform exists.
# The registered-cloud map path also reuses it to reject chassis self-returns.
footprint_radius: 0.65

map_frame: map
base_frame: os_lidar

map_cloud_height_band:
  min_z: -0.3
  max_z: 0.5

topics:
  odom: /laser_odometry
  map: ""
  map_cloud: /registered_scan
  plan: ""
  cmd_vel: /cmd_vel
  battery: ""
  # OAK-D on USB (03e7:2485). The default camera service runs the RGB-D profile
  # so detections can be projected onto the map. The aligned stereo stream and
  # its CameraInfo share the RGB pixel grid; the mount TF is published by the
  # Aslan oak_mount_tf service.
  camera: ""
  camera_compressed: /oak/rgb/image_raw/compressed
  camera_depth: /oak/stereo/image_raw
  camera_info: /oak/stereo/camera_info
  # Nav2 never publishes to the physical driver. The adapter relays this
  # isolated output only while its own NavigateToPose goal is active.
  nav_cmd_vel: /aslan_0/cmd_vel_nav

actions:
  navigate_to_pose: /aslan_0/navigate_to_pose

# Same 8 s / 16 s workaround as Botman: Aslan joins the live session as a
# non-reference robot, so every map/cloud ingest re-runs grid registration.
# See adapters/adapter_ros2/config/bunker.yaml.
rates:
  state_hz: 5.0
  map_period_s: 8.0
  cloud_period_s: 16.0
  camera_period_s: 0.2

drive_timeout_s: 0.45
