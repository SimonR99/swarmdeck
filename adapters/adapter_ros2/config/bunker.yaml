# AgileX Bunker "botman" (SSH alias `botman`) running the MIST ROS 2 Humble
# workspace in /ssd/mist_ws. Values below come from the robot's primary source:
#
#   src/control/rover_launch/launch/bunker_gnm.launch.py
#   src/control/rover_launch/config/superodom/os1_128.yaml
#   src/localization/SuperOdom/super_odometry/src/{LaserMapping,ImuPreintegration}
#   src/driver/bunker_ros2/bunker_base/include/bunker_base/bunker_messenger.hpp
#   bag5_/metadata.yaml
#
# SuperOdometry runs with `localization_mode: false`, i.e. SLAM/mapping mode,
# and uses /ouster/points plus /ouster/imu. The robot-side launch command is:
#   ros2 launch rover_launch bunker_gnm.launch.py
robot_type: agilex_bunker
ros_distro: humble

# Bunker is 1.023 x 0.778 m. The circumscribed radius is 0.643 m; round up so
# the UI never draws a footprint smaller than the physical tracked chassis.
# The registered-cloud map path also reuses this radius to reject lidar returns
# from the chassis itself before they become permanent occupied cells.
footprint_radius: 0.65

# SuperOdometry's /laser_odometry carries map -> os_lidar, but the running
# stack does not broadcast that TF; swarmdeck_nav's odom_to_tf bridge does.
# The Bunker driver separately publishes odom -> base_link, with no calibrated
# transform connecting the trees, so os_lidar remains the honest SLAM pose.
map_frame: map
base_frame: os_lidar

# /registered_scan is already transformed into `map`. SuperOdometry starts the
# map at the lidar pose, so this band selects returns near lidar height while
# rejecting most floor and ceiling points. Verify against the first live map.
map_cloud_height_band:
  min_z: -0.3
  max_z: 0.5

topics:
  # SuperOdometry's confirmed live map-frame pose. The launch advertises
  # /state_estimation too, but that topic has no publisher on Botman.
  odom: /laser_odometry
  map: ""                 # SuperOdometry publishes no OccupancyGrid
  map_cloud: /registered_scan
  plan: ""
  cmd_vel: /cmd_vel       # bunker_messenger.hpp's absolute subscription
  # The driver exposes battery_voltage in custom BunkerStatus, not a
  # sensor_msgs/BatteryState percentage, so do not advertise battery yet.
  battery: ""
  camera: ""
  # Botman's camera is an OAK-D Pro (MXID 1844301041D4AB0F00), not a V4L2
  # webcam, so it deliberately has no /dev/video0.  The SwarmDeck-owned
  # `oak_camera` Compose service launches the existing depthai_ros_driver from
  # the read-only MIST image and encodes MJPEG on-device at this topic.
  camera_compressed: /oak/rgb/image_raw/compressed
  # Depth, for placing a duck detection on the map rather than only in the video
  # frame. The OAK-D Pro is a stereo depth camera, so this needs no new hardware
  # — only the RGBD pipeline, which is opt-in because it costs USB bandwidth on
  # a robot whose video path was tuned measurement by measurement. Live only
  # when the `oak_camera` service runs botman_oak_rgbd.yaml; otherwise these
  # topics simply never publish and detections stay bbox-only.
  #
  # `camera_info` is the STEREO one deliberately. With `i_align_depth: true` it
  # describes the depth image the adapter deprojects — the colour intrinsics at
  # the depth image's own size. The rgb topic would be right only for as long as
  # the two happened to share a resolution.
  camera_depth: /oak/stereo/image_raw
  camera_info: /oak/stereo/camera_info
  # A marker also needs `map` -> the OAK's optical frame, and the live TF tree
  # has no calibrated edge onto the camera (the same missing calibration that
  # keeps the Nav2 footprint centred on os_lidar — see docs/botman.md). Measure
  # the mount and give it to the `oak-depth` Compose profile. Until then the
  # adapter logs the failed lookup and reports no position, which is the
  # intended behaviour: an invented coordinate is worse than none.

  # Nav2 is namespaced, but its sensor/driver inputs stay on Botman's existing
  # global topics. Its smoothed velocity is deliberately isolated from the
  # real driver: HardwareBridge relays it to /cmd_vel only for an active goal,
  # keeping teleop, cancellation and e-stop authoritative.
  nav_cmd_vel: /botman_0/cmd_vel_nav

actions:
  navigate_to_pose: /botman_0/navigate_to_pose

rates:
  state_hz: 5.0
  map_period_s: 2.0
  cloud_period_s: 4.0
  camera_period_s: 0.2

drive_timeout_s: 0.45
