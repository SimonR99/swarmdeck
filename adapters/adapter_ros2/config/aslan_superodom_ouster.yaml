# SuperOdometry for Aslan with Ouster IMU.
#
# imu_topic is /ouster/imu. Pair this with aslan_superodom_ouster_calibration.yaml
# (which applies 180 degree yaw rotation from os_lidar to os_imu).
/**:
  ros__parameters:
    imu_topic: "/ouster/imu"
    laser_topic: "/ouster/points"
    sensor: "ouster"
    use_imu_roll_pitch: false
    save_ply: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "os_lidar"
    sensor_frame_rot: "os_lidar_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    feature_extraction_node:
        scan_line: 64
        min_range: 0.2
        filter_point_size: 3

    laser_mapping_node:
        mapping_line_resolution: 0.1
        mapping_plane_resolution: 0.2
        max_iterations: 5
        max_surface_features: 2000
        localization_mode: false
        read_pose_file: false
        init_x: 0.0
        init_y: 0.0
        init_z: 0.0
        init_roll: 0.0
        init_pitch: 0.0
        init_yaw: 0.0

    imu_preintegration_node:
        lidar_correction_noise: 0.01
# MEASURED on aslan 2026-09-03: overlapping Allan deviation at tau = 1 s
        # over a 600 s static log (59.8k samples at ~99.9 Hz), RMS across the
        # three axes. The previous values were byte-identical across all four
        # robot configs to 17 significant figures, VN-100 and Ouster alike, so
        # they came from an upstream sample rather than from these devices.
        # They over-stated gyro noise ~4x, which made the estimator discount a
        # gyro that is better than advertised.
        acc_n: 5.835208e-03
        gyr_n: 3.680869e-04
        acc_w: 6.4356659353532566e-05
        gyr_w: 3.5640318696367613e-05
# This unit's static |a| reads 9.6732 m/s^2, -0.1332 m/s^2 (-1.358 %) from
        # local gravity. That offset is device-specific -- the two OS0-64 units
        # in this fleet disagree with each other by 1.75 % -- so it is left for
        # the bias state to absorb rather than being folded in here.
# g_norm MUST equal what this IMU (aslan's Ouster IMU) reads when static, NOT true local gravity.
        #
        # That is the opposite of what the name suggests, and it was established
        # by experiment on aslan 2026-09-03. Setting the physically correct local
        # value (9.8064, Somigliana on WGS84 for 45.5048 N at ~80 m) made
        # imu_preintegration diverge: "Large bias, reset IMU-preintegration!"
        # 1.67 times a second, odometry yaw drifting +7.43 deg/min and position
        # 0.135 m/min while the robot sat still, with the gyro measuring
        # -0.085 deg/s. Reverting g_norm alone -- keeping the measured noise
        # densities -- gave 0 resets, +0.015 deg/min and 0.0007 m/min.
        #
        # The reason is that GTSAM gets gravity from this
        # (PreintegrationParams::MakeSharedU) and the residual against a
        # miscalibrated accelerometer has to be carried by the bias state.
        # failureDetection() trips at ba.norm() > 2.0, and with acc_w at 6.4e-05
        # the bias cannot track a standing offset before the solve runs away.
        # A device that reads 9.6732 m/s^2 therefore needs g_norm 9.6732, and the
        # accelerometer's true error stays invisible to the estimator.
        g_norm: 9.6732
