# SuperOdometry for Botman. SwarmDeck-owned copy of the MIST workspace's
# os1_128.yaml, which cannot be edited: /ssd/mist_ws is bind-mounted read-only.
#
# TWO THINGS DIFFER FROM THE UPSTREAM FILE.
#
# 1. imu_topic is /vectornav/imu, not /ouster/imu. The VN-100 is a far quieter
#    IMU than the Ouster's internal part, and SuperOdometry is IMU-first: it
#    falls back to IMU-only propagation whenever lidar is late or missing, so
#    the IMU sets the floor on odometry quality.
#
# 2. The calibration file is Botman's own. This is the load-bearing half, see
#    botman_superodom_calibration.yaml: the upstream calibration ships an
#    IDENTITY lidar-to-IMU rotation, and identity is wrong by 180 degrees for
#    EITHER IMU on this robot.
#
# The filename upstream says os1_128; the sensor is an OS-0-64-U13. scan_line
# below is 64, which is correct, and is the only place the beam count enters.
/**:
  ros__parameters:
    imu_topic: "/vectornav/imu"
    laser_topic: "/ouster/points"
    sensor: "ouster"
    use_imu_roll_pitch: false
    save_ply: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "os_lidar"
    sensor_frame_rot: "os_lidar_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    feature_extraction_node:
        scan_line: 64
        min_range: 0.2
        filter_point_size: 3

    laser_mapping_node:
        mapping_line_resolution: 0.1
        mapping_plane_resolution: 0.2
        max_iterations: 5
        max_surface_features: 2000
        localization_mode: false
        read_pose_file: false
        init_x: 0.0
        init_y: 0.0
        init_z: 0.0
        init_roll: 0.0
        init_pitch: 0.0
        init_yaw: 0.0

    imu_preintegration_node:
        lidar_correction_noise: 0.01
        # VN-100 figures. The upstream values were tuned for the Ouster's
        # internal IMU; the VN-100 is quieter, and overstating the noise makes
        # the estimator trust lidar more than it should.
        # Measured static on Botman 2026-08-27, 1200 samples at 200 Hz:
        #   accel 1 sd [0.0122, 0.0132, 0.0225] m/s^2
        #   gyro  bias [1.7e-5, -1.9e-5, -4e-6] rad/s
# MEASURED on botman's VN-100 2026-09-03: overlapping Allan deviation at
        # tau = 1 s over a 600 s static log (59.8k samples at 100.2 Hz), RMS
        # across the three axes. This is the config botman actually runs, so
        # these are the numbers that matter for its odometry.
        #
        # For scale, the same measurement on botman's Ouster IMU gave
        # acc_n 5.081e-03 and gyr_n 4.482e-04: the VN-100 is 3.5x quieter in
        # acceleration, 6.9x quieter in rate, and its static gyro bias is
        # 0.0003 deg/s against the Ouster's 0.696 deg/s.
        acc_n: 1.446463e-03
        gyr_n: 6.509476e-05
        acc_w: 6.4356659353532566e-05
        gyr_w: 3.5640318696367613e-05
# g_norm MUST equal what this IMU (botman's VN-100) reads when static, NOT true local gravity.
        #
        # That is the opposite of what the name suggests, and it was established
        # by experiment on aslan 2026-09-03. Setting the physically correct local
        # value (9.8064, Somigliana on WGS84 for 45.5048 N at ~80 m) made
        # imu_preintegration diverge: "Large bias, reset IMU-preintegration!"
        # 1.67 times a second, odometry yaw drifting +7.43 deg/min and position
        # 0.135 m/min while the robot sat still, with the gyro measuring
        # -0.085 deg/s. Reverting g_norm alone -- keeping the measured noise
        # densities -- gave 0 resets, +0.015 deg/min and 0.0007 m/min.
        #
        # The reason is that GTSAM gets gravity from this
        # (PreintegrationParams::MakeSharedU) and the residual against a
        # miscalibrated accelerometer has to be carried by the bias state.
        # failureDetection() trips at ba.norm() > 2.0, and with acc_w at 6.4e-05
        # the bias cannot track a standing offset before the solve runs away.
        # A device that reads 9.8719 m/s^2 therefore needs g_norm 9.8719, and the
        # accelerometer's true error stays invisible to the estimator.
        g_norm: 9.8719
