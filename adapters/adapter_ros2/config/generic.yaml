# Minimal starting point for an unknown ROS 2 robot. Everything optional is
# disabled: an adapter must never advertise a capability it cannot honour
# (protocol rule 4), so empty topics mean the GUI simply shows no control for
# that function rather than showing one that times out.
robot_type: generic
footprint_radius: 0.35

navigation_frame: odom
base_frame: base_link

topics:
  odom: odom
  plan: ""
  cmd_vel: cmd_vel
  battery: ""
  camera: ""
  camera_compressed: ""
  # Preferred depth source: RGB-aligned depth image plus its intrinsics.
  # Set `camera_color_info` as well when depth is *not* aligned to colour.
  camera_depth: ""
  camera_info: ""
  camera_color_info: ""
  # Optional organised PointCloud2 aligned pixel-for-pixel with the RGB image.
  camera_depth_points: ""

actions:

perception:
  depth_max_age_s: 1.0

rates:
  state_hz: 5.0
  camera_period_s: 0.2

drive_timeout_s: 0.45

# Route progress watchdog (adapters/route_progress.py). Nav2's progress checker
# measures displacement and is satisfied by a robot rocking on a step it cannot
# climb; this cancels a FollowPath goal as a no-progress failure when the closest
# route point has not advanced route_progress_min_m within
# route_progress_timeout_s. 0 disables it.
route_progress_timeout_s: 30.0
route_progress_min_m: 0.5
