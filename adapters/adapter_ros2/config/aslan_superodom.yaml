# SuperOdometry for Aslan with the VectorNav VN-100 IMU. THIS IS THE DEFAULT,
# selected by deploy/robots/aslan.env; aslan_superodom_ouster.yaml is the
# fallback to the Ouster's internal IMU.
#
# imu_topic is /vectornav/imu. Paired with aslan_superodom_calibration.yaml
# (measured extrinsic rotation: roll -0.03 deg, pitch -0.85 deg, yaw -90.65 deg).
# Both files move together with ASLAN_IMU_TOPIC and ASLAN_START_VECTORNAV: a
# config naming one IMU while the topic carries another diverges silently.
/**:
  ros__parameters:
    imu_topic: "/vectornav/imu"
    laser_topic: "/ouster/points"
    sensor: "ouster"
    use_imu_roll_pitch: false
    save_ply: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "os_lidar"
    sensor_frame_rot: "os_lidar_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    feature_extraction_node:
        scan_line: 64
        min_range: 0.2
        filter_point_size: 3

    laser_mapping_node:
        mapping_line_resolution: 0.1
        mapping_plane_resolution: 0.2
        max_iterations: 5
        max_surface_features: 2000
        localization_mode: false
        read_pose_file: false
        init_x: 0.0
        init_y: 0.0
        init_z: 0.0
        init_roll: 0.0
        init_pitch: 0.0
        init_yaw: 0.0

    imu_preintegration_node:
        lidar_correction_noise: 0.01
        # INHERITED from botman's VN-100, not measured on aslan's own unit.
        # Botman's figures come from an overlapping Allan deviation at tau = 1 s
        # over a 600 s static log (59.8k samples at 100.2 Hz), RMS across the
        # three axes, measured 2026-09-03.
        #
        # This is a same-model transfer (both are VN-100s), which is a far
        # weaker assumption than the one f2bf0a7 removed: the values these
        # replace were an upstream sample shared byte-identically by the VN-100
        # and Ouster configs alike, and they overstate VN-100 gyro noise by 24x
        # (1.564e-03 against a measured 6.509e-05). Overstating gyro noise makes
        # the estimator discount a gyro that is better than advertised, so
        # unit-to-unit spread between two VN-100s is the smaller error by far.
        #
        # Re-measure on aslan and replace:
        #   python3 scripts/calibration/measure_imu_static.py \
        #       --topic /vectornav/imu --duration 600
        acc_n: 1.446463e-03
        gyr_n: 6.509476e-05
        acc_w: 6.4356659353532566e-05
        gyr_w: 3.5640318696367613e-05
        # g_norm MUST equal what THIS IMU reads when static, NOT true local
        # gravity. That is the opposite of what the name suggests, and it was
        # established by experiment on aslan 2026-09-03: see the long note in
        # aslan_superodom_ouster.yaml. Setting the physically correct local
        # value made imu_preintegration diverge, resetting 1.67 times a second
        # with odometry yaw drifting +7.43 deg/min while the robot sat still.
        #
        # The offset is device-specific and cannot be borrowed: aslan's Ouster
        # reads 9.6732, botman's Ouster 9.8445 (1.75 % apart), botman's VN-100
        # 9.8719. So botman's VN-100 value is NOT valid here either.
        #
        # UNMEASURED. Aslan's VN-100 has never been recorded, because
        # ASLAN_START_VECTORNAV was false until this config became the default.
        # The value below is the upstream default and is almost certainly wrong
        # for this device. scripts/aslan-build-overlay refuses to deploy while
        # it is still 9.80511.
        #
        # To measure it, with the robot powered, level and completely still:
        #   python3 scripts/calibration/measure_imu_static.py \
        #       --topic /vectornav/imu --duration 600
        # then set g_norm to the reported mean |a|.
        g_norm: 9.80511
