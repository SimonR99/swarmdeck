# SuperOdometry for Aslan with the VectorNav VN-100 IMU. THIS IS THE DEFAULT,
# selected by deploy/robots/aslan.env; aslan_superodom_ouster.yaml is the
# fallback to the Ouster's internal IMU.
#
# imu_topic is /vectornav/imu. Paired with aslan_superodom_calibration.yaml
# (measured extrinsic rotation: roll -0.03 deg, pitch -0.85 deg, yaw -90.65 deg).
# Both files move together with ASLAN_IMU_TOPIC and ASLAN_START_VECTORNAV: a
# config naming one IMU while the topic carries another diverges silently.
/**:
  ros__parameters:
    imu_topic: "/vectornav/imu"
    laser_topic: "/ouster/points"
    sensor: "ouster"
    use_imu_roll_pitch: false
    save_ply: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "os_lidar"
    sensor_frame_rot: "os_lidar_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    feature_extraction_node:
        scan_line: 64
        min_range: 0.2
        filter_point_size: 3

    laser_mapping_node:
        mapping_line_resolution: 0.1
        mapping_plane_resolution: 0.2
        max_iterations: 5
        max_surface_features: 2000
        localization_mode: false
        read_pose_file: false
        init_x: 0.0
        init_y: 0.0
        init_z: 0.0
        init_roll: 0.0
        init_pitch: 0.0
        init_yaw: 0.0

    imu_preintegration_node:
        lidar_correction_noise: 0.01
        # MEASURED on aslan's own VN-100 2026-09-04: overlapping Allan
        # deviation at tau = 1 s over a 600 s static log (59908 samples at
        # 100.16 Hz, 0.19 % dropped), RMS across the three axes.
        #
        #   Allan dev @1s  accel [1.216e-03, 1.170e-03, 1.795e-03]
        #                  gyro  [7.640e-05, 6.648e-05, 6.568e-05]
        #   accel 1 sd     [0.0121, 0.0188, 0.0184] m/s^2
        #   gyro bias      0.0007 deg/s
        #
        # These replace an upstream sample shared byte-identically by the
        # VN-100 and Ouster configs alike, which overstated this gyro's noise
        # by 22x (1.564e-03 against 6.969e-05) and so made the estimator
        # discount a gyro far better than advertised.
        #
        # For scale, aslan's own Ouster measured 5.835e-03 and 3.681e-04 the
        # same way: the VN-100 is 4.1x quieter in acceleration and 5.3x quieter
        # in rate, which is why it is worth the extra driver.
        acc_n: 1.422605e-03
        gyr_n: 6.969057e-05
        # acc_w / gyr_w need the Allan deviation's rising right-hand slope,
        # which a ten-minute log does not reach. Left as they were.
        acc_w: 6.4356659353532566e-05
        gyr_w: 3.5640318696367613e-05
        # g_norm MUST equal what THIS IMU reads when static, NOT true local
        # gravity. That is the opposite of what the name suggests, and it was
        # established by experiment on aslan 2026-09-03: see the long note in
        # aslan_superodom_ouster.yaml. Setting the physically correct local
        # value made imu_preintegration diverge, resetting 1.67 times a second
        # with odometry yaw drifting +7.43 deg/min while the robot sat still.
        #
        # MEASURED 2026-09-04 as the mean |a| of the log above. This unit reads
        # 9.7666 against a local gravity of 9.8064, an offset of -0.406 %.
        #
        # THE OFFSET IS DEVICE-SPECIFIC AND CANNOT BE BORROWED, and this
        # measurement is what shows it for the VN-100 rather than assuming it:
        # botman's VN-100, the same model, reads 9.8719. The two disagree by
        # 1.08 %, alongside the 1.75 % between the fleet's two OS0-64s. Had
        # botman's value been copied here it would have been 0.105 m/s^2 out,
        # which is most of the offset that made the Ouster diverge.
        #
        # VALIDATED ON THE ROBOT 2026-09-04, which is the check this value
        # exists to pass. Deployed on the VN-100 and left standing 300 s (2930
        # samples at 9.76 Hz): position drift 0.0010 m/min, yaw drift
        # 0.0024 deg/min, and exactly ONE "Large bias, reset
        # IMU-preintegration!" in 15 minutes, a startup transient 2 s after the
        # driver connected. The divergent case this guards against ran at 1.67
        # resets a SECOND, 0.135 m/min and 7.43 deg/min; the corrected Ouster
        # run gave 0.0007 m/min and 0.015 deg/min, so yaw here is 6x better,
        # which is what an IMU 5.3x quieter in rate should buy.
        #
        # These are STATIONARY figures. They show the estimator does not run
        # away at rest; drift under motion is a separate question.
        #
        # Do not read "Update failed due to underconstrained call to isam2 in
        # imuPreintegration" (with the failureDetected beside it) as this
        # value being wrong. It is the stationary degenerate case, not a
        # g_norm symptom: laser_mapping logs "very small motion, not
        # accumulating" and adds no lidar constraints, so iSAM2 has nothing to
        # constrain the new pose and bias. Botman shows the identical
        # signature on its own VN-100, and it comes with no measurable drift.
        #
        # Re-measure with:
        #   python3 scripts/calibration/measure_imu_static.py \
        #       --topic /vectornav/imu --duration 600
        g_norm: 9.7666
