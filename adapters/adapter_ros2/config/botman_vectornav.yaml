# VectorNav VN-100 on Botman (/dev/vectornav -> /dev/ttyUSB0).
# Verified on Botman: 921600 baud, 200 Hz output rate, ENU coordinate frames.
#
# 200 Hz IS REQUIRED, and 921600 baud with it. At 100 Hz the IMU stream loses a
# sub-millisecond race with the lidar and SuperOdometry throws whole scans away:
#
#   meas_end_time 1788550756.131881 < 1788550756.132066 lidar_end_time
#   All the lidar data is more recent than all the imu data. Will throw away
#   lidar frame / sync unsuccessfull, skipping scan frame
#
# Measured 2026-09-04: the deficit is a median of 0.589 ms, with 153 of 200
# samples under 1 ms -- the newest IMU sample is a hair behind the scan end.
# At 100 Hz (10 ms between samples) that cost 237 dropped scans per minute and
# collapsed /laser_odometry to 2.2 Hz. At 200 Hz (5 ms) it is 0 drops per
# minute and 10.0-11.1 Hz, sustained.
#
# The device refuses 200 Hz on 115200 with 'InsufficientBaudRate': 48 B
# payload, ~54 B framed, 93.8% of the link. 921600 runs it at 11.7%.
vectornav:
  ros__parameters:
    port: "/dev/vectornav"
    baud: 921600
    reconnect_ms: 500
    AsyncDataOutputType: 0           # VNOFF, binary only
    AsyncDataOutputFrequency: 1
    syncInMode: 3
    syncInEdge: 0
    syncInSkipFactor: 0
    syncOutMode: 0
    syncOutPolarity: 0
    syncOutSkipFactor: 0
    syncOutPulseWidth_ns: 100000000
    serialCount: 0
    serialStatus: 0
    spiCount: 0
    spiStatus: 0
    serialChecksum: 1
    spiChecksum: 0
    errorMode: 1
    BO1:
      asyncMode: 1                   # port 1 only
      rateDivisor: 4                 # 800 Hz / 4 = 200 Hz
      # TimeStartup + Qtn + AngularRate + Accel
      commonField: 0x131
      timeField: 0x0000
      imuField: 0x0000
      attitudeField: 0x0000
      gps2Field: 0x0000
    BO2:
      asyncMode: 0
      rateDivisor: 0
      commonField: 0x0000
      timeField: 0x0000
      imuField: 0x0000
      gpsField: 0x0000
      attitudeField: 0x0000
      insField: 0x0000
      gps2Field: 0x0000
    BO3:
      asyncMode: 0
      rateDivisor: 0
      commonField: 0x0000
      timeField: 0x0000
      imuField: 0x0000
      gpsField: 0x0000
      attitudeField: 0x0000
      insField: 0x0000
      gps2Field: 0x0000
    frame_id: "vectornav"

vn_sensor_msgs:
  ros__parameters:
    # VN body is Forward-Right-Down. ROS / UltraFusion want x-forward, y-left, z-up (ENU).
    use_enu: true
    orientation_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    angular_velocity_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    linear_acceleration_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    magnetic_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
