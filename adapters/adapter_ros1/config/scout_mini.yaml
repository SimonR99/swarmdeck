# AgileX Scout Mini "tars" (the `scout` SSH alias) — MIST lab's real ROS 1 stack on
# /ssd/mist_ws. Same topic/frame names as the ROS 2 twin
# (adapters/adapter_ros2/config/scout_mini.yaml — see that file's header for exactly
# which mist_ws files each value came from). This is the one that can actually run:
# tars's autonomy stack IS ROS 1, and this adapter talks rospy directly, so — unlike
# the ROS 2 config — there is no ros1_bridge and no broken native ROS 2 install in the
# way. `python3 adapter_ros1.py --robot-id tars_0 --config config/scout_mini.yaml` needs
# nothing else to start talking to tars's real topics.
#
# Live on tars since 2026-08-06: SLAM, camera, map, and now navigate_to via
# local_planner. See docs/robots/fleet.md for the platform matrix and what
# was verified. navigate_to WILL drive the robot once a goal is sent — see the
# nav_goal/nav_stop comments below before assuming this is inert.
robot_type: scout_mini
network_iface: auto
footprint_radius: 0.43  # circumscribed circle of the 0.62 x 0.585 m base_link box
# Scout Mini rectangle in `base_frame` (base_link_filtered), x forward / y left.
footprint:
  - [0.310, 0.293]
  - [0.310, -0.293]
  - [-0.310, -0.293]
  - [-0.310, 0.293]

# ekf_agx.yaml's single EKF instance publishes odom_lidar -> base_link_filtered, and
# nothing in this stack publishes a "map" frame at all. LVI-SAM's fused input
# (/lvi_sam/lidar/mapping/odometry) is already loop-closure-corrected, so odom_lidar is
# the closest thing this robot has to a fixed/global frame — use it where the protocol
# expects "map". Do not default this back to map/base_link; that pair does not exist here.
map_frame: odom_lidar
base_frame: base_link_filtered

# Ouster is mounted above base_link_filtered; LVI-SAM's frame origin is roughly
# the sensor's own start pose. The measured floor reference below is used to
# express the filter in physical height above the floor rather than making the
# map-origin choice look like a robot-height setting.
#
# MEASURED 2026-08-12, 50k accumulated points of cloud_registered, robust plane
# fit to the returns below -0.35:
#
#   floor:  z = -0.0437*x + 0.0049*y - 0.575     tilt 2.52 deg
#
# The floor is 0.575 m below the frame origin and PITCHED 2.52 degrees, almost
# purely in x — a lidar<->IMU extrinsic/gravity-alignment error, not a sloped
# room, and the same defect docs/robots/fleet.md flags as the reason not to
# trust this robot's displayed pose.
#
# The tilt is a pose problem rather than a mapping one. floor_z is therefore a
# calibrated reference, not a claim that the floor is perfectly level across
# the whole accumulated cloud; recalibrate it if the SLAM origin changes.
#
# The requested physical band is 0.150..0.395 m: 15 cm above the floor through
# the Scout Mini's nominal 0.245 m chassis height plus 15 cm.
map_cloud_height_band:
  floor_z: -0.575
  min_z: 0.150
  max_z: 0.395
retain_free_space: true

topics:
  # /odometry/filtered is the EKF's fused output (fusing LVI-SAM lidar odometry), and is
  # what this stack's own rover_scout_adapter.py subscribes to for pose — prefer it over
  # scout_base_node's raw `odom` wheel odometry.
  odom: /odometry/filtered
  # No OccupancyGrid publisher exists in rover_agx.launch, and none is being added —
  # see map_cloud below instead.
  map: ""
  # LVI-SAM's per-scan registered XYZ cloud, already transformed into odom_lidar
  # (same frame as map_frame above) — confirmed live, ~5 Hz, 2026-08-06. The
  # adapter derives both products from it: a height-filtered XY scan that the
  # backend raytraces into the 2D map, and a coarser XYZ cloud for the GUI's 3D
  # viewer. Nothing new runs on the robot for either path. cloud_registered_raw
  # (undownsampled) also exists if this one proves too sparse.
  map_cloud: /lvi_sam/lidar/mapping/cloud_registered
  # localPlanner's selected local path — the route it actually intends to drive,
  # ~100 poses at 10 Hz. Published in `chassis_link` (a VEHICLE frame, 0.476 m
  # below os_sensor — the same offset as the planner's own sensorOffsetZ), not
  # in map_frame, so _on_plan transforms it through TF before upload. Without
  # this the dashboard drew no route at all for this robot and the only line on
  # the map was the trail it had already driven, which makes "did the planner
  # steer around that, or through it?" unanswerable from the GUI.
  plan: /path
  # scout_messenger.cpp subscribes "/cmd_vel" with a leading slash, so it is the global
  # topic regardless of any namespace scout_base.launch wraps the node in.
  cmd_vel: /cmd_vel
  # Published by rover_scout_adapter.py (control/adapters/scripts/rover_scout_adapter.py)
  # from the driver's ScoutStatus message, not by scout_base_node itself.
  battery: /robot_battery
  camera: ""
  # Colour is the operator's drive camera. Launch it through
  # launch/scout_camera_low_latency.launch — NOT rover_launch/rs_d400.launch,
  # which on this USB 2.1 D435i queues colour until it is too stale to drive.
  # Prefer the compressed topic per the protocol's own guidance (raw at full
  # rate is the most expensive thing an adapter can subscribe to over a
  # robot's network).
  camera_compressed: /d400_arm/color/image_raw/compressed
  # Depth is a separate, unsynced, unaligned stream. 424x240 is not a valid
  # mode on this USB 2.1 D435i, so both streams run 640x480 @ 15 Hz; colour
  # still publishes immediately because enable_sync/align_depth are off.
  # The adapter joins a colour detection box to it via `camera_color_info` and
  # TF rather than making the driver hold colour frames for depth. Map markers
  # therefore update at depth rate; the video does not wait.
  camera_depth: /d400_arm/depth/image_rect_raw
  camera_info: /d400_arm/depth/camera_info
  camera_color_info: /d400_arm/color/camera_info
  # local_planner's localPlanner + pathFollower (mist_ws/.../local_planner_agx.launch,
  # launched separately from the trimmed SLAM launch, 2026-08-06) both subscribe
  # this — the standard RViz "2D Nav Goal" topic, not a custom one. Confirmed from
  # source (goalHandler_pointstamped in both nodes): the pose is used directly as
  # global goalX/goalY, same frame as state_estimation (/odometry/filtered, i.e.
  # map_frame above) — no relative-frame conversion needed on our end.
  nav_goal: /move_base_simple/goal
  # pathFollower's safety-stop input (std_msgs/Int8, 1=halt, 0=resume). Belt
  # and suspenders alongside nav_cmd_vel below — makes pathFollower's own
  # commanded value zero, though it does NOT stop it from publishing (see
  # nav_cmd_vel for why that distinction matters).
  nav_stop: /stop
  # pathFollower publishes cmd_vel CONTINUOUSLY, even with no goal active —
  # confirmed live: ~27 Hz of zero-velocity Twists racing teleop's single
  # publish and winning. launch/local_planner_muxed.launch remaps
  # pathFollower's output here instead of the real /cmd_vel; this adapter is
  # then the only thing that ever publishes the real one, relaying this topic
  # through only while nav_status is "active" (see _on_nav_cmd_vel). Without
  # this, teleop does not reliably work whenever local_planner is running.
  nav_cmd_vel: /cmd_vel_nav
  # pathFollower's linear speed is gated by joySpeed, which joystickHandler sets
  # unconditionally from |axes[1]| — no autonomyMode check, unlike every other
  # speed source it has. Confirmed live: a real path was computing fine but the
  # robot never moved, because nothing publishes a joystick here. This fakes
  # that axis (see nav_joy_throttle) while nav_status is "active".
  # autonomyMode is left false (local_planner_agx_scout.launch default) — true
  # switches the goal source to RelativeSetPointX/Y (/setpoint_position/local),
  # which nothing publishes, and the robot silently reports goalReached for a
  # goal it never looked at. False keeps goalX/Y (/move_base_simple/goal, what
  # we send) as the goal source, which is what nav_goal above depends on.
  nav_joy: /joy

# Rescaled to maxSpeed (0.4 m/s) by pathFollower regardless of magnitude
# (confirmed live) — this mostly just needs to be reliably nonzero.
nav_joy_throttle: 0.5

# No gbplanner (global exploration planner) is running — only local_planner's
# reactive local avoidance, whose adjacentRange is 5 m. A goal beyond what the
# lidar currently sees may not be reachable in one shot; it isn't a global
# path planner.
actions:
  # No move_base (actionlib) runs on tars — navigate_to uses topics.nav_goal
  # above instead (see DEFAULTS in adapter_ros1.py: nav_goal takes priority
  # over this when both are configured). Left pointed at the ROS 1 convention
  # so this resolves automatically if move_base is ever added instead.
  navigate_to_pose: move_base

# Depth is unsynced on this USB 2.1 camera, and the bus still gaps. The
# adapter default of 0.35 s then drops the sample,
# so the overlay has boxes and the map never gets a marker. 1.0 s covers a
# missed depth frame; at Scout Mini speed that is a few centimetres of motion.
perception:
  depth_max_age_s: 1.0

rates:
  state_hz: 5.0
  map_period_s: 2.0
  camera_period_s: 0.2

drive_timeout_s: 0.45   # SwarmDeck protocol default — scout_base_node's own cmd_vel watchdog behavior (if any) was not inspected
