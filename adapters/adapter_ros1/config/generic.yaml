# Minimal starting point for an unknown ROS 1 robot. Everything optional is
# disabled: an adapter must never advertise a capability it cannot honour
# (protocol rule 4), so empty topics mean the GUI simply shows no control for
# that function rather than showing one that times out.
robot_type: generic
footprint_radius: 0.35

map_frame: map
base_frame: base_link

topics:
  odom: odom
  map: map
  plan: ""
  cmd_vel: cmd_vel
  battery: ""
  camera: ""
  camera_compressed: ""
  # Preferred depth source: RGB-aligned depth image plus its intrinsics.
  # Set `camera_color_info` as well when depth is *not* aligned to colour
  # (Scout Mini's low-latency RealSense profile). Leave it empty when
  # `camera_info` already describes aligned depth.
  camera_depth: ""
  camera_info: ""
  camera_color_info: ""
  # Optional organised PointCloud2 aligned pixel-for-pixel with the RGB image.
  # Enables detection map positions without changing the camera preview path.
  camera_depth_points: ""

actions:
  # actionlib namespace for move_base's SimpleActionServer — the ROS 1
  # convention, the way `navigate_to_pose` is the ROS 2/Nav2 one.
  navigate_to_pose: move_base

rates:
  state_hz: 5.0
  map_period_s: 2.0
  camera_period_s: 0.2

drive_timeout_s: 0.45
